<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DVC Trip Value</title>
  <style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #f5f5f5;
  color: #333;
  min-height: 100vh;
}

.header {
  background: linear-gradient(135deg, #1a237e, #4a148c);
  color: white;
  padding: 16px 24px;
  text-align: center;
  position: relative;
}

.header h1 { font-size: 1.3rem; font-weight: 600; margin-bottom: 2px; }
.header .subtitle { font-size: 0.8rem; opacity: 0.8; }

.header .header-links {
  position: absolute;
  right: 24px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  align-items: center;
  gap: 12px;
}

.back-link, .account-link-btn {
  display: inline-block;
  color: white;
  text-decoration: none;
  font-size: 0.75rem;
  font-weight: 600;
  padding: 6px 14px;
  border: 1.5px solid rgba(255,255,255,0.4);
  border-radius: 20px;
  background: rgba(255,255,255,0.1);
  transition: all 0.2s;
}
.back-link:hover, .account-link-btn:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.7); }

.account-btn {
  color: white;
  font: inherit;
  font-size: 0.75rem;
  font-weight: 600;
  padding: 6px 14px;
  border: 1.5px solid rgba(255,255,255,0.4);
  border-radius: 20px;
  background: rgba(255,255,255,0.1);
  cursor: pointer;
  transition: all 0.2s;
}
.account-btn:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.7); }

.page {
  max-width: 820px;
  margin: 24px auto;
  padding: 0 16px 60px;
}

.gate {
  background: white;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  padding: 48px 32px;
  text-align: center;
  color: #666;
}

.gate p { margin-bottom: 18px; font-size: 0.95rem; }

.big-signin-btn {
  background: #4a148c;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 12px 24px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
}
.big-signin-btn:hover { background: #38106b; }

.section {
  background: white;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  padding: 20px 24px;
  margin-bottom: 20px;
}

.section h2 {
  font-size: 1.05rem;
  font-weight: 600;
  color: #1a237e;
  margin-bottom: 4px;
}

.section-sub {
  font-size: 0.8rem;
  color: #888;
  margin-bottom: 16px;
}

.empty-note {
  color: #999;
  font-style: italic;
  font-size: 0.88rem;
  padding: 8px 0 16px;
}

/* ---- Value Story hero ---- */
.story-tiles {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
}

.story-tile {
  text-align: center;
  padding: 14px 8px;
  border-radius: 8px;
  background: #faf8fd;
}

.story-tile-label {
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  color: #888;
  font-weight: 600;
  margin-bottom: 6px;
}

.story-tile-value {
  font-size: 1.5rem;
  font-weight: 700;
}

.story-tile.cost .story-tile-value { color: #b71c1c; }
.story-tile.value .story-tile-value { color: #2e7d32; }
.story-tile.net .story-tile-value { color: #4a148c; }

.story-tile-sub {
  font-size: 0.72rem;
  color: #999;
  margin-top: 4px;
}

/* ---- Contract cost cards ---- */
.contract-cost-card {
  border: 1px solid #e5e5e5;
  border-radius: 8px;
  padding: 14px 16px;
  margin-bottom: 12px;
}

.contract-cost-card:last-child { margin-bottom: 0; }

.contract-cost-name {
  font-weight: 600;
  color: #1a237e;
  font-size: 0.92rem;
  margin-bottom: 8px;
}

.contract-cost-missing {
  font-size: 0.82rem;
  color: #999;
  font-style: italic;
}

.contract-cost-missing a { color: #4a148c; }

.amort-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.78rem;
  margin-top: 8px;
}

.amort-table th {
  text-align: right;
  padding: 5px 8px;
  color: #888;
  font-weight: 600;
  font-size: 0.68rem;
  text-transform: uppercase;
  border-bottom: 1px solid #eee;
}
.amort-table th:first-child { text-align: left; }

.amort-table td {
  text-align: right;
  padding: 5px 8px;
  border-bottom: 1px solid #f5f5f5;
  font-variant-numeric: tabular-nums;
}
.amort-table td:first-child { text-align: left; font-weight: 600; }

.amort-summary {
  display: flex;
  gap: 20px;
  margin-top: 10px;
  font-size: 0.8rem;
  color: #555;
  flex-wrap: wrap;
}
.amort-summary strong { color: #1a237e; }

/* ---- Trip list ---- */
.trip-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 16px;
}

.trip-card {
  border: 1px solid #e5e5e5;
  border-radius: 8px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.trip-main { flex: 1; min-width: 220px; }

.trip-name { font-weight: 600; color: #1a237e; font-size: 0.92rem; }

.trip-meta {
  font-size: 0.78rem;
  color: #666;
  margin-top: 3px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.trip-value {
  text-align: right;
  min-width: 110px;
}

.trip-value-amount { font-size: 1.05rem; font-weight: 700; color: #2e7d32; }
.trip-value-note { font-size: 0.68rem; color: #999; }

.trip-actions { display: flex; gap: 8px; }

.small-btn {
  font-size: 0.78rem;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: 6px;
  border: 1px solid #ccc;
  background: white;
  color: #555;
  cursor: pointer;
}
.small-btn:hover { border-color: #4a148c; color: #4a148c; }
.small-btn.danger:hover { border-color: #c62828; color: #c62828; }

.add-btn {
  background: #4a148c;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 9px 18px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
}
.add-btn:hover { background: #38106b; }

.trip-form {
  border-top: 1px solid #eee;
  margin-top: 16px;
  padding-top: 16px;
  display: none;
}
.trip-form.open { display: block; }

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 16px;
}

.form-field { display: flex; flex-direction: column; gap: 4px; }
.form-field.full { grid-column: 1 / -1; }

.form-field label {
  font-size: 0.7rem;
  text-transform: uppercase;
  font-weight: 600;
  color: #888;
  letter-spacing: 0.4px;
}

.form-field input, .form-field select, .form-field textarea {
  padding: 8px 10px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 0.88rem;
  font-family: inherit;
}

.form-field input:focus, .form-field select:focus, .form-field textarea:focus {
  outline: none;
  border-color: #4a148c;
  box-shadow: 0 0 0 2px rgba(74,20,140,0.15);
}

.cash-mode-toggle { display: flex; gap: 8px; margin-bottom: 8px; }
.cash-mode-toggle button {
  flex: 1;
  padding: 8px;
  border: 1px solid #ccc;
  border-radius: 6px;
  background: white;
  font-size: 0.82rem;
  cursor: pointer;
  color: #555;
}
.cash-mode-toggle button.selected { background: #4a148c; border-color: #4a148c; color: white; }

.estimate-preview {
  font-size: 0.8rem;
  color: #2e7d32;
  background: #e8f5e9;
  padding: 8px 10px;
  border-radius: 6px;
  margin-top: 4px;
}
.estimate-preview.unavailable { color: #999; background: #f5f5f5; }

.field-hint {
  font-size: 0.72rem;
  color: #888;
  min-height: 1em;
}
.field-hint.exact { color: #2e7d32; }

.form-actions { display: flex; gap: 10px; }

.save-btn {
  background: #4a148c;
  color: white;
  border: none;
  border-radius: 6px;
  padding: 9px 20px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
}
.save-btn:hover { background: #38106b; }

.cancel-btn {
  background: white;
  color: #666;
  border: 1px solid #ccc;
  border-radius: 6px;
  padding: 9px 20px;
  font-size: 0.85rem;
  cursor: pointer;
}

.form-error {
  color: #c62828;
  font-size: 0.82rem;
  margin-bottom: 10px;
}

@media (max-width: 560px) {
  .form-grid { grid-template-columns: 1fr; }
  .story-tiles { grid-template-columns: 1fr; }
  .header .header-links { position: static; transform: none; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
}
  </style>
  <script>
    // Injected dynamically (not a static <script async> tag) so this third-party
    // analytics load can never hold up the page's own load/spinner state -- a
    // static tag still counts toward window.onload even with async, so a slow
    // or blocked gc.zgo.at could stall the tab indicator for seconds on some
    // networks even though the app itself has already finished rendering.
    window.addEventListener("load", () => {
      const s = document.createElement("script");
      s.async = true;
      s.src = "//gc.zgo.at/count.js";
      s.setAttribute("data-goatcounter", "https://dvcalc.goatcounter.com/count");
      document.body.appendChild(s);
    });
  </script>
  <script type="module" src="auth.js"></script>
</head>
<body>

  <div class="header">
    <div class="header-links">
      <span id="account-control"></span>
      <a href="index.html" class="back-link">&larr; Calendar</a>
    </div>
    <h1>DVC Trip Value</h1>
    <div class="subtitle">The full story: what your membership costs vs. what it's actually delivered</div>
  </div>

  <div class="page" id="page-content">
    <div class="gate"><p>Loading&hellip;</p></div>
  </div>

  <script src="data/data.js"></script>
  <script src="data/data_historical.js"></script>
  <script src="data/dues_historical.js"></script>
  <script>
const pageContent = document.getElementById("page-content");
let contracts = [];
let trips = [];
let editingTripId = null;
// Tracks the last value we auto-filled into Points Used, so a later
// suggestion only overwrites the field if the user hasn't typed their own
// number into it since -- comparing against this (not just "is it empty")
// is what lets the suggestion keep updating as dates change without ever
// clobbering a manual edit.
let lastAutoFilledPoints = null;

function resortName(id) {
  const r = RESORTS.find(r => r.id === id);
  return r ? r.name : id;
}

function contractLabel(c) {
  return c.nickname || resortName(c.home_resort_id);
}

function formatDate(year, month, day) {
  return `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
}

// No real DVC stay comes close to this; it exists purely as a runaway
// guard. Native <input type="date"> fires "change" on every keystroke
// while editing a segment in place, so mid-edit on the year (e.g. typing
// over "2024" one digit at a time) can briefly put check-in and check-out
// thousands of years apart -- without this cap, stayDateRange()'s per-night
// loop would try to build a date list that long and freeze the tab.
const MAX_TRIP_NIGHTS = 90;

function nightsBetween(checkIn, checkOut) {
  const ci = new Date(checkIn + "T12:00:00");
  const co = new Date(checkOut + "T12:00:00");
  const nights = Math.round((co - ci) / 86400000);
  return Number.isFinite(nights) ? nights : 0;
}

// Same shape as compare.html's calcStay() -- kept as its own copy here
// rather than shared, matching how every other self-contained page in this
// app (compare.html, changes.html) already duplicates this instead of
// depending on app.js, which is tightly coupled to the calendar's own DOM.
function calcStay(resort, roomTypeId, stayDates) {
  let totalPoints = 0, totalCash = 0, hasCash = false;
  for (const dateStr of stayDates) {
    const pts = getPointsForDate(resort, dateStr, roomTypeId);
    const cashResult = getCashRateWithFallback(resort, dateStr, roomTypeId);
    if (pts) totalPoints += pts;
    if (cashResult && cashResult.rate) { totalCash += cashResult.rate; hasCash = true; }
  }
  return { totalPoints, totalCash: hasCash ? totalCash : null };
}

function remapDateToYear(dateStr, targetYear) {
  const [, m, d] = dateStr.split("-");
  return `${targetYear}-${m}-${d}`;
}

function stayDateRange(startDateStr, nights) {
  const start = new Date(startDateStr + "T12:00:00");
  const dates = [];
  for (let i = 0; i < nights; i++) {
    const dt = new Date(start);
    dt.setDate(dt.getDate() + i);
    dates.push(formatDate(dt.getFullYear(), dt.getMonth(), dt.getDate()));
  }
  return dates;
}

// Estimates what a trip would cost at today's cash rates, by remapping its
// original month/day onto the most recent year data.js actually has pricing
// for and running the normal cash-rate lookup -- we don't have historical
// cash-rate archives, so this deliberately doesn't pretend to know what the
// resort *actually* charged on the real historical dates; it's "what this
// same week would cost booked today," which is an honest, useful proxy.
function estimateTripCashValue(resortId, roomTypeId, checkIn, checkOut) {
  const years = [...new Set(RESORTS.filter(r => r.id === resortId).map(r => r.year))].sort((a, b) => b - a);
  const targetYear = years[0];
  if (!targetYear) return null;
  const resort = RESORTS.find(r => r.id === resortId && r.year === targetYear);
  const roomType = resort?.roomTypes.find(rt => rt.id === roomTypeId);
  if (!resort || !roomType) return null;

  const nights = nightsBetween(checkIn, checkOut);
  if (nights <= 0 || nights > MAX_TRIP_NIGHTS) return null;

  const stayDates = stayDateRange(remapDateToYear(checkIn, targetYear), nights);
  const result = calcStay(resort, roomTypeId, stayDates);
  return result.totalCash != null ? { cash: result.totalCash, year: targetYear, nights } : null;
}

// Suggests points used for a trip. Unlike cash, we DO have real historical
// points charts (data/data_historical.js covers 2016-2027 per resort), so
// if the trip's actual check-in year has chart data, this uses the real
// dates directly -- no remapping needed, and no estimate caveat applies.
// Only falls back to remapping onto the nearest year with data (same
// technique as estimateTripCashValue) for years outside that range.
function estimateTripPoints(resortId, roomTypeId, checkIn, checkOut) {
  const nights = nightsBetween(checkIn, checkOut);
  if (nights <= 0 || nights > MAX_TRIP_NIGHTS) return null;

  const years = [...new Set(RESORTS.filter(r => r.id === resortId).map(r => r.year))];
  if (years.length === 0) return null;

  const checkInYear = parseInt(checkIn.slice(0, 4), 10);
  const isExactYear = years.includes(checkInYear);
  let targetYear = checkInYear;
  if (!isExactYear) {
    const sorted = [...years].sort((a, b) => b - a);
    const pastYears = sorted.filter(y => y <= checkInYear);
    targetYear = pastYears.length ? pastYears[0] : sorted[sorted.length - 1];
  }

  const resort = RESORTS.find(r => r.id === resortId && r.year === targetYear);
  const roomType = resort?.roomTypes.find(rt => rt.id === roomTypeId);
  if (!resort || !roomType) return null;

  const stayStart = isExactYear ? checkIn : remapDateToYear(checkIn, targetYear);
  const stayDates = stayDateRange(stayStart, nights);
  const result = calcStay(resort, roomTypeId, stayDates);
  return result.totalPoints > 0 ? { points: result.totalPoints, year: targetYear, isExactYear } : null;
}

// Cost-of-ownership: amortizes the purchase price evenly over years owned
// to date (not a guessed contract-expiration year -- keeps this defensible
// without needing data we don't have), plus each year's *actual* published
// dues rate for that resort (data/dues_historical.js) rather than applying
// today's rate retroactively -- dues typically rise 4-6%/yr, so that would
// meaningfully overstate cost in early years for anyone who's owned a while.
function buildAmortizationSchedule(contract) {
  if (!contract.purchase_price || !contract.purchase_date) return null;
  const purchaseYear = parseInt(contract.purchase_date.slice(0, 4), 10);
  const currentYear = new Date().getFullYear();
  const totalYears = Math.max(1, currentYear - purchaseYear + 1);
  const amortizedPurchasePerYear = contract.purchase_price / totalYears;

  const rows = [];
  let cumulative = 0;
  let totalDues = 0;
  for (let y = purchaseYear; y <= currentYear; y++) {
    const dues = contract.points_per_year * getDuesForYear(contract.home_resort_id, y);
    totalDues += dues;
    const yearTotal = dues + amortizedPurchasePerYear;
    cumulative += yearTotal;
    rows.push({ year: y, dues, amortized: amortizedPurchasePerYear, total: yearTotal, cumulative });
  }
  return { rows, totalYears, totalDues, amortizedPurchasePerYear, totalCostToDate: cumulative };
}

function fmt(n) {
  return "$" + Math.round(n).toLocaleString();
}

function renderGate() {
  pageContent.innerHTML = `
    <div class="gate">
      <p>Sign in to see your trip history and what your DVC membership has actually delivered.</p>
      <button type="button" class="big-signin-btn" id="gate-signin">Sign in with Google</button>
    </div>
  `;
  document.getElementById("gate-signin").addEventListener("click", () => window.DVCAuth.signInWithGoogle());
}

function renderUnconfigured() {
  pageContent.innerHTML = `<div class="gate"><p>Accounts aren't set up on this deployment yet.</p></div>`;
}

function tripCashValue(trip) {
  if (trip.custom_cash_value != null) return { cash: trip.custom_cash_value, isCustom: true };
  const est = estimateTripCashValue(trip.resort_id, trip.room_type_id, trip.check_in, trip.check_out);
  return est ? { cash: est.cash, isCustom: false, estimateYear: est.year } : null;
}

async function renderSignedIn() {
  [contracts, trips] = await Promise.all([
    window.DVCAuth.getContracts(),
    window.DVCAuth.getTrips(),
  ]);

  const activeContracts = contracts.filter(c => c.is_active);

  // ---- Cost of ownership ----
  let totalCostToDate = 0;
  const contractCostCards = activeContracts.map(c => {
    const schedule = buildAmortizationSchedule(c);
    if (!schedule) {
      return `
        <div class="contract-cost-card">
          <div class="contract-cost-name">${contractLabel(c)}</div>
          <div class="contract-cost-missing">Add a purchase price and date on this contract to see its cost breakdown &mdash; <a href="account.html">edit contract</a></div>
        </div>
      `;
    }
    totalCostToDate += schedule.totalCostToDate;
    const rowsHTML = schedule.rows.map(r => `
      <tr>
        <td>${r.year}</td>
        <td>${fmt(r.dues)}</td>
        <td>${fmt(r.amortized)}</td>
        <td>${fmt(r.total)}</td>
        <td>${fmt(r.cumulative)}</td>
      </tr>
    `).join("");
    return `
      <div class="contract-cost-card">
        <div class="contract-cost-name">${contractLabel(c)}</div>
        <table class="amort-table">
          <thead><tr><th>Year</th><th>Dues</th><th>Amortized Buy-In</th><th>Year Total</th><th>Cumulative</th></tr></thead>
          <tbody>${rowsHTML}</tbody>
        </table>
        <div class="amort-summary">
          <span>Total dues paid: <strong>${fmt(schedule.totalDues)}</strong> across ${schedule.totalYears} year${schedule.totalYears === 1 ? "" : "s"} (actual rate per year)</span>
          <span>Buy-in spread over <strong>${schedule.totalYears}</strong> year${schedule.totalYears === 1 ? "" : "s"} owned so far</span>
        </div>
      </div>
    `;
  }).join("");

  // ---- Trip value ----
  let totalTripValue = 0;
  for (const t of trips) {
    const v = tripCashValue(t);
    if (v) totalTripValue += v.cash;
  }

  const net = totalTripValue - totalCostToDate;

  pageContent.innerHTML = `
    <div class="section">
      <h2>The Full Story</h2>
      <div class="section-sub">Cost of ownership to date vs. the cash value of trips you've logged</div>
      <div class="story-tiles">
        <div class="story-tile cost">
          <div class="story-tile-label">Cost So Far</div>
          <div class="story-tile-value">${fmt(totalCostToDate)}</div>
          <div class="story-tile-sub">Dues + amortized buy-in</div>
        </div>
        <div class="story-tile value">
          <div class="story-tile-label">Trip Value</div>
          <div class="story-tile-value">${fmt(totalTripValue)}</div>
          <div class="story-tile-sub">${trips.length} trip${trips.length === 1 ? "" : "s"} logged</div>
        </div>
        <div class="story-tile net">
          <div class="story-tile-label">Net</div>
          <div class="story-tile-value">${net >= 0 ? "+" : "-"}${fmt(Math.abs(net))}</div>
          <div class="story-tile-sub">${net >= 0 ? "Ahead of cost" : "Behind cost so far"}</div>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>Cost of Ownership</h2>
      <div class="section-sub">Buy-in amortized evenly over years owned to date; dues use each resort's actual published rate for each year (not today's rate applied retroactively)</div>
      ${activeContracts.length === 0 ? `<div class="empty-note">No active contracts yet -- <a href="account.html">add one</a>.</div>` : contractCostCards}
    </div>

    <div class="section">
      <h2>Trip History</h2>
      <div class="section-sub">Log a trip you've taken. Points used is what you actually know; cash value can be your own estimate or ours.</div>
      <div class="trip-list" id="trip-list"></div>
      <button type="button" class="add-btn" id="show-add-form">+ Log a Trip</button>
      <div class="trip-form" id="trip-form">
        <div class="form-error" id="form-error" style="display:none;"></div>
        <div class="form-grid">
          <div class="form-field">
            <label for="f-resort">Resort</label>
            <select id="f-resort"></select>
          </div>
          <div class="form-field">
            <label for="f-room">Room Type</label>
            <select id="f-room"></select>
          </div>
          <div class="form-field">
            <label for="f-checkin">Check-in</label>
            <input type="date" id="f-checkin">
          </div>
          <div class="form-field">
            <label for="f-checkout">Check-out</label>
            <input type="date" id="f-checkout">
          </div>
          <div class="form-field">
            <label for="f-points">Points Used</label>
            <input type="number" id="f-points" min="0" step="1">
            <div class="field-hint" id="points-hint"></div>
          </div>
          <div class="form-field">
            <label for="f-contract">Contract (optional)</label>
            <select id="f-contract">
              <option value="">Not linked to a specific contract</option>
              ${activeContracts.map(c => `<option value="${c.id}">${contractLabel(c)}</option>`).join("")}
            </select>
          </div>
          <div class="form-field full">
            <label>Cash Value</label>
            <div class="cash-mode-toggle">
              <button type="button" id="cash-mode-estimate" class="selected">Use our estimate</button>
              <button type="button" id="cash-mode-custom">Enter my own</button>
            </div>
            <div id="estimate-preview" class="estimate-preview">Pick a resort, room, and dates to see an estimate.</div>
            <input type="number" id="f-custom-cash" min="0" step="1" placeholder="Total $ for the stay" style="display:none; margin-top: 6px;">
          </div>
          <div class="form-field full">
            <label for="f-notes">Notes (optional)</label>
            <textarea id="f-notes" rows="2"></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="save-btn" id="save-trip">Save Trip</button>
          <button type="button" class="cancel-btn" id="cancel-trip">Cancel</button>
        </div>
      </div>
    </div>
  `;

  renderTripList();
  wireTripForm(activeContracts);
}

function renderTripList() {
  const list = document.getElementById("trip-list");
  if (trips.length === 0) {
    list.innerHTML = `<div class="empty-note">No trips logged yet.</div>`;
    return;
  }
  list.innerHTML = trips.map(t => {
    const v = tripCashValue(t);
    const nights = nightsBetween(t.check_in, t.check_out);
    return `
      <div class="trip-card">
        <div class="trip-main">
          <div class="trip-name">${resortName(t.resort_id)}</div>
          <div class="trip-meta">
            <span>${t.check_in} &rarr; ${t.check_out}</span>
            <span>&middot;</span>
            <span>${nights} night${nights === 1 ? "" : "s"}</span>
            <span>&middot;</span>
            <span>${t.points_used.toLocaleString()} pts</span>
          </div>
        </div>
        <div class="trip-value">
          <div class="trip-value-amount">${v ? fmt(v.cash) : "&mdash;"}</div>
          <div class="trip-value-note">${v ? (v.isCustom ? "your estimate" : `est. at ${v.estimateYear} rates`) : "no rate data"}</div>
        </div>
        <div class="trip-actions">
          <button type="button" class="small-btn" data-edit="${t.id}">Edit</button>
          <button type="button" class="small-btn danger" data-delete="${t.id}">Delete</button>
        </div>
      </div>
    `;
  }).join("");

  list.addEventListener("click", async (e) => {
    const editBtn = e.target.closest("[data-edit]");
    const deleteBtn = e.target.closest("[data-delete]");
    if (editBtn) {
      const t = trips.find(t => t.id === editBtn.dataset.edit);
      if (t) openTripForm(t);
    }
    if (deleteBtn) {
      if (!confirm("Delete this trip?")) return;
      await window.DVCAuth.deleteTrip(deleteBtn.dataset.delete);
      renderSignedIn();
    }
  });
}

function populateRoomTypesForResort(resortId, selectedRoomTypeId) {
  const years = [...new Set(RESORTS.filter(r => r.id === resortId).map(r => r.year))].sort((a, b) => b - a);
  const resort = RESORTS.find(r => r.id === resortId && r.year === years[0]);
  const roomSelect = document.getElementById("f-room");
  roomSelect.innerHTML = (resort?.roomTypes || []).map(rt =>
    `<option value="${rt.id}" ${rt.id === selectedRoomTypeId ? "selected" : ""}>${rt.name}</option>`
  ).join("");
}

function updateEstimatePreview() {
  const resortId = document.getElementById("f-resort").value;
  const roomTypeId = document.getElementById("f-room").value;
  const checkIn = document.getElementById("f-checkin").value;
  const checkOut = document.getElementById("f-checkout").value;
  const preview = document.getElementById("estimate-preview");
  if (!resortId || !roomTypeId || !checkIn || !checkOut) {
    preview.textContent = "Pick a resort, room, and dates to see an estimate.";
    preview.classList.add("unavailable");
    return;
  }
  const est = estimateTripCashValue(resortId, roomTypeId, checkIn, checkOut);
  if (est) {
    preview.textContent = `Estimated ${fmt(est.cash)} for ${est.nights} night${est.nights === 1 ? "" : "s"}, using ${est.year} rates for these same dates.`;
    preview.classList.remove("unavailable");
  } else {
    preview.textContent = "No cash rate data available for this resort/room -- enter your own value instead.";
    preview.classList.add("unavailable");
  }
}

// Auto-fills Points Used with a suggested value (and shows a matching hint
// under Cash Value's estimate) whenever resort/room/dates change -- but
// only overwrites the points field if it's still showing our own last
// suggestion. The moment the user types a different number in themselves,
// this stops touching it and just keeps the hint updated for reference.
function updatePointsSuggestion() {
  const resortId = document.getElementById("f-resort").value;
  const roomTypeId = document.getElementById("f-room").value;
  const checkIn = document.getElementById("f-checkin").value;
  const checkOut = document.getElementById("f-checkout").value;
  const hint = document.getElementById("points-hint");
  const pointsInput = document.getElementById("f-points");

  if (!resortId || !roomTypeId || !checkIn || !checkOut) {
    hint.textContent = "";
    return;
  }

  const est = estimateTripPoints(resortId, roomTypeId, checkIn, checkOut);
  if (!est) {
    hint.textContent = "No points chart data available for this resort/room.";
    hint.classList.remove("exact");
    return;
  }

  const currentVal = pointsInput.value === "" ? null : Number(pointsInput.value);
  const untouched = currentVal === null || currentVal === lastAutoFilledPoints;
  if (untouched) {
    pointsInput.value = est.points;
    lastAutoFilledPoints = est.points;
  }

  hint.textContent = est.isExactYear
    ? `Suggested: ${est.points} pts (${est.year} points chart)`
    : `Suggested: ${est.points} pts (estimated using ${est.year} chart -- no ${checkIn.slice(0, 4)} data)`;
  hint.classList.toggle("exact", est.isExactYear);
}

function updateSuggestions() {
  updateEstimatePreview();
  updatePointsSuggestion();
}

function setCashMode(mode) {
  document.getElementById("cash-mode-estimate").classList.toggle("selected", mode === "estimate");
  document.getElementById("cash-mode-custom").classList.toggle("selected", mode === "custom");
  document.getElementById("estimate-preview").style.display = mode === "estimate" ? "block" : "none";
  document.getElementById("f-custom-cash").style.display = mode === "custom" ? "block" : "none";
}

function getCashMode() {
  return document.getElementById("cash-mode-estimate").classList.contains("selected") ? "estimate" : "custom";
}

function uniqueResorts() {
  const seen = new Set();
  const list = [];
  for (const r of RESORTS) {
    if (seen.has(r.id)) continue;
    seen.add(r.id);
    list.push({ id: r.id, name: r.name });
  }
  return list.sort((a, b) => a.name.localeCompare(b.name));
}

function wireTripForm(activeContracts) {
  const resortSelect = document.getElementById("f-resort");
  resortSelect.innerHTML = uniqueResorts().map(r => `<option value="${r.id}">${r.name}</option>`).join("");
  populateRoomTypesForResort(resortSelect.value, null);

  resortSelect.addEventListener("change", () => {
    populateRoomTypesForResort(resortSelect.value, null);
    updateSuggestions();
  });
  document.getElementById("f-room").addEventListener("change", updateSuggestions);
  document.getElementById("f-checkin").addEventListener("change", updateSuggestions);
  document.getElementById("f-checkout").addEventListener("change", updateSuggestions);
  document.getElementById("cash-mode-estimate").addEventListener("click", () => setCashMode("estimate"));
  document.getElementById("cash-mode-custom").addEventListener("click", () => {
    setCashMode("custom");
    // Seed the custom field with our current estimate as a starting point
    // to adjust, rather than leaving it blank -- same "suggest, don't
    // force" pattern as Points Used.
    const customInput = document.getElementById("f-custom-cash");
    if (!customInput.value) {
      const resortId = document.getElementById("f-resort").value;
      const roomTypeId = document.getElementById("f-room").value;
      const checkIn = document.getElementById("f-checkin").value;
      const checkOut = document.getElementById("f-checkout").value;
      if (resortId && roomTypeId && checkIn && checkOut) {
        const est = estimateTripCashValue(resortId, roomTypeId, checkIn, checkOut);
        if (est) customInput.value = Math.round(est.cash);
      }
    }
  });

  document.getElementById("show-add-form").addEventListener("click", () => openTripForm(null));
  document.getElementById("cancel-trip").addEventListener("click", closeTripForm);
  document.getElementById("save-trip").addEventListener("click", saveTripForm);
}

function openTripForm(trip) {
  editingTripId = trip ? trip.id : null;
  lastAutoFilledPoints = null;
  document.getElementById("form-error").style.display = "none";
  document.getElementById("f-resort").value = trip?.resort_id || document.getElementById("f-resort").value;
  populateRoomTypesForResort(document.getElementById("f-resort").value, trip?.room_type_id);
  document.getElementById("f-checkin").value = trip?.check_in || "";
  document.getElementById("f-checkout").value = trip?.check_out || "";
  document.getElementById("f-points").value = trip?.points_used || "";
  document.getElementById("f-contract").value = trip?.contract_id || "";
  document.getElementById("f-notes").value = trip?.notes || "";
  if (trip?.custom_cash_value != null) {
    setCashMode("custom");
    document.getElementById("f-custom-cash").value = trip.custom_cash_value;
  } else {
    setCashMode("estimate");
    document.getElementById("f-custom-cash").value = "";
  }
  updateSuggestions();
  document.getElementById("trip-form").classList.add("open");
  document.getElementById("save-trip").textContent = trip ? "Save Changes" : "Save Trip";
  document.getElementById("trip-form").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function closeTripForm() {
  editingTripId = null;
  document.getElementById("trip-form").classList.remove("open");
}

async function saveTripForm() {
  const errorEl = document.getElementById("form-error");
  errorEl.style.display = "none";

  const checkIn = document.getElementById("f-checkin").value;
  const checkOut = document.getElementById("f-checkout").value;
  const points = parseInt(document.getElementById("f-points").value, 10);

  if (!checkIn || !checkOut) {
    errorEl.textContent = "Check-in and check-out dates are required.";
    errorEl.style.display = "block";
    return;
  }
  if (checkOut <= checkIn) {
    errorEl.textContent = "Check-out must be after check-in.";
    errorEl.style.display = "block";
    return;
  }
  if (nightsBetween(checkIn, checkOut) > MAX_TRIP_NIGHTS) {
    errorEl.textContent = `That's a ${nightsBetween(checkIn, checkOut)}-night stay -- double-check the dates.`;
    errorEl.style.display = "block";
    return;
  }
  if (!points && points !== 0) {
    errorEl.textContent = "Points used is required.";
    errorEl.style.display = "block";
    return;
  }

  const payload = {
    resort_id: document.getElementById("f-resort").value,
    room_type_id: document.getElementById("f-room").value,
    check_in: checkIn,
    check_out: checkOut,
    points_used: points,
    contract_id: document.getElementById("f-contract").value || null,
    notes: document.getElementById("f-notes").value.trim() || null,
    custom_cash_value: getCashMode() === "custom" && document.getElementById("f-custom-cash").value
      ? parseFloat(document.getElementById("f-custom-cash").value)
      : null,
  };

  const result = editingTripId
    ? await window.DVCAuth.updateTrip(editingTripId, payload)
    : await window.DVCAuth.addTrip(payload);

  if (result.error) {
    errorEl.textContent = "Couldn't save: " + result.error;
    errorEl.style.display = "block";
    return;
  }

  closeTripForm();
  renderSignedIn();
}

function render(session) {
  if (!window.DVCAuth.isConfigured()) {
    renderUnconfigured();
  } else if (session) {
    renderSignedIn();
  } else {
    renderGate();
  }
}

function waitForAuth(attempts) {
  if (window.DVCAuth) {
    window.DVCAuth.onAuthChange(render);
  } else if (attempts > 0) {
    setTimeout(() => waitForAuth(attempts - 1), 50);
  } else {
    renderUnconfigured();
  }
}
waitForAuth(40);
  </script>
</body>
