<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DVC Points Calendar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="header">
    <h1>DVC Points Calendar</h1>
    <div class="subtitle">Disney Vacation Club — Vacation Points Per Night</div>
  </div>

  <div class="controls">
    <div class="control-group">
      <label>Resort</label>
      <div class="searchable-select" id="resort-select-wrapper">
        <input type="text" id="resort-search" placeholder="Search resorts..." autocomplete="off">
        <div class="searchable-dropdown" id="resort-dropdown"></div>
      </div>
    </div>
    <div class="control-group">
      <label for="room-select">Room Type</label>
      <select id="room-select"></select>
    </div>
    <div class="control-group">
      <label for="year-select">Points Year</label>
      <select id="year-select"></select>
    </div>
  </div>

  <div class="main-layout">
    <div class="calendar-side">
      <div class="month-nav">
        <button id="prev-month">&larr;</button>
        <span id="month-label" class="month-label"></span>
        <button id="next-month">&rarr;</button>
      </div>
      <div class="selection-hint" id="selection-hint">Click a check-in date</div>
      <div id="calendar-grid" class="calendar-grid"></div>
      <div class="legend">
        <span class="legend-title">Travel Period:</span>
        <div id="legend-items" class="legend-items"></div>
      </div>
    </div>
    <div class="summary-side">
      <div class="settings-card">
        <div class="settings-row">
          <label class="ownership-toggle">
            <input type="checkbox" id="owner-toggle">
            <span class="toggle-label">I own DVC points</span>
          </label>
          <div class="ownership-details" id="ownership-details" style="display: none;">
            <select id="owner-resort"></select>
            <div class="owner-dues-info" id="owner-dues-info"></div>
          </div>
        </div>
        <div class="settings-divider"></div>
        <div class="settings-row">
          <label for="rental-rate">Rental Rate: <strong>$<span id="rental-rate-value">20</span></strong>/pt</label>
          <input type="range" id="rental-rate" min="15" max="25" step="0.5" value="20">
        </div>
      </div>
      <div id="summary"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>

</body>
</html>
