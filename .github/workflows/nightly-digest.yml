name: Nightly Data Watchdog & Digest

# Verified working via a manual workflow_dispatch run on 2026-09-06 (digest
# email arrived correctly) before enabling the real nightly schedule below.
# workflow_dispatch stays available too, for re-testing on demand.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 9 * * *"  # 9am UTC (~4-5am Eastern, depending on DST)

permissions:
  contents: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run freshness watchdogs, rotate live pricing, and send digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
        run: python3 scripts/nightly_watchdog.py

      - name: Commit updated watchdog state and live pricing, if changed
        run: |
          git config user.name "dvcalc-bot"
          git config user.email "actions@github.com"
          git add data/.watchdog_state.json data/cash_prices_live.json
          git diff --staged --quiet || git commit -m "Update nightly watchdog state and live pricing [skip ci]"
          git diff --staged --quiet || git push
