.small-btn.primary {
  background: #4a148c;
  border-color: #4a148c;
  color: white;
}
.small-btn.primary:hover { background: #38106b; }
  </style>
  <script>
    // Injected dynamically (not a static <script async> tag) so this third-party
    // analytics load can never hold up the page's own load/spinner state -- a
    // static tag still counts toward window.onload even with async, so a slow
    // or blocked gc.zgo.at could stall the tab indicator for seconds on some
    // networks even though the app itself has already finished rendering.
    window.addEventListener("load", () => {
      const s = document.createElement("script");
      s.async = true;
      s.src = "//gc.zgo.at/count.js";
      s.setAttribute("data-goatcounter", "https://dvcalc.goatcounter.com/count");
      document.body.appendChild(s);
    });
  </script>
  <script type="module" src="auth.js"></script>

  <div class="header">
    <h1>Saved Itineraries</h1>
    <div class="subtitle">Plans you've saved from the calendar -- load one back in anytime</div>

  <div class="page" id="page-content">
    <div class="gate"><p>Loading&hellip;</p></div>

  <script src="data/data.js"></script>
  <script src="data/data_historical.js"></script>
  <script>
const pageContent = document.getElementById("page-content");

function resortName(id, year) {
  const r = RESORTS.find(r => r.id === id && r.year === year) || RESORTS.find(r => r.id === id);
  return r ? r.name : id;
}

function roomTypeName(resortId, year, roomTypeId) {
  const r = RESORTS.find(r => r.id === resortId && r.year === year) || RESORTS.find(r => r.id === resortId);
  const rt = r?.roomTypes.find(rt => rt.id === roomTypeId);
  return rt ? rt.name : roomTypeId;
}

function nightsBetween(checkIn, checkOut) {
  const ci = new Date(checkIn + "T12:00:00");
  const co = new Date(checkOut + "T12:00:00");
  return Math.round((co - ci) / 86400000);
}

function stayDateRange(startDateStr, nights) {
  const start = new Date(startDateStr + "T12:00:00");
  const dates = [];
  for (let i = 0; i < nights; i++) {
    const dt = new Date(start);
    dt.setDate(dt.getDate() + i);
    dates.push(`${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`);
  }
  return dates;
}

// Totals across every segment of an itinerary, using the resort/room/dates
// exactly as saved (no remapping -- unlike trips.html's past-trip estimator,
// this is a future plan against the same year's real chart data it was
// saved from, so the lookup is direct).
function calcItineraryTotals(itinerary) {
  let totalPoints = 0, totalCash = 0, totalNights = 0, hasCash = false;
  for (const seg of itinerary.segments) {
    const resort = RESORTS.find(r => r.id === seg.resortId && r.year === itinerary.year);
    if (!resort) continue;
    const nights = nightsBetween(seg.checkIn, seg.checkOut);
    totalNights += nights;
    for (const dateStr of stayDateRange(seg.checkIn, nights)) {
      const pts = getPointsForDate(resort, dateStr, seg.roomTypeId);
      const cashResult = getCashRateWithFallback(resort, dateStr, seg.roomTypeId);
      if (pts) totalPoints += pts;
      if (cashResult && cashResult.rate) { totalCash += cashResult.rate; hasCash = true; }
    }
  }
  return { totalPoints, totalCash: hasCash ? totalCash : null, totalNights };
}

function fmt(n) {
  return "$" + Math.round(n).toLocaleString();
}

function formatDisplayDate(dateStr) {
  if (!dateStr) return "";
  const [y, m, d] = dateStr.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}

function renderGate() {
  pageContent.innerHTML = `
    <div class="gate">
      <p>Sign in to see the itineraries you've saved from the calendar.</p>
      <button type="button" class="big-signin-btn" id="gate-signin">Sign in with Google</button>
    </div>
  `;
  document.getElementById("gate-signin").addEventListener("click", () => window.DVCAuth.signInWithGoogle());
}

function renderUnconfigured() {
  pageContent.innerHTML = `<div class="gate"><p>Accounts aren't set up on this deployment yet.</p></div>`;
}

async function renderSignedIn() {
  const itineraries = await window.DVCAuth.getItineraries();

  const cardsHTML = itineraries.map(itin => {
    const totals = calcItineraryTotals(itin);
    const segRows = itin.segments.map(seg => `
      <div class="itin-segment-row">
        <strong>${resortName(seg.resortId, itin.year)}</strong> &mdash; ${roomTypeName(seg.resortId, itin.year, seg.roomTypeId)}
        &middot; ${formatDisplayDate(seg.checkIn)} &rarr; ${formatDisplayDate(seg.checkOut)}
      </div>
    `).join("");
    return `
      <div class="itin-card">
        <div class="itin-name">${itin.name}</div>
        <div class="itin-segments">${segRows}</div>
        <div class="itin-meta">
          <strong>${totals.totalNights}</strong> night${totals.totalNights === 1 ? "" : "s"}
          &middot; <strong>${totals.totalPoints.toLocaleString()}</strong> pts
          ${totals.totalCash != null ? `&middot; <strong>${fmt(totals.totalCash)}</strong> cash rate` : ""}
        </div>
        <div class="itin-actions">
          <button type="button" class="small-btn primary" data-load="${itin.id}">Load</button>
          <button type="button" class="small-btn danger" data-delete="${itin.id}">Delete</button>
        </div>
      </div>
    `;
  }).join("");

  pageContent.innerHTML = `
    <div class="section">
      <h2>Saved Itineraries</h2>
      <div class="section-sub">Saved from the calendar's "Save Itinerary" button. Loading one brings it back into the calendar exactly as saved.</div>
      ${itineraries.length === 0
        ? `<div class="empty-note">No saved itineraries yet -- plan a stay on the <a href="index.html">Calendar</a> and save it.</div>`
        : `<div class="itin-list">${cardsHTML}</div>`
      }
    </div>
  `;

  pageContent.querySelectorAll("[data-load]").forEach(btn => {
    btn.addEventListener("click", () => {
      const itin = itineraries.find(i => i.id === btn.dataset.load);
      if (!itin || !itin.segments.length) return;
      const segs = itin.segments;
      const last = segs[segs.length - 1];
      const completed = segs.slice(0, -1);
      const restoredState = {
        year: itin.year,
        resortId: last.resortId,
        roomTypeId: last.roomTypeId,
        checkIn: last.checkIn,
        checkOut: last.checkOut,
        month: Number(last.checkIn.split("-")[1]) - 1,
        segments: completed,
      };
      sessionStorage.setItem("dvc_calendar_state", JSON.stringify(restoredState));
      sessionStorage.setItem("dvc_return_to_calendar", "1");
      window.location.href = "index.html";
    });
  });

  pageContent.querySelectorAll("[data-delete]").forEach(btn => {
    btn.addEventListener("click", async () => {
      if (!confirm("Delete this saved itinerary?")) return;
      await window.DVCAuth.deleteItinerary(btn.dataset.delete);
      renderSignedIn();
    });
  });
}

function render(session) {
  if (!window.DVCAuth.isConfigured()) {
    renderUnconfigured();
  } else if (session) {
    renderSignedIn();
  } else {
    renderGate();
  }
}

function waitForAuth(attempts) {
  if (window.DVCAuth) {
    window.DVCAuth.onAuthChange(render);
  } else if (attempts > 0) {
    setTimeout(() => waitForAuth(attempts - 1), 50);
  } else {
    renderUnconfigured();
  }
}
waitForAuth(40);
  </script>
