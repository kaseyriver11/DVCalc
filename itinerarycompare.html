* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #f5f5f5;
  color: #333;

.header {
  background: linear-gradient(135deg, #1a237e, #4a148c);
  color: white;
  padding: 16px 24px;

}

.header h1 { font-size: 1.3rem; font-weight: 600; margin-bottom: 2px; }
.header .subtitle { font-size: 0.8rem; opacity: 0.8; }

/* ---- Site nav ---- */
.site-nav { background: white; border-bottom: 1px solid #e0e0e0; padding: 10px 24px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; position: sticky; top: 0; z-index: 100; }
.site-nav-brand { font-weight: 700; font-size: 1rem; color: #4a148c; text-decoration: none; letter-spacing: 0.2px; flex-shrink: 0; }
.site-nav-links { display: flex; align-items: center; gap: 16px; flex: 1; flex-wrap: wrap; }
.site-nav-group { display: flex; align-items: center; gap: 12px; }
.site-nav-group-label { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.5px; color: #aaa; font-weight: 700; }
.site-nav-divider { width: 1px; height: 16px; background: #e0e0e0; }
.site-nav-links a { font-size: 0.82rem; color: #555; text-decoration: none; font-weight: 500; padding: 2px 0; border-bottom: 2px solid transparent; }
.site-nav-links a:hover { color: #4a148c; }
.site-nav-links a.active { color: #4a148c; border-bottom-color: #4a148c; font-weight: 600; }

.site-nav-toggle { display: none; flex-direction: column; justify-content: center; gap: 4px; width: 32px; height: 32px; padding: 6px; margin-left: auto; border: none; background: none; cursor: pointer; }
.site-nav-toggle span { display: block; width: 100%; height: 2px; border-radius: 1px; background: #4a148c; }

.account-btn, .account-link-btn {
  font: inherit;
  font-size: 0.78rem;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid #ddd;
  background: #f7f5fa;
  color: #4a148c;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
  white-space: nowrap;
}
.account-btn:hover, .account-link-btn:hover { background: #ece1f7; border-color: #4a148c; }

@media (max-width: 800px) {
  .site-nav-toggle { display: flex; }
  .site-nav-links { display: none; flex: 0 0 100%; width: 100%; flex-direction: column; align-items: flex-start; gap: 14px; margin-top: 4px; padding-top: 10px; border-top: 1px solid #eee; }
  .site-nav-group { flex-direction: column; align-items: flex-start; gap: 6px; }
  #account-control { display: none; width: 100%; margin-top: 10px; }
  .site-nav.open .site-nav-links { display: flex; }
  .site-nav.open #account-control { display: block; }
  .header { padding: 10px 20px; }
  .header h1 { font-size: 1.05rem; }
  .header .subtitle { font-size: 0.7rem; }
}

.page {
  max-width: 900px;
  margin: 24px auto;
  padding: 0 16px 60px;
}

.gate {
  background: white;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  padding: 48px 32px;
  text-align: center;
  color: #666;
}

.gate p { margin-bottom: 18px; font-size: 0.95rem; }

.big-signin-btn {
  background: #4a148c;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 12px 24px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
}
.big-signin-btn:hover { background: #38106b; }

.section {
  background: white;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  padding: 20px 24px;
  margin-bottom: 20px;
}

.section h2 {
  font-size: 1.05rem;
  font-weight: 600;
  color: #1a237e;
  margin-bottom: 4px;
}

.section-sub {
  font-size: 0.8rem;
  color: #888;
  margin-bottom: 16px;
}

.empty-note {
  color: #999;
  font-style: italic;
  font-size: 0.88rem;
  padding: 8px 0 16px;
}
.empty-note a { color: #4a148c; }

.picker-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

@media (max-width: 700px) {
  /* Never had a mobile override at all -- 3 dropdowns side by side on a
     phone crushes each to a sliver. Matches the single-column-under-700px
     convention now used app-wide (contractvalue.html/suggest.html). */
  .picker-row {
    grid-template-columns: 1fr;
  }
}

.picker-slot label {
  display: block;
  font-size: 0.7rem;
  text-transform: uppercase;
  font-weight: 600;
  color: #888;
  letter-spacing: 0.4px;
  margin-bottom: 4px;
}

.picker-slot select {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 0.85rem;
  background: white;
  cursor: pointer;
}

.picker-slot select:focus {
  outline: none;
  border-color: #4a148c;
  box-shadow: 0 0 0 2px rgba(74, 20, 140, 0.15);
}

.compare-table-wrap {
  overflow-x: auto;
}

.compare-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
}

.compare-table th, .compare-table td {
  padding: 10px 12px;
  text-align: left;
  border-bottom: 1px solid #eee;
  vertical-align: top;
}

.compare-table thead th {
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  color: #4a148c;
  font-weight: 700;
  border-bottom: 2px solid #4a148c;
}

.compare-table tbody th {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  color: #888;
  font-weight: 600;
  white-space: nowrap;
}

.compare-table .segment-line {
  font-size: 0.78rem;
  margin-bottom: 4px;
}
.compare-table .segment-line:last-child { margin-bottom: 0; }
.compare-table .segment-resort { font-weight: 600; color: #333; }
.compare-table .segment-dates { color: #888; }
.compare-table .segment-room { color: #888; }

.compare-col-title {
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  color: #999;
  font-weight: 700;
  margin-bottom: 6px;
}

/* Resets the uppercase/purple styling .compare-table thead th sets for
   plain text so the nested resort-name div renders as a normal compact
   heading instead of inheriting that treatment meant for the row label
   cells (Nights, Total Points, etc). */
.compare-table thead .segment-resort {
  text-transform: none;
  letter-spacing: normal;
  font-size: 0.95rem;
  font-weight: 700;
  color: #1a237e;
}

.compare-metric {
  font-weight: 700;
  font-size: 0.95rem;
  font-variant-numeric: tabular-nums;
}

.compare-metric.best {
  color: #2e7d32;
}
.compare-metric.best::after {
  content: " \2713";
  font-size: 0.8em;
}

/* The pill+label+checkmark render as one atomic nowrap unit -- see the
   crowdRow comment in buildCompareTableHTML for why this is necessary
   (auto-layout column widths differing enough to make the identical value
   wrap differently between columns otherwise). */
.crowd-inline {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.compare-table td.crowd-cell.best::after {
  content: none;
}
.crowd-check {
  color: #2e7d32;
  font-weight: 700;
  font-size: 0.8em;
}

.crowd-pill {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 700;
  font-size: 0.8rem;
  color: white;
}
.crowd-low { background: #2e7d32; }
.crowd-moderate { background: #f9a825; }
.crowd-busy { background: #ef6c00; }
.crowd-heavy { background: #d84315; }
.crowd-extreme { background: #b71c1c; }

/* ---- Contract-aware decision rows (Home Priority, Availability Risk,
   Point Feasibility) ---- */
/* Deliberately NOT nowrap like .crowd-inline above -- that group is always
   a short "N Label" pair that comfortably fits one line in any column
   width. These badges carry full phrases ("Home Resort (11-Month
   Window)", "7-Month Switch Window") that don't -- forcing them onto one
   line let the badge's own intrinsic width become the WHOLE table's
   widest column, pushing the single-itinerary view wider than a phone
   viewport and clipping every cell in that column (including the
   pre-existing header/segment text sharing it), not just the badge. See
   guardrail #1/#8 in CLAUDE.md: wrap, don't force a scroll, when the
   content is prose rather than a short atomic label. */
.window-badge, .risk-badge, .feasibility-badge {
  display: inline-block;
  max-width: 100%;
  padding: 3px 9px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 0.78rem;
  white-space: normal;
}
.feasibility-badge { font-size: 0.85rem; padding: 4px 10px; }

.window-home, .risk-low, .feasibility-funded { background: #e8f5e9; color: #2e7d32; }
.window-switch, .feasibility-borrow { background: #fff3e0; color: #e65100; }
.risk-moderate { background: #fff8e1; color: #f57f17; }
.window-blocked, .risk-high, .feasibility-deficit { background: #fbe9e7; color: #c62828; }

.window-sub, .risk-sub, .feasibility-detail {
  font-size: 0.74rem;
  color: #888;
  margin-top: 3px;
}

/* Same "compare-metric.best gets highlighted" intent as the numeric rows,
   but these cells hold badges instead of a bare number -- a soft
   background wash reads as "the winner" without needing a checkmark glyph
   to fight the badge's own emoji for attention. */
.compare-table td.row-best {
  background: rgba(46, 125, 50, 0.07);
  border-radius: 6px;
}

/* Compact mobile table, NOT a stacked-card rebuild -- a card-per-itinerary
   layout was tried and rejected: it "fit" a phone screen, but a comparison
   feature whose whole point is seeing every option at once shouldn't force
   scrolling through one option at a time to do that. Below 700px (this
   page's existing breakpoint, see .picker-row above) the table instead
   goes table-layout:fixed with every column sized off the row-label
   column's own explicit width, and every cell's text set to wrap at word
   boundaries -- shrinking font/padding enough that up to 3 itinerary
   columns stay visible side by side with ZERO horizontal scroll. Verified
   against a real 390px-wide viewport with 2 and 3 itineraries selected
   before landing on these exact sizes; going smaller starts breaking
   genuinely long words (e.g. "Boardwalk/Preferred") mid-token, which is
   the one acceptable rough edge at 3-up density.
   Positioned LAST in this stylesheet deliberately: at equal specificity
   (e.g. this vs. the unconditional ".compare-table tbody th" rule setting
   white-space:nowrap above), the cascade breaks ties by source order, not
   by which rule sits inside a @media block -- an earlier first attempt at
   this override went right after .compare-table's base rules and was
   silently beaten by the nowrap declared further down, so the label
   column never actually wrapped even though the media query itself was
   matching. */
@media (max-width: 700px) {
  .compare-table-wrap {
    overflow-x: visible;
    /* Bleeds past .section's own 24px side padding so the table gets the
       full viewport width to work with, not just what's left after the
       card's padding. */
    margin: 0 -24px;
    padding: 0 6px;
  }
  .compare-table {
    table-layout: fixed;
    width: 100%;
    font-size: 0.7rem;
  }
  .compare-table th, .compare-table td {
    padding: 6px 4px;
    word-break: normal;
    overflow-wrap: break-word;
  }
  .compare-table thead th:first-child, .compare-table tbody th {
    width: 72px;
    font-size: 0.56rem;
    white-space: normal;
    padding-right: 2px;
  }
  .compare-table .compare-col-title { font-size: 0.6rem; }
  .compare-table thead .segment-resort { font-size: 0.72rem; }
  .window-badge, .risk-badge, .feasibility-badge { font-size: 0.6rem; padding: 2px 5px; line-height: 1.25; }
  .window-sub, .risk-sub, .feasibility-detail { font-size: 0.56rem; margin-top: 2px; }
  .compare-metric { font-size: 0.8rem; }
}

  <script>
    // Injected dynamically (not a static <script async> tag) so this third-party

    window.addEventListener("load", () => {

      s.setAttribute("data-goatcounter", "https://dvcalc.goatcounter.com/count");
      document.body.appendChild(s);
    });
  </script>

  <script>
const pageContent = document.getElementById("page-content");
let itineraries = [];
const selectedIds = [null, null, null];

// ---- Contract-aware state (Home Priority / Availability Risk / Point
// Feasibility rows) -- populated in renderSignedIn() alongside itineraries.
let activeContracts = [];
let contractYearPoints = [];
let resortAccess = { homeResortIds: new Set(), sevenMoResortIds: new Set() };

// One-shot handoff from itineraries.html's "Compare Selected" sticky bar --
// consumed (read once, then removed) so a later manual visit to this page
// doesn't keep re-applying a stale prior selection.
function consumeIncomingCompareSelection() {
  const raw = sessionStorage.getItem("dvc_compare_selected_ids");
  if (!raw) return;
  sessionStorage.removeItem("dvc_compare_selected_ids");
  let ids;
  try {
    ids = JSON.parse(raw);
  } catch {
    return;
  }
  if (!Array.isArray(ids)) return;
  ids.slice(0, 3).forEach((id, i) => {
    if (itineraries.some(it => it.id === id)) selectedIds[i] = id;
  });
}
// Guards the Split-Stay Scientist event so re-arranging pickers while
// already at 2+ selected doesn't re-fire the tracked event every change.
let splitStayScientistTracked = false;

const CROWD_TABLES = {
  2026: typeof UNDERCOVER_TOURIST_CROWD_2026 !== "undefined" ? UNDERCOVER_TOURIST_CROWD_2026 : null,
  2027: typeof UNDERCOVER_TOURIST_CROWD_2027 !== "undefined" ? UNDERCOVER_TOURIST_CROWD_2027 : null,
};

function getCrowdForDate(dateStr) {
  const table = CROWD_TABLES[dateStr.slice(0, 4)];
  return table ? table[dateStr] || null : null;
}

function crowdClass(label) {
  return `crowd-${label.toLowerCase()}`;
}

// Same 5 tiers as the calendar's own crowd legend (app.js's CROWD_LEGEND):
// 1-2 Low, 3-4 Moderate, 5-6 Busy, 7-8 Heavy, 9-10 Extreme. Used instead of
// borrowing the label off whichever individual day happens to be closest to
// the rounded average -- that could land on a day one tier over from the
// average's own tier (e.g. an average of 6 picking up a nearby day's "7
// Heavy" label instead of "6 Busy"), showing the same score with two
// different names/colors depending on which itinerary it was in.
function crowdLabelForScore(score) {
  if (score <= 2) return "Low";
  if (score <= 4) return "Moderate";
  if (score <= 6) return "Busy";
  if (score <= 8) return "Heavy";
  return "Extreme";
}

function resortName(id, year) {
  const r = RESORTS.find(r => r.id === id && r.year === year) || RESORTS.find(r => r.id === id);
  return r ? r.name : id;
}

// "Sep 2 -- Sep 8, 2026" -- the year is dropped from the check-in side
// unless the stay actually crosses a year boundary (a rare split-stay/
// New Year's edge case), so the common case reads as one clean range
// instead of repeating the year twice.
function formatDateRange(checkIn, checkOut) {
  const [ciY, ciM, ciD] = checkIn.split("-").map(Number);
  const [coY, coM, coD] = checkOut.split("-").map(Number);
  const ciDate = new Date(ciY, ciM - 1, ciD);
  const coDate = new Date(coY, coM - 1, coD);
  const coStr = coDate.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  if (ciY === coY) {
    const ciStr = ciDate.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    return `${ciStr} – ${coStr}`;
  }
  const ciStr = ciDate.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  return `${ciStr} – ${coStr}`;
}

function roomTypeName(resortId, year, roomTypeId) {
  const r = RESORTS.find(r => r.id === resortId && r.year === year) || RESORTS.find(r => r.id === resortId);
  const rt = r?.roomTypes.find(rt => rt.id === roomTypeId);
  return rt ? rt.name : roomTypeId;
}

function nightsBetween(checkIn, checkOut) {
  const ci = new Date(checkIn + "T12:00:00");
  const co = new Date(checkOut + "T12:00:00");
  return Math.round((co - ci) / 86400000);
}

function stayDateRange(startDateStr, nights) {
  const start = new Date(startDateStr + "T12:00:00");
  const dates = [];
  for (let i = 0; i < nights; i++) {
    const dt = new Date(start);
    dt.setDate(dt.getDate() + i);
    dates.push(`${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`);
  }
  return dates;
}

function fmt(n) {
  return "$" + Math.round(n).toLocaleString();
}

// Same direct-lookup approach as itineraries.html -- these are future
// plans against the year they were saved for, so no remapping needed.
// Also pools every date across every segment for a single blended
// average crowd/busy score.
function calcItineraryMetrics(itinerary) {
  let totalPoints = 0, totalCash = 0, totalNights = 0, hasCash = false;
  const allDates = [];
  for (const seg of itinerary.segments) {
    const resort = RESORTS.find(r => r.id === seg.resortId && r.year === itinerary.year);
    if (!resort) continue;
    const nights = nightsBetween(seg.checkIn, seg.checkOut);
    totalNights += nights;
    const dates = stayDateRange(seg.checkIn, nights);
    for (const dateStr of dates) {
      allDates.push(dateStr);
      const pts = getPointsForDate(resort, dateStr, seg.roomTypeId);
      const cashResult = getCashRateWithFallback(resort, dateStr, seg.roomTypeId);
      if (pts) totalPoints += pts;
      if (cashResult && cashResult.rate) { totalCash += cashResult.rate; hasCash = true; }
    }
  }

  const crowdEntries = allDates.map(getCrowdForDate).filter(Boolean);
  let avgCrowd = null, avgCrowdLabel = null;
  if (crowdEntries.length > 0) {
    avgCrowd = Math.round(crowdEntries.reduce((sum, e) => sum + e.crowd, 0) / crowdEntries.length);
    avgCrowdLabel = crowdLabelForScore(avgCrowd);
  }

  return {
    totalPoints,
    totalCash: hasCash ? totalCash : null,
    totalNights,
    avgCrowd,
    avgCrowdLabel,
    cashPerPoint: hasCash && totalPoints > 0 ? totalCash / totalPoints : null,
    pointsPerNight: totalNights > 0 ? totalPoints / totalNights : null,
  };
}

// ---- Contract-aware decision helpers ----
// This page is self-contained like compare.html/contractvalue.html (doesn't
// load app.js), so it keeps its own small copy of the two lookup pieces it
// needs from AVAILABILITY_DATA rather than pulling in the whole file --
// same NON_WDW_RESORT_IDS/getKeyDatesPeriod as app.js.
const NON_WDW_RESORT_IDS = new Set(["aulani", "hiltonHead", "veroBeach", "disneylandHotel", "grandCalifornian"]);

function getKeyDatesPeriod(dateStr, resortId) {
  const date = new Date(dateStr + "T12:00:00");
  const month = date.getMonth();
  const day = date.getDate();
  const isNonWDW = NON_WDW_RESORT_IDS.has(resortId);
  if ((month === 11 && day >= 25) || (month === 0 && day <= 5)) return "newYears";
  if (isNonWDW) {
    if (month === 0 || month === 1) return "presidents";
    if (month === 2 || month === 3) return "easter";
    if (month >= 4 && month <= 7) return "summer";
    if (month >= 8 && month <= 10) return "thanksgiving";
    if (month === 11) return "christmas";
  } else {
    if (month === 0) return "marathon";
    if (month === 1) return "presidents";
    if (month === 2 || month === 3) return "easter";
    if (month >= 4 && month <= 7) return "summer";
    if (month === 8 || month === 9) return "foodAndWine";
    if (month === 10) return "thanksgiving";
    if (month === 11) return "christmas";
  }
  return "summer";
}

// Worst (minimum) 7-Month availability score across every night of a
// segment -- same "worst night wins" approach as app.js's
// getStayAvailability(), but scoped to just the 7Mo window since that's the
// only one the Availability Risk row cares about.
function get7MoScoreForSegment(resortId, roomTypeId, dates) {
  if (typeof AVAILABILITY_DATA === "undefined") return null;
  const roomData = AVAILABILITY_DATA[resortId]?.[roomTypeId];
  if (!roomData) return null;
  let min = null;
  for (const dateStr of dates) {
    const period = getKeyDatesPeriod(dateStr, resortId);
    const score = roomData[period]?.["7Mo"];
    if (score == null) continue;
    min = min == null ? score : Math.min(min, score);
  }
  return min;
}

// Collapses the app's existing 5-tier availability scale (app.js's
// availabilityLabel(): Excellent/Good/Fair/Low/Not Likely, ratio = score /
// stayLength) down to the 3-tier read this row wants, using the SAME real
// historical data the calendar's own Booking Outlook card draws from (DVC
// Field Guide) rather than a hardcoded list of "known tough" resort/room
// combos -- the data already reflects those cases (Beach Club Studios
// during Food & Wine included) without needing to special-case them.
function riskTierForScore(score, stayLength) {
  if (score == null) return null;
  const ratio = score / stayLength;
  if (ratio >= 0.6) return { level: "low", rank: 2, badge: "🟢 Low Risk", sub: "Readily available at 7mo" };
  if (ratio >= 0.3) return { level: "moderate", rank: 1, badge: "🟡 Moderate Competition", sub: null };
  return { level: "high", rank: 0, badge: "🔴 High Risk", sub: "Tough 7mo booking" };
}

function monthsBeforeCheckIn(dateStr, months) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setMonth(dt.getMonth() - months);
  return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
}

function formatShortDate(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}

function daysUntil(dateStr) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const [y, m, d] = dateStr.split("-").map(Number);
  return Math.round((new Date(y, m - 1, d) - today) / 86400000);
}

// Which booking window (home 11mo vs. switch 7mo vs. not bookable at all
// under any of this user's contracts) an itinerary segment's resort falls
// into. resortAccess is computed once in renderSignedIn() via
// DVCAuth.getUserResortAccess(), which already unions permissively across
// every active contract -- owning even one unrestricted way in makes the
// resort bookable regardless of what any single other contract would say
// (see auth.js), so a single lookup here covers every segment/itinerary.
function homePriorityForSegment(resortId, checkIn) {
  if (resortAccess.homeResortIds.has(resortId)) {
    return { type: "home", rank: 2, opensOn: monthsBeforeCheckIn(checkIn, 11) };
  }
  if (resortAccess.sevenMoResortIds.has(resortId)) {
    return { type: "switch", rank: 1, opensOn: monthsBeforeCheckIn(checkIn, 7) };
  }
  return { type: "blocked", rank: 0 };
}

function windowBadgeHTML(info) {
  if (!info) return `<div class="segment-line">&mdash;</div>`;
  if (info.type === "home") {
    return `
      <div class="segment-line">
        <span class="window-badge window-home">🏡 Home Resort (11-Month Window)</span>
        <div class="window-sub">Opens ${formatShortDate(info.opensOn)}</div>
      </div>`;
  }
  if (info.type === "switch") {
    const d = daysUntil(info.opensOn);
    const countdown = d <= 0 ? "Window Open" : `Opens in ${d} day${d === 1 ? "" : "s"}`;
    return `
      <div class="segment-line">
        <span class="window-badge window-switch">🔄 7-Month Switch Window</span>
        <div class="window-sub">${formatShortDate(info.opensOn)} &mdash; ${countdown}</div>
      </div>`;
  }
  return `<div class="segment-line"><span class="window-badge window-blocked">🚫 Not Bookable</span></div>`;
}

// Same date math as app.js's getCurrentYearRow(), generalized to an
// arbitrary reference date via DVCDates.currentUYYear()'s own
// {year,month,day} parameter instead of always "today" -- this finds the
// use-year cycle that actually covers a future check-in date, so a
// contract's "+ Plan a year" row (My Contracts) is used when the owner has
// filled one in for that year, per "match the itinerary's travel year to
// the Use Year." Falls back to the contract's full annual allotment, same
// as getCurrentYearRow's own fallback, when no row exists yet for that cycle.
function getYearRowForDate(contract, dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const uyLabel = window.DVCDates.currentUYYear(contract.use_year, { year: y, month: m, day: d });
  const row = contractYearPoints.find(r => r.contract_id === contract.id && r.use_year_label === uyLabel);
  return row
    ? { remaining: row.points_remaining, banked: row.points_banked || 0, borrowed: row.points_borrowed || 0, holding: row.points_holding || 0 }
    : { remaining: contract.points_per_year, banked: 0, borrowed: 0, holding: 0 };
}

// Pools every active contract's balance for the cycle covering the trip --
// an owner with multiple contracts often funds one trip from more than one
// of them, so this checks total feasibility rather than any single contract
// alone. Uses itinerary.segments[0]'s check-in as the reference date for a
// split-stay itinerary (same simplification calcItineraryMetrics makes
// elsewhere on this page: one blended read per itinerary, not per segment).
// Borrow headroom is modeled the same "elastic capacity" way app.js's
// 11-to-7 Swap Simulator does (see CLAUDE.md) -- ceiling (DVCLedger's real
// 100%-of-next-year rule) minus whatever's ALREADY borrowed for that cycle,
// not a flat re-use of the ceiling, so an already-borrowed contract isn't
// double-counted.
function calcFeasibility(itinerary, totalPoints) {
  if (activeContracts.length === 0) return null;
  const refDate = itinerary.segments[0]?.checkIn;
  if (!refDate) return null;

  let available = 0, headroom = 0;
  for (const c of activeContracts) {
    const row = getYearRowForDate(c, refDate);
    available += row.remaining + row.banked + row.borrowed + row.holding;
    const ceiling = window.DVCLedger.validateBorrowedPoints(row.borrowed, c.points_per_year).maxAllowed;
    headroom += Math.max(0, ceiling - row.borrowed);
  }

  if (totalPoints <= available) {
    return { level: "funded", rank: 2, badge: "✅ Fully Funded", detail: `${Math.round(available - totalPoints).toLocaleString()} pts left over` };
  }
  if (totalPoints <= available + headroom) {
    return { level: "borrow", rank: 1, badge: "⚠️ Requires Borrowing", detail: `${Math.round(totalPoints - available).toLocaleString()} pts needed from next year` };
  }
  const deficit = totalPoints - available - headroom;
  return { level: "deficit", rank: 0, badge: "❌ Point Deficit", detail: `${Math.round(deficit).toLocaleString()} pts beyond max borrow` };
}

function renderGate() {
  pageContent.innerHTML = `
    <div class="gate">
      <p>Sign in to compare the itineraries you've saved from the calendar.</p>
      <div id="gate-signin-slot"></div>
    </div>
  `;
  window.DVCAuth.renderSignInButton(document.getElementById("gate-signin-slot"), "big-signin-btn", "large");
}

function renderUnconfigured() {
  pageContent.innerHTML = `<div class="gate"><p>Accounts aren't set up on this deployment yet.</p></div>`;
}

// direction "low" (default) picks the lowest value as best -- fewer
// points spent, lighter crowds. direction "high" picks the highest --
// cash value and $/point are about how much rack-rate value you're
// getting for your points, so more is the win there, not less. Returns a
// Set of every index tied for best (not just the first one found) -- a
// genuine tie should highlight both columns, not arbitrarily favor
// whichever happened to come first in the row.
function bestIndices(values, direction = "low") {
  let bestVal = null;
  for (const v of values) {
    if (v == null) continue;
    if (bestVal == null || (direction === "high" ? v > bestVal : v < bestVal)) bestVal = v;
  }
  if (bestVal == null) return new Set();
  return new Set(values.map((v, i) => (v === bestVal ? i : -1)).filter(i => i !== -1));
}

function buildCompareTableHTML(selected) {
  if (selected.length === 0) {
    return `<div class="empty-note">Pick at least one saved itinerary above to see its details.</div>`;
  }

  const metrics = selected.map(itin => calcItineraryMetrics(itin));

  const pointsBest = bestIndices(metrics.map(m => m.totalPoints));
  const cashBest = bestIndices(metrics.map(m => m.totalCash), "high");
  const crowdBest = bestIndices(metrics.map(m => m.avgCrowd));
  const cashPerPointBest = bestIndices(metrics.map(m => m.cashPerPoint), "high");

  // Header holds only identity (itinerary name, shorthand resort) -- no
  // room type, no dates, so it stays compact even with a split-stay
  // itinerary that stacks multiple segments in one column. Room type and
  // dates get their own rows below instead, same reasoning for each: a
  // segment's room type/date range should line up in a shared row across
  // every column, not be buried as header subtext that's awkward to
  // compare at a glance and wraps unpredictably at narrow widths.
  const headerCells = selected.map(itin => `
    <th>
      <div class="compare-col-title">${itin.name}</div>
      ${itin.segments.map(seg => `
        <div class="segment-line">
          <div class="segment-resort">${shorthandResortName(seg.resortId, resortName(seg.resortId, itin.year))}</div>
        </div>
      `).join("")}
    </th>
  `).join("");

  const roomTypeRow = selected.map(itin => `
    <td>
      ${itin.segments.map(seg => `
        <div class="segment-line">
          <div class="segment-room">${roomTypeName(seg.resortId, itin.year, seg.roomTypeId)}</div>
        </div>
      `).join("")}
    </td>
  `).join("");

  const datesRow = selected.map(itin => `
    <td>
      ${itin.segments.map(seg => `
        <div class="segment-line">
          <div class="segment-dates">${formatDateRange(seg.checkIn, seg.checkOut)}</div>
        </div>
      `).join("")}
    </td>
  `).join("");

  const hasContracts = activeContracts.length > 0;

  // Home Priority & Booking Window -- per segment, same stacking pattern as
  // roomTypeRow/datesRow above. Itinerary-level "best" uses the WORST
  // segment's rank (a split stay is only as good as its weakest leg).
  let homePriorityCells = "";
  if (hasContracts) {
    const perItin = selected.map(itin => itin.segments.map(seg => homePriorityForSegment(seg.resortId, seg.checkIn)));
    const worstRank = perItin.map(perSeg => Math.min(...perSeg.map(p => p.rank)));
    const bestSet = bestIndices(worstRank, "high");
    homePriorityCells = perItin.map((perSeg, i) => `
      <td${bestSet.has(i) ? ' class="row-best"' : ""}>${perSeg.map(windowBadgeHTML).join("")}</td>
    `).join("");
  }

  // Availability Risk Index (7-Month Odds) -- doesn't need a contract at
  // all (7-month odds matter to owners and renters alike), so this one
  // always renders regardless of hasContracts.
  const riskPerItin = selected.map(itin => itin.segments.map(seg => {
    const nights = nightsBetween(seg.checkIn, seg.checkOut);
    const score = get7MoScoreForSegment(seg.resortId, seg.roomTypeId, stayDateRange(seg.checkIn, nights));
    return riskTierForScore(score, nights);
  }));
  const riskWorstRanks = riskPerItin.map(perSeg => {
    const ranks = perSeg.filter(Boolean).map(t => t.rank);
    return ranks.length ? Math.min(...ranks) : null;
  });
  const riskBestSet = bestIndices(riskWorstRanks, "high");
  const riskRow = riskPerItin.map((perSeg, i) => `
    <td${riskBestSet.has(i) ? ' class="row-best"' : ""}>
      ${perSeg.map(t => t
        ? `<div class="segment-line"><span class="risk-badge risk-${t.level}">${t.badge}</span>${t.sub ? `<div class="risk-sub">${t.sub}</div>` : ""}</div>`
        : `<div class="segment-line">&mdash; No data</div>`
      ).join("")}
    </td>
  `).join("");

  // Point Balance & Feasibility Check -- one read per itinerary (not per
  // segment), against the itinerary's already-computed totalPoints.
  let feasibilityRow = "";
  if (hasContracts) {
    const feasibilityList = selected.map((itin, i) => calcFeasibility(itin, metrics[i].totalPoints));
    const bestSet = bestIndices(feasibilityList.map(f => f ? f.rank : null), "high");
    feasibilityRow = feasibilityList.map((f, i) => f
      ? `<td${bestSet.has(i) ? ' class="row-best"' : ""}><span class="feasibility-badge feasibility-${f.level}">${f.badge}</span><div class="feasibility-detail">${f.detail}</div></td>`
      : `<td>&mdash;</td>`
    ).join("");
  }

  const nightsRow = metrics.map(m => `<td class="compare-metric">${m.totalNights}</td>`).join("");
  const pointsRow = metrics.map((m, i) => `<td class="compare-metric${pointsBest.has(i) ? " best" : ""}">${m.totalPoints.toLocaleString()}</td>`).join("");
  const cashRow = metrics.map((m, i) => `<td class="compare-metric${cashBest.has(i) ? " best" : ""}">${m.totalCash != null ? fmt(m.totalCash) : "&mdash;"}</td>`).join("");
  const cashPerPointRow = metrics.map((m, i) => `<td class="compare-metric${cashPerPointBest.has(i) ? " best" : ""}">${m.cashPerPoint != null ? "$" + m.cashPerPoint.toFixed(2) : "&mdash;"}</td>`).join("");
  const pointsPerNightRow = metrics.map(m => `<td class="compare-metric">${m.pointsPerNight != null ? m.pointsPerNight.toFixed(1) : "&mdash;"}</td>`).join("");
  // The pill+label+checkmark are one nowrap inline-flex unit (.crowd-inline)
  // instead of relying on .compare-metric.best's usual ::after checkmark --
  // two cells with the IDENTICAL "7 Heavy ✓" content were rendering
  // differently purely because table auto-layout gave their columns
  // different widths. Forcing this short group to never wrap internally
  // makes every column render it identically.
  const crowdRow = metrics.map((m, i) => {
    if (m.avgCrowd == null) return `<td>&mdash;</td>`;
    return `
      <td class="crowd-cell${crowdBest.has(i) ? " compare-metric best" : ""}">
        <span class="crowd-inline">
          <span class="crowd-pill ${crowdClass(m.avgCrowdLabel)}">${m.avgCrowd}</span>
          <span>${m.avgCrowdLabel}</span>
          ${crowdBest.has(i) ? `<span class="crowd-check">&#10003;</span>` : ""}
        </span>
      </td>
    `;
  }).join("");

  const noContractsNote = hasContracts
    ? ""
    : `<div class="empty-note">Home Resort Priority and Point Feasibility need at least one active contract -- <a href="account.html">add one</a> to see them here.</div>`;

  // Stays ONE table at every width -- see the compact mobile ruleset in
  // <style> (table-layout:fixed + word-wrap, no horizontal scroll) for how
  // this fits a phone screen. A stacked Mobile Card Feed was tried and
  // rejected here: for an itinerary-vs-itinerary comparison, seeing every
  // option at once is the actual point, so trading that away for taller
  // single-column cards defeated the feature even though it "fit."
  return `
    ${noContractsNote}
    <div class="compare-table-wrap">
      <table class="compare-table">
        <thead><tr><th></th>${headerCells}</tr></thead>
        <tbody>
          <tr><th>Room Type</th>${roomTypeRow}</tr>
          <tr><th>Dates</th>${datesRow}</tr>
          ${hasContracts ? `<tr><th>Home Priority &amp; Window</th>${homePriorityCells}</tr>` : ""}
          <tr><th>Availability Risk (7mo)</th>${riskRow}</tr>
          ${hasContracts ? `<tr><th>Point Feasibility</th>${feasibilityRow}</tr>` : ""}
          <tr><th>Nights</th>${nightsRow}</tr>
          <tr><th>Total Points</th>${pointsRow}</tr>
          <tr><th>Cash Value</th>${cashRow}</tr>
          <tr><th>$ per Point</th>${cashPerPointRow}</tr>
          <tr><th>Points per Night</th>${pointsPerNightRow}</tr>
          <tr><th>Avg. Crowd Level</th>${crowdRow}</tr>
        </tbody>
      </table>
    </div>
  `;
}

function renderPickers() {
  return `
    <div class="picker-row" id="picker-row">
      ${[0, 1, 2].map(i => `
        <div class="picker-slot">
          <label for="picker-${i}">Trip ${String.fromCharCode(65 + i)}${i === 0 ? "" : " (optional)"}</label>
          <select id="picker-${i}" data-slot="${i}">
            <option value="">Choose a saved itinerary&hellip;</option>
            ${itineraries.map(itin => {
              // Disabled (not just skipped) so it stays visible in place,
              // making it clear *why* it's unavailable rather than the
              // list silently shrinking as other slots fill in.
              const takenElsewhere = selectedIds.some((id, j) => j !== i && id === itin.id);
              return `<option value="${itin.id}" ${selectedIds[i] === itin.id ? "selected" : ""} ${takenElsewhere ? "disabled" : ""}>${itin.name}${takenElsewhere ? " (already picked)" : ""}</option>`;
            }).join("")}
          </select>
        </div>
      `).join("")}
    </div>
  `;
}

function wirePickerListeners() {
  [0, 1, 2].forEach(i => {
    const sel = document.getElementById(`picker-${i}`);
    if (!sel) return;
    sel.addEventListener("change", (e) => {
      selectedIds[i] = e.target.value || null;
      document.getElementById("picker-row").outerHTML = renderPickers();
      wirePickerListeners();
      renderComparison();
      const selectedCount = selectedIds.filter(Boolean).length;
      if (selectedCount >= 2 && !splitStayScientistTracked) {
        splitStayScientistTracked = true;
        if (window.DVCTrack) window.DVCTrack.track("split-stay-scientist");
      }
    });
  });
}

function renderComparison() {
  const selected = selectedIds
    .map(id => itineraries.find(i => i.id === id))
    .filter(Boolean);
  document.getElementById("compare-output").innerHTML = buildCompareTableHTML(selected);
}

async function renderSignedIn() {
  const [itins, contracts, cyp] = await Promise.all([
    window.DVCAuth.getItineraries(),
    window.DVCAuth.getContracts(),
    window.DVCAuth.getContractYearPoints(),
  ]);
  itineraries = itins;
  activeContracts = contracts.filter(c => c.is_active);
  contractYearPoints = cyp;
  const allResortIds = [...new Set(RESORTS.map(r => r.id))];
  resortAccess = window.DVCAuth.getUserResortAccess(activeContracts, allResortIds);
  consumeIncomingCompareSelection();

  if (itineraries.length < 2) {
    pageContent.innerHTML = `
      <div class="section">
        <h2>Compare Itineraries</h2>
        <div class="empty-note">You need at least 2 saved itineraries to compare -- <a href="itineraries.html">go save another one</a> from the calendar first.</div>
      </div>
    `;
    return;
  }

  pageContent.innerHTML = `
    <div class="section">
      <h2>Compare Itineraries</h2>
      <div class="section-sub">Pick up to 3 saved itineraries. A green checkmark marks the better number in each row -- fewer points and lighter crowds win, but higher cash value and $/point win too (more rack-rate value for the points you're spending). Home Priority, Availability Risk, and Point Feasibility highlight the strongest option with a soft green badge instead.</div>
      ${renderPickers()}
    </div>
    <div class="section" id="compare-output"></div>
  `;

  wirePickerListeners();
  renderComparison();
}

function render(session) {
  if (!window.DVCAuth.isConfigured()) {
    renderUnconfigured();
  } else if (session) {
    renderSignedIn();
  } else {
    renderGate();
  }
}

function waitForAuth(attempts) {
  if (window.DVCAuth) {
    window.DVCAuth.onAuthChange(render);
  } else if (attempts > 0) {
    setTimeout(() => waitForAuth(attempts - 1), 50);
  } else {
    renderUnconfigured();
  }
}
waitForAuth(40);
  </script>
</body>
