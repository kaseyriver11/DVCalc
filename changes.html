  <script>
// ---- Constants ----
RESORTS.sort((a, b) => a.name.localeCompare(b.name));
const YEARS = [...new Set(RESORTS.map(r => r.year))].sort();
const SERIES_COLORS = ["#1a237e", "#e65100", "#2e7d32", "#c62828"];
const MAX_COMBOS = 4;

const SHORT_NAMES = {};
(function buildShortNames() {
  const seen = new Set();
  for (const r of RESORTS) {
    if (seen.has(r.id)) continue;
    seen.add(r.id);
    let n = r.name
      .replace(/Disney's\s*/g, "")
      .replace(/\s*at\s.*?(Resort|Tower).*$/i, "")
      .replace(/\s*Resort\s*(&|and)\s*Spa/i, "")
      .replace(/\s*Resort$/i, "")
      .replace(/\s*Villas?\s*(&|and)\s*(Bungalows|Cabins)/i, "")
      .replace(/\s*Villas?$/i, "");
    SHORT_NAMES[r.id] = n.trim() || r.name;
  }
})();

// ---- State ----
const state = {
  resortId: null,
  roomTypeId: null,
  selectedWeek: null,
  pinnedCombos: [], // [{resortId, roomTypeId}]
};

let cachedWeekCount = 0;

// ---- DOM ----
const resortSelect = document.getElementById("resort-select");
const roomSelect = document.getElementById("room-select");
const chartEl = document.getElementById("chart");
const weekLabelEl = document.getElementById("week-label");
const weekSummaryEl = document.getElementById("week-summary");
const comboChipsEl = document.getElementById("combo-chips");
const addComboBtn = document.getElementById("add-combo");

// ---- Helpers ----
function fmtDate(y, m, d) {
  return `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}

function getSundaysOfYear(year) {
  const sundays = [];
  const d = new Date(year, 0, 1, 12, 0, 0);
  while (d.getDay() !== 0) d.setDate(d.getDate() + 1);
  while (d.getFullYear() === year) {
    sundays.push(fmtDate(d.getFullYear(), d.getMonth(), d.getDate()));
    d.setDate(d.getDate() + 7);
  }
  return sundays;
}

function formatWeekLabel(sundayStr) {
  const sun = new Date(sundayStr + "T12:00:00");
  const sat = new Date(sun);
  sat.setDate(sat.getDate() + 6);
  const f = (d) => d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  return `${f(sun)}\u2013${f(sat)}`;
}

function calc7NightTotal(resortId, sundayStr, roomTypeId) {
  const d = new Date(sundayStr + "T12:00:00");
  let total = 0;
  let validNights = 0;
  for (let i = 0; i < 7; i++) {
    const dateStr = fmtDate(d.getFullYear(), d.getMonth(), d.getDate());
    const year = d.getFullYear();
    const resort = RESORTS.find(r => r.id === resortId && r.year === year);
    if (resort) {
      const rt = resort.roomTypes.find(r => r.id === roomTypeId);
      if (rt) {
        const pts = getPointsForDate(resort, dateStr, roomTypeId);
        if (pts) { total += pts; validNights++; }
      }
    }
    d.setDate(d.getDate() + 1);
  }
  return validNights === 7 ? total : null;
}

function getYearsForResort(resortId) {
  return YEARS.filter(y => RESORTS.some(r => r.id === resortId && r.year === y));
}

function getRoomTypeName(resortId, roomTypeId) {
  for (const r of RESORTS) {
    if (r.id === resortId) {
      const rt = r.roomTypes.find(t => t.id === roomTypeId);
      if (rt) return rt.name;
    }
  }
  return roomTypeId;
}

function comboLabel(resortId, roomTypeId) {
  return `${SHORT_NAMES[resortId] || resortId} \u2014 ${getRoomTypeName(resortId, roomTypeId)}`;
}

// ---- Combo Management ----
function getAllCombos() {
  const live = { resortId: state.resortId, roomTypeId: state.roomTypeId };
  // Skip the live combo if it matches a pinned one
  const liveIsPinned = state.pinnedCombos.some(c =>
    c.resortId === live.resortId && c.roomTypeId === live.roomTypeId
  );
  if (liveIsPinned) return [...state.pinnedCombos];
  return [live, ...state.pinnedCombos];
}

function addCombo() {
  if (state.pinnedCombos.length >= MAX_COMBOS - 1) return;
  // Don't add duplicates
  const exists = state.pinnedCombos.some(c =>
    c.resortId === state.resortId && c.roomTypeId === state.roomTypeId
  );
  if (exists) return;
  state.pinnedCombos.push({
    resortId: state.resortId,
    roomTypeId: state.roomTypeId,
  });
  render();
}

function removeCombo(idx) {
  state.pinnedCombos.splice(idx, 1);
  render();
}

// ---- Week Data ----
function generateWeekDataForCombo(resortId, roomTypeId) {
  const years = getYearsForResort(resortId);
  if (years.length === 0) return { years, weeks: [] };

  const allSundays = {};
  for (const y of years) allSundays[y] = getSundaysOfYear(y);

  const weekCount = Math.min(...years.map(y => allSundays[y].length));
  const weeks = [];

  for (let i = 0; i < weekCount; i++) {
    const week = { index: i };
    for (const y of years) {
      week[y] = calc7NightTotal(resortId, allSundays[y][i], roomTypeId);
    }
    week.label = formatWeekLabel(allSundays[years[0]][i]);
    weeks.push(week);
  }

  return { years, weeks };
}

function getCurrentWeekIndex(weekCount) {
  const today = new Date();
  today.setHours(12, 0, 0, 0);
  const thisYear = today.getFullYear();
  const sundays = getSundaysOfYear(thisYear);
  let currentWeekNum = 0;
  for (let i = sundays.length - 1; i >= 0; i--) {
    const sun = new Date(sundays[i] + "T12:00:00");
    if (sun <= today) { currentWeekNum = i; break; }
  }
  return Math.min(currentWeekNum, weekCount - 1);
}

// ---- Chart ----
function renderChart(comboData) {
  const selIdx = state.selectedWeek;
  const tooltipEl = document.getElementById("chart-tooltip");

  // Union of all years
  const allYears = [...new Set(comboData.flatMap(c => c.years))].sort((a, b) => a - b);

  if (allYears.length === 0) {
    chartEl.innerHTML = '<div style="text-align:center;color:#999;padding:40px;">No data available</div>';
    return;
  }

  // Gather all data points to compute Y range
  let allValues = [];
  for (const cd of comboData) {
    const w = cd.weeks[selIdx];
    if (!w) continue;
    for (const yr of cd.years) {
      if (w[yr] != null) allValues.push(w[yr]);
    }
  }

  if (allValues.length === 0) {
    chartEl.innerHTML = '<div style="text-align:center;color:#999;padding:40px;">No data available for this week</div>';
    return;
  }

  const minVal = Math.min(...allValues);
  const maxVal = Math.max(...allValues);
  const range = maxVal - minVal || 10;
  // Pick a "nice" step that gives roughly 5-7 grid lines
  const rawStep = range / 6;
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const nice = [1, 2, 5, 10].map(n => n * mag);
  const step = nice.find(n => n >= rawStep) || nice[nice.length - 1];
  const yMin = Math.floor((minVal - range * 0.15) / step) * step;
  const yMax = Math.ceil((maxVal + range * 0.15) / step) * step;

  const W = 600, H = 260;
  const L = 55, R = 570, T = 20, B = 220;
  const cW = R - L, cH = B - T;

  const xPos = (yr) => {
    if (allYears.length === 1) return L + cW / 2;
    const idx = allYears.indexOf(yr);
    return L + (idx / (allYears.length - 1)) * cW;
  };
  const yPos = (v) => B - ((v - yMin) / (yMax - yMin)) * cH;

  let svg = `<svg viewBox="0 0 ${W} ${H}" class="yoy-chart">`;

  // Grid lines + Y labels
  for (let v = yMin; v <= yMax; v += step) {
    const yy = yPos(v);
    svg += `<line x1="${L}" y1="${yy}" x2="${R}" y2="${yy}" stroke="#eee" stroke-width="1"/>`;
    svg += `<text x="${L - 8}" y="${yy + 4}" text-anchor="end" font-size="10" fill="#999">${v}</text>`;
  }

  // X-axis
  svg += `<line x1="${L}" y1="${B}" x2="${R}" y2="${B}" stroke="#ccc" stroke-width="1"/>`;

  // Year labels
  allYears.forEach((yr) => {
    const x = xPos(yr);
    svg += `<text x="${x}" y="${B + 16}" text-anchor="middle" font-size="11" font-weight="600" fill="#666">${yr}</text>`;
    svg += `<line x1="${x}" y1="${B}" x2="${x}" y2="${B + 4}" stroke="#ccc" stroke-width="1"/>`;
  });

  // Draw each combo's line + circles
  comboData.forEach((cd, ci) => {
    const color = SERIES_COLORS[ci % SERIES_COLORS.length];
    const w = cd.weeks[selIdx];
    if (!w) return;

    const pts = [];
    for (const yr of cd.years) {
      if (w[yr] != null) pts.push({ year: yr, value: w[yr] });
    }

    if (pts.length > 1) {
      const linePoints = pts.map(p => `${xPos(p.year)},${yPos(p.value)}`);
      svg += `<polyline points="${linePoints.join(" ")}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>`;
    }

    for (const p of pts) {
      const cx = xPos(p.year), cy = yPos(p.value);
      svg += `<circle cx="${cx}" cy="${cy}" r="5" fill="${color}" stroke="white" stroke-width="2"/>`;
    }
  });

  // Invisible year-column hover zones (rendered on top)
  const colW = allYears.length === 1 ? cW : cW / (allYears.length - 1);
  allYears.forEach((yr, i) => {
    const x = xPos(yr);
    const halfW = colW / 2;
    const x1 = Math.max(L - 10, x - halfW);
    const x2 = Math.min(R + 10, x + halfW);
    svg += `<rect x="${x1}" y="${T}" width="${x2 - x1}" height="${cH}" fill="transparent" class="year-hover" data-year="${yr}"/>`;
  });

  // Y-axis label
  svg += `<text x="14" y="${T + cH / 2}" text-anchor="middle" font-size="10" fill="#999" transform="rotate(-90, 14, ${T + cH / 2})">Points (7 nights)</text>`;

  svg += `</svg>`;
  chartEl.innerHTML = svg;

  // HTML tooltip hover handlers
  const chartCard = chartEl.closest(".chart-card");
  const svgEl = chartEl.querySelector("svg");

  function showTooltip(yearStr, mouseX, mouseY) {
    const yr = parseInt(yearStr);
    let html = `<div class="tt-year">${yr}</div>`;
    comboData.forEach((cd, ci) => {
      const color = SERIES_COLORS[ci % SERIES_COLORS.length];
      const w = cd.weeks[selIdx];
      if (!w) return;
      const val = w[yr];
      if (val == null) return;
      const label = comboLabel(cd.resortId, cd.roomTypeId);
      html += `<div class="tt-row">`;
      html += `<span class="tt-dot" style="background:${color}"></span>`;
      html += `<span class="tt-name">${label}</span>`;
      html += `<span class="tt-value">${val} pts</span>`;
      html += `</div>`;
    });

    tooltipEl.innerHTML = html;
    tooltipEl.classList.add("visible");

    // Position relative to chart-card
    const cardRect = chartCard.getBoundingClientRect();
    let left = mouseX - cardRect.left + 12;
    let top = mouseY - cardRect.top - 10;

    // Keep tooltip on screen
    const ttW = tooltipEl.offsetWidth;
    if (left + ttW > cardRect.width - 8) left = left - ttW - 24;
    if (top < 4) top = 4;

    tooltipEl.style.left = left + "px";
    tooltipEl.style.top = top + "px";
  }

  chartEl.querySelectorAll(".year-hover").forEach(el => {
    el.addEventListener("mouseenter", (e) => {
      showTooltip(el.dataset.year, e.clientX, e.clientY);
    });
    el.addEventListener("mousemove", (e) => {
      showTooltip(el.dataset.year, e.clientX, e.clientY);
    });
    el.addEventListener("mouseleave", () => {
      tooltipEl.classList.remove("visible");
    });
  });
}

// ---- Week Summary ----
function renderWeekSummary(comboData) {
  const selIdx = state.selectedWeek;

  let html = '';
  comboData.forEach((cd, ci) => {
    const color = SERIES_COLORS[ci % SERIES_COLORS.length];
    const w = cd.weeks[selIdx];
    if (!w) return;

    const label = comboLabel(cd.resortId, cd.roomTypeId);

    // Last two years with data
    const yearsWithData = cd.years.filter(yr => w[yr] != null);
    const show = yearsWithData.length > 2 ? yearsWithData.slice(-2) : yearsWithData;

    html += `<div class="combo-summary">`;
    html += `<div class="combo-summary-header">`;
    html += `<span class="combo-summary-dot" style="background:${color}"></span>`;
    html += `<span class="combo-summary-name">${label}</span>`;
    html += `</div>`;
    html += `<div class="combo-summary-values">`;

    for (const yr of show) {
      html += `<span class="combo-year-value">${yr}: <strong>${w[yr]} pts</strong></span>`;
    }

    // Delta
    if (show.length >= 2) {
      const v1 = w[show[show.length - 2]];
      const v2 = w[show[show.length - 1]];
      if (v1 != null && v2 != null) {
        const delta = v2 - v1;
        const pct = v1 > 0 ? ((delta / v1) * 100).toFixed(1) : "0.0";
        const sign = delta > 0 ? "+" : "";
        const cls = delta > 0 ? "up" : delta < 0 ? "down" : "same";
        html += `<span class="combo-delta ${cls}">${sign}${delta} (${sign}${pct}%)</span>`;
      }
    }

    html += `</div></div>`;
  });

  weekSummaryEl.innerHTML = html;
}

// ---- Chips ----
function renderChips() {
  const liveIsPinned = state.pinnedCombos.some(c =>
    c.resortId === state.resortId && c.roomTypeId === state.roomTypeId
  );

  let html = '';
  state.pinnedCombos.forEach((c, i) => {
    const colorIdx = liveIsPinned ? i : i + 1;
    const color = SERIES_COLORS[colorIdx % SERIES_COLORS.length];
    const label = comboLabel(c.resortId, c.roomTypeId);
    html += `<div class="combo-chip" style="border-color:${color}">`;
    html += `<span class="chip-dot" style="background:${color}"></span>`;
    html += `<span class="chip-text">${label}</span>`;
    html += `<span class="chip-remove" data-index="${i}">\u00d7</span>`;
    html += `</div>`;
  });
  comboChipsEl.innerHTML = html;

  // Remove handlers
  comboChipsEl.querySelectorAll(".chip-remove").forEach(el => {
    el.addEventListener("click", () => removeCombo(parseInt(el.dataset.index)));
  });

  // Disable add button at max
  addComboBtn.disabled = state.pinnedCombos.length >= MAX_COMBOS - 1;
}

// ---- Week Navigation ----
function changeWeek(direction) {
  if (!cachedWeekCount) return;
  let idx = state.selectedWeek + direction;
  if (idx < 0) idx = cachedWeekCount - 1;
  if (idx >= cachedWeekCount) idx = 0;
  state.selectedWeek = idx;
  render();
}

document.getElementById("prev-week").addEventListener("click", () => changeWeek(-1));
document.getElementById("next-week").addEventListener("click", () => changeWeek(1));
addComboBtn.addEventListener("click", addCombo);

// ---- Render ----
function render() {
  const combos = getAllCombos();

  // Generate week data for each combo
  const comboData = combos.map(c => ({
    resortId: c.resortId,
    roomTypeId: c.roomTypeId,
    ...generateWeekDataForCombo(c.resortId, c.roomTypeId),
  }));

  // Use the first combo's week count for navigation
  cachedWeekCount = comboData[0] ? comboData[0].weeks.length : 0;

  if (state.selectedWeek == null || state.selectedWeek >= cachedWeekCount) {
    state.selectedWeek = getCurrentWeekIndex(cachedWeekCount);
  }

  // Update week label from the first combo's data
  const w = comboData[0] && comboData[0].weeks[state.selectedWeek];
  weekLabelEl.textContent = w ? w.label : "";

  renderChart(comboData);
  renderWeekSummary(comboData);
  renderChips();
}

// ---- Populate ----
function populateResorts() {
  const seen = new Set();
  const unique = [];
  for (const r of RESORTS) {
    if (!seen.has(r.id)) { seen.add(r.id); unique.push(r); }
  }
  unique.sort((a, b) => a.name.localeCompare(b.name));
  resortSelect.innerHTML = "";
  for (const r of unique) {
    const opt = document.createElement("option");
    opt.value = r.id;
    opt.textContent = r.name;
    resortSelect.appendChild(opt);
  }
  const defaultResort = unique.find(r => r.id === "copperCreek") || unique[0];
  state.resortId = defaultResort.id;
  resortSelect.value = state.resortId;
}

function populateRoomTypes() {
  const latestYear = [...YEARS].reverse().find(y => RESORTS.some(r => r.id === state.resortId && r.year === y));
  const resort = RESORTS.find(r => r.id === state.resortId && r.year === latestYear);
  if (!resort) return;
  roomSelect.innerHTML = "";
  for (const rt of resort.roomTypes) {
    const opt = document.createElement("option");
    opt.value = rt.id;
    opt.textContent = `${rt.name} (sleeps ${rt.sleeps})`;
    roomSelect.appendChild(opt);
  }
  state.roomTypeId = resort.roomTypes[0].id;
  roomSelect.value = state.roomTypeId;
}

// ---- Events ----
resortSelect.addEventListener("change", (e) => {
  state.resortId = e.target.value;
  state.selectedWeek = null;
  populateRoomTypes();
  render();
});

roomSelect.addEventListener("change", (e) => {
  state.roomTypeId = e.target.value;
  render();
});

// ---- Init ----
populateResorts();
populateRoomTypes();
render();
  </script>
</body>
</html>
