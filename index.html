<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DVC Points Calendar</title>
  <link rel="stylesheet" href="styles.css">
  <script data-goatcounter="https://dvcalc.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</head>
<body>

  <div class="header">
    <h1>DVC Points Calendar</h1>
    <div class="subtitle">Disney Vacation Club — Vacation Points Per Night</div>
    <div class="header-links">
      <a href="changes.html">Year-over-Year</a>
      <a href="compare.html">Compare Resorts &rarr;</a>
    </div>
  </div>

  <div class="controls">
    <div class="control-group">
      <label>Resort</label>
      <div class="searchable-select" id="resort-select-wrapper">
        <input type="text" id="resort-search" placeholder="Search resorts..." autocomplete="off">
        <div class="searchable-dropdown" id="resort-dropdown"></div>
      </div>
    </div>
    <div class="control-group">
      <label for="room-select">Room Type</label>
      <div class="custom-select">
        <select id="room-select" class="native-select"></select>
        <button type="button" class="custom-select-trigger">
          <span class="custom-select-value"></span>
          <span class="custom-select-arrow"></span>
        </button>
        <div class="custom-select-dropdown"></div>
      </div>
    </div>
    <div class="control-group">
      <label for="booking-window">Booking Window</label>
      <div class="custom-select">
        <select id="booking-window" class="native-select">
          <option value="all">All Dates</option>
          <option value="11mo">11-Month</option>
          <option value="7mo">7-Month</option>
        </select>
        <button type="button" class="custom-select-trigger">
          <span class="custom-select-value"></span>
          <span class="custom-select-arrow"></span>
        </button>
        <div class="custom-select-dropdown"></div>
      </div>
    </div>
    <div class="control-group">
      <label for="year-select">Points Year</label>
      <div class="custom-select custom-select-narrow">
        <select id="year-select" class="native-select"></select>
        <button type="button" class="custom-select-trigger">
          <span class="custom-select-value"></span>
          <span class="custom-select-arrow"></span>
        </button>
        <div class="custom-select-dropdown"></div>
      </div>
    </div>
  </div>

  <div class="main-layout">
    <div class="calendar-side">
      <div class="month-nav">
        <button id="prev-month">&larr;</button>
        <span id="month-label" class="month-label"></span>
        <button id="next-month">&rarr;</button>
      </div>
      <div class="selection-hint" id="selection-hint">Click a check-in date</div>
      <div class="calendar-grid-scroll">
        <div id="calendar-grid" class="calendar-grid"></div>
      </div>
      <div class="legend">
        <span class="legend-title">Travel Period:</span>
        <div id="legend-items" class="legend-items"></div>
        <a class="source-link" href="https://disneyvacationclub.disney.go.com/vacation-planning/points-charts/" target="_blank" rel="noopener">Source: DVC Points Charts</a>
      </div>
      <div class="legend">
        <span class="legend-title">Crowd Level:</span>
        <div id="crowd-legend-items" class="legend-items"></div>
        <a class="source-link" href="https://www.undercovertourist.com/orlando/crowd-calendar/" target="_blank" rel="noopener">Source: Undercover Tourist</a>
      </div>
    </div>
    <div class="summary-side">
      <div id="action-buttons"></div>
      <div id="summary"></div>
    </div>
  </div>

  <div class="modal-overlay" id="alternatives-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Find a Better Stay</h3>
        <button class="modal-close" onclick="closeAlternativesModal()" aria-label="Close">&times;</button>
      </div>
      <div id="alternatives-modal-body"></div>
    </div>
  </div>

  <script src="data/data.js"></script>
  <script src="data/data_historical.js"></script>
  <script src="data/availability_data.js"></script>
  <script src="data/undercovertourist_2026.js"></script>
  <script src="data/undercovertourist_2027.js"></script>
  <script src="app.js"></script>

</body>
</html>
