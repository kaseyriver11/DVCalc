  const perks = window.DVCAuth?.evaluateContractPerks({
    purchase_type: purchaseType,
    purchase_date: purchaseDate || null,
    points_per_year: pointsPerYear,
    home_resort_id: resortId,
    blue_card_override: blueCardOverride ?? null,
  });
  return `
    <div class="wallet-card-decor"></div>
    <div class="wallet-card-top">
      <div class="wallet-card-top-left">
        <div class="wallet-card-name">${resortName(resortId)}</div>
        ${nickname ? `<div class="wallet-card-nickname">${nickname}</div>` : ""}
      </div>
      <div class="wallet-card-top-right">
        <div class="wallet-card-peek-stats">
          <span class="wallet-card-peek-pill">${points} pts</span>
          <span class="wallet-card-peek-pill">${useYear.toUpperCase()}</span>
        </div>
      </div>
    </div>
    <div class="wallet-card-points">
      <div class="wallet-card-points-num">${points}</div>
      <div class="wallet-card-points-label">POINTS / YR</div>
    </div>
    <div class="wallet-card-bottom">
      <div class="wallet-card-bottom-left">
        <span class="wallet-card-pill">${useYear.toUpperCase()} UY</span>
        <span class="wallet-card-pill">${purchaseType.toUpperCase()}</span>
        ${isActive ? "" : `<span class="wallet-card-pill">INACTIVE</span>`}
        ${buildPerkPillHTML(perks)}
      </div>
      ${deadline ? `
      <div class="wallet-card-deadline-pill tooltip-anchor tooltip-align-right">
        ⏳ Bank by ${formatShortDate(deadline.ms)}
        <div class="tooltip-card">Banking deadline: ${formatDeadlineWithCountdown(deadline.ms, deadline.daysUntil)}. Current points must be banked by then to move to the next use year.</div>
      </div>` : ""}
    </div>
  `;
}

// Card FACES only -- a fixed-size, credit-card-shaped deck. All ledger
// detail lives in renderActiveContractDetails() below, kept in sync here
// so every caller of renderContractList() automatically updates both.
function renderContractList(contracts, resorts, yearPointsByContract) {
  const list = document.getElementById("contract-list");
  const addFormBtn = document.getElementById("show-add-form");
  if (contracts.length === 0) {
    addFormBtn.style.display = "none";
    list.className = "contract-list";
    list.innerHTML = `
      <div class="empty-vault-hero" id="empty-vault-hero">
        <div class="empty-vault-hero-title">Your Digital Vault is Waiting</div>
        <div class="empty-vault-hero-sub">Add your first contract to unlock personalized 11-month booking windows and track your road to House Money.</div>
        <button type="button" class="add-btn" id="hero-create-btn">Issue Your First Deed &rarr;</button>
      </div>
    `;
    document.getElementById("hero-create-btn").addEventListener("click", () => openForm(null));
    activeWalletCardId = null;
    renderActiveContractDetails(contracts, yearPointsByContract);
    return;
  }
  addFormBtn.style.display = "";
  // Only the just-saved brand-new contract (if any) gets the shimmer, and
  // only on this one render -- clearing the flag now means a later
  // re-render (switching cards, editing a different contract) won't
  // replay the animation on a card that isn't actually new any more.
  const justIssued = justIssuedContractId;
  justIssuedContractId = null;
  // Deck mode only kicks in at 2+ contracts -- a single contract always
  // renders flat/full (see the .wallet-deck-scoped CSS), nothing to stack.
  const isDeck = contracts.length >= 2;
  if (!contracts.some(c => c.id === activeWalletCardId)) {
    activeWalletCardId = contracts[0].id;
  }
  list.className = "contract-list" + (isDeck ? " wallet-deck" : "");
  const today = todayInEastern();
  // The active card always renders LAST -- not just z-index-boosted in
  // place -- so it's physically the front card in the stack (nothing after
  // it to overlap it), matching how a real card fan works. Everyone else
  // keeps their relative order behind it.
  const renderOrder = isDeck
    ? [...contracts.filter(c => c.id !== activeWalletCardId), ...contracts.filter(c => c.id === activeWalletCardId)]
    : contracts;
  list.innerHTML = renderOrder.map(c => {
    // Card face's deadline pill only shows for a genuinely open, actionable
    // banking window -- "use-by"/"accounted" get their nuanced messaging in
    // the ledger panel below instead of a misleading "Bank by" pill here.
    const status = c.is_active ? evaluateContractDeadlineStatus(c, yearPointsByContract, today) : null;
    const deadline = status?.kind === "bankable" ? status.deadline : null;
    const isActiveCard = isDeck && c.id === activeWalletCardId;
    const shimmer = c.id === justIssued ? " newly-issued" : "";
    return `
    <div class="wallet-card ${c.is_active ? "" : "inactive"}${isActiveCard ? " active-card" : ""}${shimmer}" data-contract-id="${c.id}" style="background: ${walletCardGradient(c.home_resort_id)};">
      ${buildWalletCardFaceHTML({
        resortId: c.home_resort_id,
        nickname: c.nickname,
        pointsPerYear: c.points_per_year,
        useYear: c.use_year,
        purchaseType: c.purchase_type,
        purchaseDate: c.purchase_date,
        blueCardOverride: c.blue_card_override,
        isActive: c.is_active,
        deadline,
      })}
    </div>
  `;
  }).join("");
  if (isDeck) applyDeckPeekSpacing();
  renderActiveContractDetails(contracts, yearPointsByContract);
}

// Resort names vary a lot in length -- some wrap to 2 lines, some have a
// nickname line too. A fixed peek height (the old flat -145px margin)
// truncates a longer name behind whichever card overlaps it. Instead,
// measure each card's actual title-block height and give the NEXT card
// just enough negative margin to clear it, so every card's title stays
// fully visible no matter how it wraps.
function applyDeckPeekSpacing() {
  const cards = [...document.querySelectorAll("#contract-list.wallet-deck > .wallet-card")];
  // Below 600px (matching this file's own @media (max-width: 600px) deck
  // rules), the mobile stylesheet already sets a fixed, reliable peek
  // margin against a fixed 168px card height -- name/nickname are truncated
  // to one line there specifically so that fixed number holds regardless of
  // content. Setting an inline margin-top here would win over it (inline
  // beats any class selector, media query or not) using the DESKTOP
  // CARD_HEIGHT (215) against an actually-168px-tall card, producing a much
  // tighter overlap than intended -- clear our own override instead and let
  // the CSS rule apply.
  if (window.innerWidth <= 600) {
    cards.forEach((card, i) => {
      card.style.marginTop = "";
      card.style.zIndex = String(i + 1);
    });
    return;
  }
  const CARD_HEIGHT = 215;
  const TOP_PADDING = 20;
  const PEEK_BUFFER = 10;
  // .active-card additionally lifts -16px via transform (a purely visual
  // shift that doesn't move it in layout flow) -- account for that on top
  // of the margin, or the active card's extra lift eats straight into
  // whichever card's title is peeking out just behind it.
  const ACTIVE_LIFT = 16;
  for (let i = 1; i < cards.length; i++) {
    const prevTop = cards[i - 1].querySelector(".wallet-card-top");
    const lift = cards[i].classList.contains("active-card") ? ACTIVE_LIFT : 0;
    const peekHeight = Math.max(70, TOP_PADDING + prevTop.offsetHeight + PEEK_BUFFER + lift);
    cards[i].style.marginTop = `-${CARD_HEIGHT - peekHeight}px`;
  }
  // Explicit, unambiguous paint order -- each card gets a numeric z-index
  // matching its DOM position (the active card, always last, naturally
  // lands highest) instead of leaning on implicit same-stacking-context
  // DOM-order painting, which some browsers get wrong once several
  // position:relative siblings overlap via negative margins -- that can let
  // a covered card's text bleed through the one stacked in front of it.
  cards.forEach((card, i) => { card.style.zIndex = String(i + 1); });
}

// The ledger (use-year rows, bars, steppers, +Plan a year) and Edit/
// Deactivate/Delete actions for whichever card is active -- lives below
// the deck, not inside the card face. Empty when there are no contracts.
// Short-notice stay ideas for expiring, unbankable points
// (dvc-leftover-points.js). Expiring points always mean booking close in,
// when most resorts are sold out, so a stay is only suggested when DVC
// Field Guide history (data/availability_data.js) gives Good+ odds at that
// lead time -- same bar as the calendar's Booking Outlook. Respects this
// contract's own booking windows (11 months home, 7 months elsewhere, none
// at resale-restricted resorts) and Holding's 60-day booking rule. Cached
// per contract/balance: the ledger re-renders on every stepper edit and
// the search walks every resort/room/night in the window.
const leftoverStaysCache = new Map();
function findLeftoverStays(c, status, todayMs) {
  const key = [c.id, status.points, status.holding, status.expiresMs, todayMs].join("|");
  if (leftoverStaysCache.has(key)) return leftoverStaysCache.get(key);
  const D = window.DVCDates, L = window.DVCLeftoverPoints, DAY = 86400000;
  const iso = ms => new Date(ms).toISOString().slice(0, 10);
  const allIds = [...new Set(RESORTS.map(r => r.id))];
  const access = window.DVCAuth.getUserResortAccess([c], allIds);
  const holdingCap = status.holding > 0 ? iso(todayMs + window.DVCLedger.HOLDING_BOOKING_WINDOW_DAYS * DAY) : "9999-12-31";
  const capFor = id => access.homeResortIds.has(id) ? D.monthsFromDate(11) : access.sevenMoResortIds.has(id) ? D.monthsFromDate(7) : null;
  const resorts = allIds.map(id => {
    const cap = capFor(id);
    const chart = RESORTS.find(r => r.id === id);
    return cap && chart ? { resortId: id, maxCheckIn: cap < holdingCap ? cap : holdingCap, roomTypeIds: chart.roomTypes.map(rt => rt.id) } : null;
  }).filter(Boolean);
  const priceCache = new Map();
  const pointsFor = (resortId, roomTypeId, dateStr) => {
    const k = resortId + "|" + roomTypeId + "|" + dateStr;
    if (!priceCache.has(k)) {
      const chart = RESORTS.find(r => r.id === resortId && r.year === Number(dateStr.slice(0, 4)));
      priceCache.set(k, chart ? (getPointsForDate(chart, dateStr, roomTypeId) ?? null) : null);
    }
    return priceCache.get(k);
  };
  const availabilityFor = (resortId, roomTypeId, nightStr, checkInStr) =>
    L.availabilityScore(window.AVAILABILITY_DATA ?? (typeof AVAILABILITY_DATA !== "undefined" ? AVAILABILITY_DATA : null),
      resortId, roomTypeId, nightStr, L.bookingWindowKey((Date.parse(checkInStr + "T00:00:00Z") - todayMs) / DAY));
  const search = { points: status.points, fromDate: iso(todayMs + DAY), lastNightDate: iso(status.expiresMs), resorts, pointsFor };
  const stays = L.findStays({ ...search, availabilityFor });
  // Only needed to word the empty state: too few points vs. no likely openings.
  const result = { stays, affordable: stays.length > 0 || L.findStays({ ...search, limit: 1 }).length > 0 };
  leftoverStaysCache.set(key, result);
  return result;
}

function buildLeftoverStaysHTML(c, status, todayMs) {
  if (!window.DVCLeftoverPoints || !window.DVCAuth?.getUserResortAccess || !window.DVCCompareHandoff || typeof RESORTS === "undefined" || typeof AVAILABILITY_DATA === "undefined") return "";
  const { stays, affordable } = findLeftoverStays(c, status, todayMs);
  const transfer = "You can transfer them to another member (one transfer per use year).";
  if (!stays.length) {
    return `<div class="ledger-deadline-warning muted">${affordable
      ? `Resorts this contract can book rarely have openings this close in. ${transfer}`
      : `No night costs ${status.points} pts or less before they expire. ${transfer}`}</div>`;
  }
  const fmt = s => new Date(s + "T00:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
  const items = stays.map(s => {
    const chart = RESORTS.find(r => r.id === s.resortId);
    const room = chart.roomTypes.find(rt => rt.id === s.roomTypeId)?.name || s.roomTypeId;
    const href = window.DVCCompareHandoff.url({ resortId: s.resortId, roomTypeId: s.roomTypeId, checkIn: s.checkIn, checkOut: s.checkOut });
    const odds = window.DVCLeftoverPoints.oddsLabel(s.availability, s.nights);
    return `<a class="leftover-stay" href="${href}"><span class="leftover-stay-head"><span class="leftover-stay-name">${shorthandResortName(s.resortId, chart.name)}</span><span class="leftover-stay-odds ${odds.toLowerCase()}">${odds} odds</span></span><span class="leftover-stay-detail">${room} &middot; ${s.nights} night${s.nights === 1 ? "" : "s"} &middot; ${s.pointsUsed} pts &middot; from ${fmt(s.checkIn)} &rarr;</span></a>`;
  }).join("");
  return `<div class="leftover-stays"><div class="leftover-stays-title">Most likely to have short-notice openings${status.holding > 0 ? " within 60 days" : ""}</div><div class="leftover-stays-list">${items}</div><div class="leftover-stays-note">Based on past availability this close in. Odds drop as dates get closer, so book soon.</div></div>`;
}

function buildLedgerAttentionHTML(c, row, status, todayMs) {
  if (!row.balance_confirmed_at) return `<div class="ledger-deadline-warning muted">Balance not added. Your ${c.points_per_year} annual points are not an available balance.</div>`;
  const holdingStatus = row.points_holding > 0 ? window.DVCLedger.holdingExpiration(row.expiresMs, todayMs) : null;
  return `        ${status?.kind === "bankable"
          ? `<div class="ledger-deadline-warning ${urgencyTier(status.deadline.daysUntil)}">⏳ Bank current points by ${formatDeadlineWithCountdown(status.deadline.ms, status.deadline.daysUntil)}</div>`
          : status?.kind === "use-by"
          ? `<div class="ledger-deadline-warning ${expirationTier(status.daysUntil)}">🔒 ${status.points} pts (${status.buckets}) expire ${formatDeadlineWithCountdown(status.expiresMs, status.daysUntil)}${status.holding ? ". Holding points: book within 60 days of check-in." : ""}</div>${buildLeftoverStaysHTML(c, status, todayMs)}`
          : status?.kind === "accounted"
          ? `<div class="ledger-deadline-warning muted">✅ All points accounted for this year</div>`
          : `<div class="ledger-deadline-warning muted">For use between ${formatDeadlineDate(dateOnlyUTC(row.year, USE_YEAR_START_MONTH[c.use_year], 1))} and ${formatDeadlineDate(row.expiresMs)}</div>`}
        ${row.points_holding > 0 && status?.kind !== "use-by"
          ? holdingStatus
            ? `<div class="ledger-deadline-warning${holdingStatus.daysUntil <= 14 ? "" : " muted"}">🅿️ ${row.points_holding} holding pts expire ${formatDeadlineDate(holdingStatus.ms)} (${holdingStatus.daysUntil}d). Book within 60 days of check-in.</div>`
            : `<div class="ledger-deadline-warning">🅿️ ${row.points_holding.toLocaleString()} pts in Holding &mdash; use before this use year ends; book within 60 days of check-in</div>`
          : ""}
`;
}

function renderActiveContractDetails(contracts, yearPointsByContract) {
  const el = document.getElementById("active-contract-details");
  const c = contracts.find(c => c.id === activeWalletCardId);
  if (!c) {
    el.innerHTML = "";
    el.style.display = "none";
    return;
  }
  el.style.display = "";
  el.style.borderTopColor = walletCardPrimaryColor(c.home_resort_id);
  const perks = window.DVCAuth?.evaluateContractPerks({
    purchase_type: c.purchase_type,
    purchase_date: c.purchase_date || null,
    points_per_year: c.points_per_year,
    home_resort_id: c.home_resort_id,
    blue_card_override: c.blue_card_override,
  });
  const today = todayInEastern();
  const uyYear = currentUYYear(c.use_year, today);
  const rows = buildLedgerRows(c, yearPointsByContract, today);
  const canAddYear = rows.length < MAX_LEDGER_ROWS;
  const nextAddableYear = rows[rows.length - 1].year + 1;

  // Default (or recover from a stale selection, e.g. after removing a
  // planned year) to the current cycle -- one row shown at a time, not a
  // stacked table of every year at once.
  if (!rows.some(r => r.year === activeLedgerYearTab)) {
    activeLedgerYearTab = uyYear;
  }
  const row = rows.find(r => r.year === activeLedgerYearTab);
  const total = row.points_remaining + row.points_banked + row.points_borrowed + row.points_holding;
  const isCurrentTab = row.year === uyYear;
  // dvc-ledger.js's borrow-cap rule is checked against the contract's
  // annual allotment -- there's no separate "next year's adjusted
  // allotment" concept in this data model, just points_per_year.
  const borrowCheck = window.DVCLedger?.validateBorrowedPoints(row.points_borrowed, c.points_per_year);
  // The banking deadline math is only meaningful for the cycle actually
  // active right now -- a "Plan Ahead" row gets its own expiration date
  // instead of a fabricated deadline.

// "YYYY-MM-DD" for today in Eastern time (matches a <input type="date">'s
// expected value format) -- used to auto-fill the Holding entered-date
// field, same Eastern-time convention every other deadline calc here uses.
function todayDateInputValue() {
  const t = todayInEastern();
  return `${t.year}-${String(t.month).padStart(2, "0")}-${String(t.day).padStart(2, "0")}`;
}

async function addLedgerYear(contract, year, yearPointsByContract) {
  const result = await window.DVCAuth.upsertContractYearPoints({
    contract_id: contract.id,
    use_year_label: year,
    points_remaining: 0,
    balance_confirmed_at: null,
    points_banked: 0,
    points_borrowed: 0,
    points_holding: 0,
    points_holding_entered_at: null,
  });
  if (result.error) {
    alert(`Couldn't add ${year}: ${result.error}`);
    return;
  }
  (yearPointsByContract[contract.id] ||= []).push(result.data);
  activeLedgerYearTab = year; // select the tab the user just created

async function removeLedgerYear(contractId, year, yearPointsByContract) {
  const rows = yearPointsByContract[contractId] || [];
  const row = rows.find(r => r.use_year_label === year);
  if (row) {
    await window.DVCAuth.deleteContractYearPoints(row.id);
    yearPointsByContract[contractId] = rows.filter(r => r.id !== row.id);
  }
  // renderActiveContractDetails() falls back to the current-year row on its
  // own if the removed year was selected -- no need to check here first.
  if (year === activeLedgerYearTab) activeLedgerYearTab = null;
  renderSignedIn();

function setPurchaseType(type) {

// Blue Card override: tri-state DOM-as-state, same convention as
// get/setPurchaseType above. "" (Auto-Detect) maps to null -- the DB
// column and evaluateContractPerks() both treat null as "use the
// automatic year-based determination," not a third real value.
function setBlueCardOverride(value) {
  const target = value === true ? "f-bluecard-eligible" : value === false ? "f-bluecard-ineligible" : "f-bluecard-auto";
  document.querySelectorAll("#f-bluecard-toggle button").forEach(btn => {
    btn.classList.toggle("selected", btn.id === target);
  });
}

function getSelectedBlueCardOverride() {
  const selected = document.querySelector("#f-bluecard-toggle button.selected");
  const raw = selected?.dataset.override;
  return raw === "true" ? true : raw === "false" ? false : null;
}

// Use Year chips: DOM-as-state, same convention as get/setPurchaseType
// above -- the ".selected" class on a chip button IS the current value,
// not a mirrored JS variable. Selecting one live-updates the deadline
// line below the chips so switching use years shows its own deadline
// immediately, before the contract is even saved.
function setUseYear(year) {
  document.querySelectorAll(".use-year-chip").forEach(btn => btn.classList.toggle("selected", btn.dataset.year === year));
  const d = nextDeadlineForUseYear(year, todayInEastern());
  document.getElementById("f-useyear-deadline").textContent = `Banking deadline: ${formatDeadlineWithCountdown(d.ms, d.daysUntil)}`;
}

function getSelectedUseYear() {
  return document.querySelector(".use-year-chip.selected")?.dataset.year || USE_YEARS[0];
}

// Compact live summary keeps the chosen contract visible above the fields.
// The rest of the app (Blue Card eligibility, resale-restriction dates,
// trips.html's amortization schedule) all key off a real purchase_date
// string -- storing January 1st of the acquisition year, rather than
// adding a second "acquisition_year" column/field everywhere, keeps every
// one of those consumers working unchanged. Trade-off: a contract actually
// bought mid-year loses month-level precision against a threshold that
// falls later in that same calendar year (e.g. the 2016-04-04 Blue Card
// minimum, or the 2011-03-21 general-resale cutoff) -- acceptable given
// most owners only remember the rough year anyway, but worth knowing if a
// borderline-year contract's Blue Card/resale status looks off by one year.
// An edit keeps the contract's stored full date whenever its year wasn't
// changed -- rebuilding it from the year alone silently turned a known
// 2020-06-15 into 2020-01-01 on a nickname-only edit (UX2-04).
let editingPurchaseDate = null;
function acquisitionYearToPurchaseDate(yearInputEl) {
  const year = parseInt(yearInputEl.value, 10);
  if (!year) return null;
  if (editingPurchaseDate && parseInt(editingPurchaseDate.slice(0, 4), 10) === year) return editingPurchaseDate;
  return `${year}-01-01`;
}

let modalStep = 1;
function showStudioStep(step, { instant = false } = {}) {
  modalStep = step;

let useYearChosen = false;
function openForm(contract) {
  editingId = contract ? contract.id : null;
  useYearChosen = !!contract;
  isEditingMode = !!contract;
  document.getElementById("studio-stepper").classList.toggle("jumpable", isEditingMode);
  document.getElementById("form-error").style.display = "none";
  document.getElementById("f-nickname").value = contract?.nickname || "";

  // for the (hidden-on-step-1) preview, but no chip claims to be chosen.
  const resortId = contract?.home_resort_id || uniqueResorts()[0].id;
  document.getElementById("f-resort").value = resortId;
  document.querySelectorAll(".resort-chip").forEach(chip => {
    chip.classList.toggle("selected", !!contract && chip.dataset.resort === resortId);
    chip.hidden = false;
  });
  document.getElementById("resort-chip-search").value = "";
  document.getElementById("resort-chip-empty").hidden = true;
  setUseYear(contract?.use_year || USE_YEARS[0]);
  if (!contract) {
    document.querySelectorAll(".use-year-chip").forEach(chip => chip.classList.remove("selected"));
    document.getElementById("f-useyear-deadline").textContent = "Choose the use year printed on your contract.";
  }
  document.getElementById("f-points").value = contract?.points_per_year || "";
  document.querySelectorAll(".points-preset-chip").forEach(chip => chip.classList.toggle("selected", chip.dataset.points == contract?.points_per_year));
  document.getElementById("f-price").value = contract?.purchase_price || "";
  // Editing an existing contract shows its real acquisition year; a brand
  // new one defaults to the current year, since most owners entering this
  // for the first time are doing so at (or right after) purchase.
  editingPurchaseDate = contract?.purchase_date || null;
  document.getElementById("f-acquisition-year").value = contract?.purchase_date
    ? parseInt(contract.purchase_date.slice(0, 4), 10)
    : new Date().getFullYear();
  setPurchaseType(contract?.purchase_type || "direct");
  setBlueCardOverride(contract?.blue_card_override ?? null);
  document.getElementById("contract-modal-title").textContent = contract ? "Edit Contract" : "Add Contract";
  document.getElementById("save-contract").textContent = contract ? "Save Changes" : "Save Contract";
  updateModalCardPreview();

  // an existing one skips straight to Step 3 (its most-likely-to-be-tweaked
  // step) with no slide animation, and the stepper pills become clickable
  // (.jumpable, toggled above) so any step can be revisited directly.
  showStudioStep(isEditingMode ? 3 : 1, { instant: isEditingMode });
  document.getElementById("contract-modal").classList.add("open");
}

function updateBalanceCorrectionPreview(input) {
  const card = input.closest('[data-balance-year]');
  const totalInput = card.querySelector('[data-balance-total]');
  const preview = card.querySelector('.balance-correction-preview');

  const parsed = parseBalanceCard(card);
  const unchanged = parsed.skipped || (!parsed.error && JSON.stringify(parsed.row) === card.dataset.savedBuckets);
  card.dataset.unsaved = unchanged ? '' : 'true';
  card.querySelector('.balance-card-status').textContent = card.dataset.saveUnknown === 'true' ? 'Save not confirmed' : unchanged ? (parsed.skipped ? 'Leave unchanged' : 'Saved') : 'Unsaved changes';
  refreshBalanceSaveActions();

function parseBalanceCard(card) {
  const parts = Object.fromEntries([...card.querySelectorAll('[data-balance-bucket]')].map(input => [input.dataset.balanceBucket,input.value]));

async function closeBalanceSetup() {
  if (balanceSetupBusy) return;
  document.getElementById('balance-setup-modal').classList.remove('open');
  await renderSignedIn();
}
async function saveBalanceSetup() {
  if (balanceSetupBusy) return;
  const error = document.getElementById('balance-setup-error');
  error.hidden = true;
  const entries = [];
  for (const card of document.querySelectorAll('[data-balance-year]')) {
    const parsed = parseBalanceCard(card);
    if (parsed.error) { error.textContent = `${card.dataset.balanceYear}: ${parsed.error}`; error.hidden=false; card.scrollIntoView({block:'center',behavior:'smooth'}); return; }
    if (!parsed.skipped && (JSON.stringify(parsed.row) !== card.dataset.savedBuckets || card.dataset.saveUnknown === 'true')) entries.push({card,year:Number(card.dataset.balanceYear),row:parsed.row});
  }
  balanceSetupBusy = true;
  document.querySelectorAll('#balance-setup-modal button, #balance-setup-modal input').forEach(el=>el.disabled=true);
  document.getElementById('save-balances').textContent = 'Saving...';
  let success = false;
  let savingEntry = null;
  try {
    for (const entry of entries) {
      savingEntry = entry;
      const signature = JSON.stringify(entry.row);
      const existing = (balanceSetupRows[balanceSetupContract.id] || []).find(r=>r.use_year_label===entry.year);
      const result = await window.DVCAuth.upsertContractYearPoints({contract_id:balanceSetupContract.id,use_year_label:entry.year,...entry.row,points_holding_entered_at:existing?.points_holding_entered_at || null,balance_confirmed_at:new Date().toISOString()});
      if (result.error || !result.data) throw new Error(result.error || 'No saved balance was returned.');
      balanceSetupSaved.set(entry.year,signature);
      const rows = (balanceSetupRows[balanceSetupContract.id] ||= []);
      if (existing) Object.assign(existing, result.data); else rows.push(result.data);
      entry.card.dataset.savedBuckets = signature;
      entry.card.dataset.beforeTotal = String(Object.values(entry.row).reduce((sum,n)=>sum+n,0));
      entry.card.dataset.unsaved = '';
      entry.card.dataset.saveUnknown = '';
      entry.card.querySelector('.balance-saved-value').textContent = `Last confirmed balance: ${entry.card.dataset.beforeTotal} points`;
      entry.card.querySelector('.balance-card-status').textContent = 'Saved';
      const preview = entry.card.querySelector('.balance-correction-preview');
      if (preview) preview.textContent = `Saved: ${entry.card.dataset.beforeTotal} points left`;
    }
    success = true;
  } catch (e) {
    balanceSetupFailed = true;
    if (savingEntry) {
      savingEntry.card.dataset.saveUnknown = 'true';
      savingEntry.card.querySelector('.balance-card-status').textContent = 'Save not confirmed';
    }
    error.textContent = `${savingEntry?.year || 'Balance'}: couldn't confirm the save. ${e.message || 'Connection interrupted.'} Your entries are kept. Retry save, or discard local edits and reload saved balances.${balanceSetupSaved.size ? ' Years marked Saved are already stored.' : ''}`;
    error.hidden=false;
    error.scrollIntoView({block:'nearest'});
  } finally {
    balanceSetupBusy = false;
    document.querySelectorAll('#balance-setup-modal button, #balance-setup-modal input').forEach(el=>el.disabled=false);
    refreshBalanceSaveActions();
  }
  if (success) await closeBalanceSetup();
}
document.addEventListener('keydown', e => {
  const modal=document.getElementById('balance-setup-modal');
  if (!modal?.classList.contains('open')) return;
  if(e.key==='Escape'){e.preventDefault();closeBalanceSetup();}
  if(e.key==='Tab'){
    const items=[...modal.querySelectorAll('button,input,summary')].filter(el=>!el.disabled && el.getClientRects().length);
    if(!items.length)return;
    if(e.shiftKey&&document.activeElement===items[0]){e.preventDefault();items.at(-1).focus();}
    else if(!e.shiftKey&&document.activeElement===items.at(-1)){e.preventDefault();items[0].focus();}
  }
});

function validateContractStep(step) {
  let message = '', field = null;
  const points = document.getElementById('f-points');
  const price = document.getElementById('f-price');
  const year = document.getElementById('f-acquisition-year');
  if (step === 1 && !document.querySelector('.resort-chip.selected')) {
    message = 'Choose your home resort to continue.'; field = document.getElementById('resort-chip-search');
  } else if (step === 2 && !useYearChosen) {
    message = 'Choose the use year on your contract.'; field = document.querySelector('.use-year-chip');
  } else if (step === 2 && (!Number.isSafeInteger(Number(points.value)) || Number(points.value) <= 0)) {
    message = 'Enter a positive whole number of points per year.'; field = points;
  } else if (step === 3 && price.value && (!Number.isFinite(Number(price.value)) || Number(price.value) < 0)) {
    message = 'Enter a purchase price of zero or more, or leave it blank.'; field = price;
  } else if (step === 3 && year.value && (!Number.isInteger(Number(year.value)) || Number(year.value) < 1991 || Number(year.value) > new Date().getFullYear())) {
    message = 'Enter an acquisition year from 1991 to this year, or leave it blank.'; field = year;
  }
  if (!message) return true;
  showStudioStep(step);
  const error = document.getElementById('form-error');
  error.textContent = message; error.style.display = 'block';
  field?.focus();
  return false;
}

function closeForm() {
  if (contractSaving) return;
  editingId = null;
  document.getElementById("contract-modal").classList.remove("open");
}

let contractSaving = false;
async function saveForm() {
  if (contractSaving) return;
  const errorEl = document.getElementById("form-error");
  errorEl.style.display = "none";

  if (!validateContractStep(1) || !validateContractStep(2) || !validateContractStep(3)) return;
  const points = Number(document.getElementById("f-points").value);

  const payload = {
    nickname: document.getElementById("f-nickname").value.trim() || null,
    home_resort_id: document.getElementById("f-resort").value,
    use_year: getSelectedUseYear(),
    points_per_year: points,
    purchase_type: getSelectedPurchaseType(),
    purchase_price: document.getElementById("f-price").value ? parseFloat(document.getElementById("f-price").value) : null,
    purchase_date: acquisitionYearToPurchaseDate(document.getElementById("f-acquisition-year")),
    blue_card_override: getSelectedBlueCardOverride(),
  };

  contractSaving = true;
  const controls = [...document.querySelectorAll('#contract-modal button, #contract-modal input')];
  controls.forEach(el => el.disabled = true);
  const saveButton = document.getElementById('save-contract');
  const saveLabel = saveButton.textContent;
  saveButton.textContent = 'Saving...';
  let result;
  try {
    result = editingId
      ? await window.DVCAuth.updateContract(editingId, payload)
      : await window.DVCAuth.addContract(payload);
  } catch (error) {
    result = { error: error.message || 'Connection error. Try again.' };
  } finally {
    contractSaving = false;
    controls.forEach(el => el.disabled = false);
    saveButton.textContent = saveLabel;
  }

  if (result.error) {
    errorEl.textContent = "Couldn't save: " + result.error;
    errorEl.style.display = "block";
    return;
  }

  // A brand-new contract's card gets a one-time shimmer on its first
  // render in the deck (see renderContractList()) -- editing an existing
  // one never should, since it isn't newly issued.
  const added = !editingId;
  if (added) { justIssuedContractId = result.data.id; activeWalletCardId = result.data.id; activeLedgerYearTab = null; }
  closeForm();
  await renderSignedIn();
  if (added) openBalanceSetup(result.data.id);
}

// Upgrade -> create-checkout-session, Manage -> create-portal-session --
// both just redirect the whole page to the URL Stripe returns; there's no
// in-page payment form to build (see docs/subscriptions_plan.md Phase 4).
async function handleMembershipAction() {
  const btn = document.getElementById("membership-action-btn");
  const msgEl = document.getElementById("membership-action-msg");
  const action = btn.dataset.action;
  btn.disabled = true;
  btn.textContent = "Redirecting…";
  msgEl.style.display = "none";

  const result = action === "manage"
    ? await window.DVCAuth.manageMembership()
    : await window.DVCAuth.subscribeToMembership();

  if (result.error || !result.url) {
    btn.disabled = false;
    btn.textContent = action === "manage" ? "Manage Membership" : "Upgrade -- $49.99/yr";
    msgEl.textContent = result.error || "Something went wrong -- try again.";
    msgEl.style.display = "block";
    return;
  }
  window.location.href = result.url;
}

// The stripe-webhook function may land its subscriptions row update a
// second or two after Stripe redirects the browser back here, so a single
// getSubscription() right on load can race it and still show "Free."
// Polls a handful of times before giving up -- re-rendering the whole
// page (renderSignedIn) each time is simplest and already idempotent.
// Runs on both the member and gated views: a fresh checkout lands on the
// gated view until the webhook writes the subscription row.
function handleCheckoutReturn() {
  const checkoutBanner = document.getElementById("checkout-return-banner");
  if (!checkoutBanner) return;
  // Strip the param so a refresh/re-share of this URL doesn't re-show
  // the banner or re-trigger the poll below.
  window.history.replaceState({}, "", window.location.pathname);
  if (checkoutBanner.classList.contains("success")) startCheckoutSuccessPoll();
}

function startCheckoutSuccessPoll(attempt = 0) {
  const MAX_ATTEMPTS = 6;
  setTimeout(async () => {
    const sub = await window.DVCAuth.getSubscription();
    if (sub && sub.status !== "incomplete") {
      renderSignedIn();
      return;
    }
    if (attempt < MAX_ATTEMPTS) startCheckoutSuccessPoll(attempt + 1);
  }, 1500);
}

function openNotifSettings() {
  document.getElementById("notif-settings-status").textContent = "";
  const browserStatus = document.getElementById('push-browser-status');
  browserStatus.hidden = !(window.Notification?.permission === 'denied');
  browserStatus.textContent = 'Your browser also blocks notifications for this site. When push becomes available, you can change that in your browser\'s site settings.';
  document.getElementById("notif-settings-modal").classList.add("open");
}

function closeNotifSettings() {
  if (notificationSettingsSaving) return;
  document.getElementById("notif-settings-modal").classList.remove("open");
}

// Push delivery is unavailable in this build. A browser permission or old
// profile flag is not delivery readiness. Re-enable enrollment only with
// an operational sender and verified browser subscription lifecycle.
let notificationSettingsSaving = false;

async function saveNotificationSettings() {
  if (notificationSettingsSaving) return;
  const statusEl = document.getElementById("notif-settings-status");
  const saveBtn = document.getElementById("notif-settings-save");
  const leadDays = Number(document.getElementById('n-lead-days').value);
  if (!Number.isInteger(leadDays) || leadDays < 1 || leadDays > 240) {
    statusEl.textContent = 'Choose an email lead time from 1 to 240 days.';
    statusEl.classList.add('error');
    return;
  }
  notificationSettingsSaving = true;
  statusEl.textContent = "Saving…";
  statusEl.classList.remove("error");
  saveBtn.disabled = true;

  const patch = {
    reminder_opt_in: document.getElementById("n-email-enabled").checked,
    reminder_lead_days: leadDays,
    in_app_notifications_enabled: document.getElementById("n-inapp-enabled").checked,
  };
  const controls = [...document.querySelectorAll('#notif-settings-modal input, #notif-settings-modal button')];
  controls.forEach(control => control.disabled = true);

  // Clear the legacy pending/enabled state only on an explicit settings save.
  patch.push_enabled = false;
  patch.push_subscription = null;
  try {
    const { error } = await window.DVCAuth.updateProfile(patch);
    if (error) throw new Error(error);
    currentProfile = { ...currentProfile, ...patch };
    notificationSettingsSaving = false;
    closeNotifSettings();
    await renderSignedIn();
  } catch (_) {
    statusEl.textContent = "Couldn't save. Your choices are still here; tap Save to retry.";
    statusEl.classList.add("error");
  } finally {
    notificationSettingsSaving = false;
    saveBtn.disabled = false;
    controls.forEach(control => control.disabled = false);
  }
}

async function handleDeleteAccount() {
  if (!confirm("Permanently delete your account? This removes every contract, all trip history, and every saved itinerary. This can't be undone.")) return;
  if (prompt('Type DELETE to confirm:') !== "DELETE") return;

  const btn = document.getElementById("delete-account");
  btn.textContent = "Deleting...";
  btn.disabled = true;
  const { error } = await window.DVCAuth.deleteAccount();
  if (error) {
    alert(`Couldn't delete account: ${error}`);
    btn.textContent = "Delete My Account";
    btn.disabled = false;
    return;
  }
  window.location.href = "index.html";
}

function render(session) {
  if (!window.DVCAuth.isConfigured()) {
    renderUnconfigured();
  } else if (session) {
    renderSignedIn();
  } else {
    renderGate();
  }
}

// auth.js's module script executes asynchronously; poll briefly for
// window.DVCAuth to exist rather than assuming it's ready by the time this
// inline script runs (same reasoning as auth.js's own header-control code).
function waitForAuth(attempts) {
  if (window.DVCAuth) {
    window.DVCAuth.onAuthChange(render);
  } else if (attempts > 0) {
    setTimeout(() => waitForAuth(attempts - 1), 50);
  } else {
    renderUnconfigured();
  }
}
waitForAuth(40);

// Registered once at script load, not inside renderSignedIn() -- unlike
// the modal's own click-outside listener (rebound every render, since the
// element itself is recreated), `document` persists for the page's whole
// lifetime, so a listener added here every render would stack duplicates.
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && document.getElementById("contract-modal")?.classList.contains("open")) closeForm();
  if (e.key === "Escape" && document.getElementById("notif-settings-modal")?.classList.contains("open")) closeNotifSettings();
});

// The perk dot's tooltip is otherwise hover/focus-only (tokens.css's
// .tooltip-anchor rules), which has no equivalent on a touchscreen -- a
// phone has no cursor to hover with, and there's nothing else on the card
// to receive focus and reveal it via :focus-within. This adds an explicit
// tap-to-toggle on top of that (not a replacement -- hover still works for
// mouse users), closing any other open dot first so only one shows at a
// time, and closing on a tap anywhere else on the page. Deliberately a
// plain class toggle rather than tabindex/:focus (see the "fixes
// click-stuck hovers" fix elsewhere in this app's history) -- that
// approach left a tapped tooltip stuck open on mobile with no clear way to
// dismiss it; toggling explicitly here means a second tap (on the dot or
// anywhere else) always closes it.
document.addEventListener("click", (e) => {
  const dot = e.target.closest(".wallet-card-perk-dot");
  document.querySelectorAll(".wallet-card-perk-dot.tooltip-open").forEach((d) => {
    if (d !== dot) d.classList.remove("tooltip-open");
  });
  if (dot) dot.classList.toggle("tooltip-open");
});
  </script>
</body>
</html>
