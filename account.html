<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My DVC Contracts</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="images/icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="images/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#4a148c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DVC Companion">
  <link rel="stylesheet" href="tokens.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #f5f5f5;
  color: #333;
  min-height: 100vh;
}

.header {
  background: linear-gradient(135deg, var(--color-secondary), var(--color-primary));
  color: white;
  padding: 16px 24px;
  text-align: center;
}

.header h1 { font-size: 1.3rem; font-weight: 600; margin-bottom: 2px; }
.header .subtitle { font-size: 0.8rem; opacity: 0.8; }

/* ---- Site nav ---- */
.site-nav { background: white; border-bottom: 1px solid #e0e0e0; padding: 10px 24px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; position: sticky; top: 0; z-index: 100; }
.site-nav-brand { font-weight: 700; font-size: 1rem; color: var(--color-primary); text-decoration: none; letter-spacing: 0.2px; flex-shrink: 0; }
.site-nav-links { display: flex; align-items: center; gap: 16px; flex: 1; flex-wrap: wrap; }
.site-nav-group { display: flex; align-items: center; gap: 12px; }
.site-nav-group-label { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.5px; color: #aaa; font-weight: 700; }
.site-nav-divider { width: 1px; height: 16px; background: #e0e0e0; }
.site-nav-links a { font-size: 0.82rem; color: #555; text-decoration: none; font-weight: 500; padding: 2px 0; border-bottom: 2px solid transparent; }
.site-nav-links a:hover { color: var(--color-primary); }
.site-nav-links a.active { color: var(--color-primary); border-bottom-color: var(--color-primary); font-weight: 600; }

.site-nav-toggle { display: none; flex-direction: column; justify-content: center; gap: 4px; width: 32px; height: 32px; padding: 6px; margin-left: auto; border: none; background: none; cursor: pointer; }
.site-nav-toggle span { display: block; width: 100%; height: 2px; border-radius: 1px; background: var(--color-primary); }

.account-btn, .account-link-btn {
  font: inherit;
  font-size: 0.78rem;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid #ddd;
  background: #f7f5fa;
  color: var(--color-primary);
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
  white-space: nowrap;
}
.account-btn:hover, .account-link-btn:hover { background: var(--color-primary-tint-bg); border-color: var(--color-primary); }

@media (max-width: 800px) {
  .site-nav-toggle { display: flex; }
  .site-nav-links { display: none; flex: 0 0 100%; width: 100%; flex-direction: column; align-items: flex-start; gap: 14px; margin-top: 4px; padding-top: 10px; border-top: 1px solid #eee; }
  .site-nav-group { flex-direction: column; align-items: flex-start; gap: 6px; }
  #account-control { display: none; width: 100%; margin-top: 10px; }
  .site-nav.open .site-nav-links { display: flex; }
  .site-nav.open #account-control { display: block; }
  .header { padding: 10px 20px; }
  .header h1 { font-size: 1.05rem; }
  .header .subtitle { font-size: 0.7rem; }
}

.page {
  max-width: 720px;
  margin: 24px auto;
  padding: 0 16px 60px;
}

.gate {
  background: white;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  padding: 48px 32px;
  text-align: center;
  color: #666;
}

.gate p { margin-bottom: 18px; font-size: 0.95rem; }

.big-signin-btn {
  background: var(--color-primary);
  color: white;
  border: none;
  border-radius: 8px;
  padding: 12px 24px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
}
.big-signin-btn:hover { background: var(--color-primary-active); }

.section {
  background: white;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  padding: 20px 24px;
  margin-bottom: 20px;
}

.section h2 {
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--color-secondary);
  margin-bottom: 14px;
}

.section-sub {
  font-size: 0.8rem;
  color: #888;
  margin-top: -8px;
  margin-bottom: 16px;
}

/* First-time concierge hero, shown instead of the contract deck when the
   user has no contracts yet -- a soft glass-like dashed card rather than a
   plain "no contracts" line, since this is the very first thing a brand
   new signed-in user sees on this page. */
.empty-vault-hero {
  text-align: center;
  padding: 40px 24px;
  margin-bottom: 16px;
  border: 2px dashed var(--color-primary);
  border-radius: var(--radius-md);
  background: linear-gradient(135deg, rgba(74,20,140,0.07), rgba(26,35,126,0.07));
  backdrop-filter: blur(2px);
}

.empty-vault-hero-title {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--color-secondary);
  margin-bottom: 8px;
}

.empty-vault-hero-sub {
  font-size: 0.88rem;
  color: #666;
  line-height: 1.5;
  max-width: 420px;
  margin: 0 auto 20px;
}

.contract-list {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 16px;
}

/* Deck mode swaps the flat side-by-side row for a vertical overlapping
   stack -- see the .wallet-deck .wallet-card rules below for the overlap
   itself. */
.contract-list.wallet-deck {
  display: block;
}

/* ---- Wallet card ----
   A pure card FACE now -- fixed, realistic card proportions, no ledger
   content inside it at all. The ledger (steppers, bars, +Plan a year,
   Edit/Delete) lives in #active-contract-details below the deck instead,
   so the card stays a small, sleek object instead of growing to fit
   however many use-year rows a contract happens to have. */
.wallet-card {
  max-width: 380px;
  width: 100%;
  height: 215px;
  border-radius: 16px;
  padding: 20px 24px;
  color: white;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  /* Inset gold line first (foil edge), elevation shadow after. */
  box-shadow: inset 0 0 0 1.5px rgba(212,175,55,0.4), 0 12px 28px rgba(0,0,0,0.25);
  position: relative;
  /* Only matters when walletCardGradient() below layers a resort photo
     under its gradient (data/resort_images.js) -- harmless no-op on a
     plain gradient background otherwise. */
  background-size: cover;
  background-position: center;
}

/* Decorative-only clipping layer -- NOT overflow:hidden on .wallet-card
   itself, since the "Bank by" deadline pill's hover tooltip is an
   absolutely-positioned descendant sitting right at the card's bottom
   edge; clipping the whole card would clip the tooltip too (it did,
   before this was split out -- the tooltip fired but rendered invisible,
   cropped away). This inner layer clips only the sheen/watermark below,
   while real content (z-index:1 on .wallet-card-top/-points/-bottom) and
   its tooltip stay free to overflow past the card's own box. */
.wallet-card-decor {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

/* A faint diagonal sheen, like light catching a physical card -- purely
   decorative, sits above the gradient but below all real content. */
.wallet-card-decor::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.16), transparent 55%);
}

/* An engraved sunburst/compass-rose watermark, tucked in a back corner --
   decorative only, low-opacity enough to read as a pressed motif rather
   than compete with the real content sitting above it (z-index below). */
.wallet-card-decor::after {
  content: "";
  position: absolute;
  right: -20px;
  bottom: -20px;
  width: 130px;
  height: 130px;
  background-image: url('data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Cg stroke=%27white%27 stroke-width=%271%27%3E%3Cline x1=%2750%27 y1=%2750%27 x2=%2750%27 y2=%275%27/%3E%3Cline x1=%2750%27 y1=%2750%27 x2=%2773%27 y2=%2712%27/%3E%3Cline x1=%2750%27 y1=%2750%27 x2=%2790%27 y2=%2730%27/%3E%3Cline x1=%2750%27 y1=%2750%27 x2=%2795%27 y2=%2750%27/%3E%3Cline x1=%2750%27 y1=%2750%27 x2=%2790%27 y2=%2770%27/%3E%3Cline x1=%2750%27 y1=%2750%27 x2=%2773%27 y2=%2788%27/%3E%3Cline x1=%2750%27 y1=%2750%27 x2=%2750%27 y2=%2795%27/%3E%3Cline x1=%2750%27 y1=%2750%27 x2=%2727%27 y2=%2788%27/%3E%3Cline x1=%2750%27 y1=%2750%27 x2=%2710%27 y2=%2770%27/%3E%3Cline x1=%2750%27 y1=%2750%27 x2=%275%27 y2=%2750%27/%3E%3Cline x1=%2750%27 y1=%2750%27 x2=%2710%27 y2=%2730%27/%3E%3Cline x1=%2750%27 y1=%2750%27 x2=%2727%27 y2=%2712%27/%3E%3C/g%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%273%27 fill=%27white%27/%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2745%27 fill=%27none%27 stroke=%27white%27 stroke-width=%270.5%27/%3E%3C/svg%3E');
  background-size: contain;
  background-repeat: no-repeat;
  opacity: 0.12;
  pointer-events: none;
}

/* filter, not opacity -- opacity makes the card semi-transparent, which
   in a stacked deck lets whichever card sits BEHIND it visually bleed
   through the overlap zone (an actual rendering glitch: "250 POINTS/YR"
   from the card underneath showing straight through a deactivated card's
   face). grayscale+brightness dims/desaturates without introducing any
   transparency, and reads as a much more obvious "this one's off" signal
   than a subtle 45%-opacity fade did -- reported directly as "the only
   difference was the word itself" against the old treatment. */
.wallet-card.inactive { filter: grayscale(0.85) brightness(0.82); }

.wallet-card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  position: relative;
  z-index: 1;
}

/* A soft radial glow sitting behind the resort name, like illuminated
   signage -- a negative-z-index layer on the name's own wrapper rather
   than a shared ancestor, so it doesn't bleed into the badge column. */
.wallet-card-top-left { position: relative; }
.wallet-card-top-left::before {
  content: "";
  position: absolute;
  top: -8px;
  left: -12px;
  right: -12px;
  height: 48px;
  background: radial-gradient(ellipse at 30% 50%, rgba(255,255,255,0.22), transparent 70%);
  pointer-events: none;
  z-index: -1;
}

.wallet-card-name {
  font-family: "Playfair Display", Georgia, serif;
  font-weight: 700;
  font-size: 1.15rem;
  line-height: 1.25;
  letter-spacing: -0.02em;
  position: relative;
}
.wallet-card-nickname { font-size: 0.76rem; opacity: 0.82; margin-top: 2px; position: relative; }

.wallet-card-top-right { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex-shrink: 0; }

/* Compact points/UY readout, kept in the top peek band so it's visible
   even while this card is collapsed under others in the deck -- the big
   .wallet-card-points-num below is only visible once the card is active
   or unstacked. */
.wallet-card-peek-stats { display: flex; gap: 5px; }
.wallet-card-peek-pill {
  background: rgba(255,255,255,0.16);
  border-radius: 999px;
  padding: 2px 8px;
  font-size: 0.66rem;
  font-weight: 700;
  white-space: nowrap;
}

.wallet-card-points {
  position: relative;
  z-index: 1;
}
.wallet-card-points-num { font-size: 1.85rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
.wallet-card-points-label {
  font-size: 0.58rem;
  font-weight: 700;
  letter-spacing: 1.2px;
  opacity: 0.75;
  margin-top: 2px;
}

.wallet-card-bottom {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 8px;
  position: relative;
  z-index: 1;
}

.wallet-card-bottom-left { display: flex; gap: 6px; flex-wrap: wrap; }

.wallet-card-pill {
  background: rgba(255,255,255,0.12);
  border-radius: 999px;
  padding: 3px 10px;
  font-weight: 600;
  font-size: 0.68rem;
  position: relative;
}

/* Small icon dot for a notable perk/restriction (Blue Card, resale limits)
   -- deliberately tiny and wordless on the card face itself (full label is
   in the tooltip) so it reads as a subtle marker, not a shouty callout.
   Amber for a caution (same amber-on-cream treatment contractvalue.html's
   .restricted-badge uses for the identical concept), cool blue for a perk
   worth celebrating rather than flagging. */
.wallet-card-perk-dot {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  font-size: 0.62rem;
  font-weight: 700;
  cursor: help;
}
.wallet-card-perk-dot.restricted { background: #f6e5db; color: #a3401f; }
.wallet-card-perk-dot.blue-card { background: var(--color-info-bg); color: var(--color-info); }

/* Explicit tap-to-toggle state (see the document click handler) alongside
   tokens.css's own hover/focus-within rules for this .tooltip-anchor --
   additive, not a replacement, so a mouse user's hover still works too. */
.wallet-card-perk-dot.tooltip-open .tooltip-card {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

/* A standout glass chip, not another muted pill -- the deadline is the one
   piece of information on the face worth drawing the eye to. */
.wallet-card-deadline-pill {
  background: rgba(255,255,255,0.22);
  border: 1px solid rgba(255,255,255,0.35);
  border-radius: 999px;
  padding: 3px 10px;
  font-size: 0.72rem;
  font-weight: 700;
  color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,0.2);
  white-space: nowrap;
}

/* ---- Active contract details ----
   Standalone panel below the deck -- same white-card treatment as the
   calendar's summary-side cards, since this now carries all the ledger
   controls the card face used to (see renderActiveContractDetails()). */
/* border-top color is set inline per render (walletCardPrimaryColor()), so
   the panel reads as a continuation of whichever card is active rather
   than a generic detached box. */
#active-contract-details {
  background: white;
  border-radius: var(--radius-md);
  border-top: 4px solid var(--color-primary);
  padding: 20px;
  box-shadow: var(--shadow-card);
  margin-top: 20px;
}

.wallet-details-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 4px;
}

.wallet-details-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.wallet-details-name { font-weight: 700; color: #222; font-size: 1.1rem; }
.wallet-details-nickname-badge {
  font-size: 0.7rem;
  font-weight: 600;
  color: #666;
  background: #f0f0f0;
  border-radius: 999px;
  padding: 2px 9px;
}

/* Membership Extras / resale-restriction status, shown next to the
   nickname badge -- same pill shape, colored per evaluateContractPerks()'s
   badgeVariant (auth.js) rather than another hardcoded gray. */
.perk-badge {
  font-size: 0.7rem;
  font-weight: 700;
  border-radius: 999px;
  padding: 2px 9px;
  cursor: help;
}
.perk-badge-info { color: var(--color-info); background: var(--color-info-bg); }
.perk-badge-warning { color: #a3401f; background: #f6e5db; }

.wallet-details-actions { display: flex; gap: 8px; }
/* Ghost buttons -- no border/background of their own -- so Edit/
   Deactivate/Delete read as quiet secondary actions instead of a toolbar
   competing with the tabs and balance fields for attention. */
.wallet-details-actions button {
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 600;
  padding: 4px 12px;
  border: none;
  background: none;
  color: #999;
  cursor: pointer;
}
.wallet-details-actions button:hover { background: #f0f0f0; color: var(--color-primary); }
.wallet-details-actions button.danger:hover { background: var(--color-danger-bg); color: var(--color-danger); }

/* ---- Wallet deck (2+ contracts) ----
   Cards overlap via negative top margin so only the top ~70px (name,
   nickname, membership mark, and the compact points/UY readout) of each
   background card peeks out -- later cards paint over the
   top of earlier ones in normal DOM/paint order, so no manual z-index
   bookkeeping is needed for the collapsed state. Only .active-card gets an
   explicit z-index, to guarantee it lifts above neighbors on either side.
   A single contract never gets the .wallet-deck class at all (see
   renderContractList()), so it always renders flat/full, unstacked. */
.wallet-deck .wallet-card {
  margin-left: auto;
  margin-right: auto;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.wallet-deck .wallet-card:not(:first-child) {
  margin-top: -145px;
}

.wallet-deck .wallet-card:not(.active-card):hover {
  transform: translateY(-10px);
}

/* Activating a card never touches margin-top -- changing a margin forces
   a layout reflow that cascades through every following sibling, visible
   as the whole stack "resettling" underneath. transform + box-shadow are
   compositor-only, so the active card can lift and glow without the deck
   flow shifting at all; z-index alone is what guarantees it paints above
   whichever neighbor is overlapping it. */
.wallet-deck .wallet-card.active-card {
  transform: translateY(-16px);
  z-index: 10;
  box-shadow: 0 16px 36px rgba(0,0,0,0.35), 0 0 0 2px rgba(255,255,255,0.4);
  cursor: default;
}

/* ---- Wallet-card points ledger ----
   One row per use-year cycle. use_year_label is the year a cycle's points
   DEPOSIT in (see currentUYYear()'s comment) -- often not the calendar year
   someone would guess at a glance, hence spelling the year out per row
   instead of a static "Banked/Remaining/Borrowed" label. Replaces the old
   plain <table> with a segmented bar (proportional Banked/Current/Borrowed)
   plus inline +/- steppers, so adjusting a balance feels like using the
   rest of the app instead of filling out a spreadsheet. */
.ledger-rows {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 10px;
}

/* One tab per use-year row -- only the selected tab's row renders below,
   instead of stacking every year's numbers at once. */
.ledger-year-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
  margin-bottom: 4px;
}

.ledger-year-tab {
  border: 1px solid #ddd;
  background: white;
  color: #666;
  font-size: 0.78rem;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: var(--radius-pill);
  cursor: pointer;
}
.ledger-year-tab:hover { border-color: var(--color-primary); color: var(--color-primary); }
.ledger-row [data-setup-balance] { margin-top: 10px; }
.ledger-year-range { display: block; font-size: 0.66rem; font-weight: 500; opacity: 0.8; }
.ledger-year-tab.selected { background: var(--color-primary); border-color: var(--color-primary); color: white; }
.ledger-year-tab.add-year { border-style: dashed; color: #999; }
.ledger-year-tab.add-year:hover { border-color: var(--color-primary); color: var(--color-primary); }

.ledger-row {
  background: #fafafa;
  border: 1px solid #eaeaea;
  border-radius: 10px;
  padding: 14px 16px;
}

/* Always the highlighted treatment now -- white (not tinted gray) since
   it's the only row shown, with a colored border and a soft lifted shadow. */
.ledger-row.ledger-current {
  background: #ffffff;
  border-color: var(--color-primary);
  box-shadow: 0 2px 8px rgba(74,20,140,0.08);
}

.ledger-primary-stat {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}
.ledger-primary-num { font-size: 1.7rem; font-weight: 800; color: var(--color-secondary); line-height: 1; }
.ledger-primary-label { font-size: 0.78rem; color: #666; margin-top: 3px; }

.ledger-deadline-warning {
  font-size: 0.78rem;
  color: var(--color-warning);
  font-weight: 600;
  margin-top: 8px;
}
.ledger-deadline-warning.calm { color: var(--color-good); }
.ledger-deadline-warning.warning { color: var(--color-warning); }
.ledger-deadline-warning.danger { color: var(--color-danger); font-weight: 700; }
.ledger-deadline-warning.muted { color: #999; font-weight: 500; }
.load-error-card { padding: 20px; border: 1px solid var(--color-border); border-radius: 16px; background: var(--color-bg-card); }
.load-error-card p { font-size: .85rem; color: var(--color-text-muted); margin: 6px 0 14px; }
.leftover-stays { margin-top: 10px; }
.leftover-stays-title { font-size: 0.78rem; font-weight: 600; color: var(--color-text-muted); margin-bottom: 6px; }
.leftover-stays-list { display: grid; gap: 8px; }
.leftover-stay { display: block; padding: 12px 14px; border: 1px solid var(--color-border); border-radius: 14px; background: var(--color-bg-card); color: var(--color-text); text-decoration: none; }
.leftover-stay-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.leftover-stay-name { font-weight: 600; min-width: 0; }
.leftover-stay-odds { flex-shrink: 0; font-size: 0.7rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--color-primary-tint-bg); color: var(--color-primary); }
.leftover-stay-odds.excellent { background: var(--color-good-bg); color: var(--color-good); }
.leftover-stay-detail { display: block; font-size: 0.76rem; margin-top: 4px; color: var(--color-text-muted); }
.leftover-stays-note { font-size: 0.72rem; color: var(--color-text-muted); margin-top: 6px; }

.ledger-row .ledger-bar { margin-top: 12px; }

/* Root cause of the "looks like a form" complaint: .ledger-stepper had no
   explicit width, and .ledger-stepper-row's width:100% (below, on the
   input) resolved against the INPUT's own default browser intrinsic size
   (~170-190px) rather than any layout constraint -- fine on desktop where
   3 of those fit comfortably side by side, but on a phone they can't, so
   they wrap and each reads as one big gray box rather than a compact
   trio. Grid with 3 equal columns forces each stat into its own even
   share of the available width at any viewport, which is what actually
   fixes the sizing (not just a mobile media query tweak). */
.ledger-steppers {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
/* 4 equal columns get tight below ~360px (guardrail #9 still applies --
   this stays grid, not flex, just fewer columns) -- 2x2 keeps each stepper
   comfortably tappable instead of squeezing four into one row. */
@media (max-width: 420px) {
  .ledger-steppers { grid-template-columns: repeat(2, 1fr); }
}

.ledger-holding-date-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  font-size: 0.76rem;
  color: #666;
}
.ledger-holding-date-row.muted { opacity: 0.55; }
.ledger-holding-date-row input[type="date"] {
  font: inherit;
  font-size: 0.78rem;
  padding: 4px 6px;
  border: 1px solid #ccc;
  border-radius: 5px;
  color: inherit;
}

.ledger-remove-year {
  border: none;
  background: none;
  color: #bbb;
  font-size: 0.9rem;
  line-height: 1;
  cursor: pointer;
  padding: 2px 4px;
}
.ledger-remove-year:hover { color: var(--color-danger); }

/* Segmented bar + stepper CSS (.ledger-bar, .ledger-stepper*, .stepper-btn)
   moved to tokens.css -- the calendar's Smart Draw recommendation card
   reuses this exact visual language, and index.html doesn't see this
   page's local <style> block. */

.ledger-footer {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 4px;
}

.qe-status {
  font-size: 0.7rem;
  color: var(--color-good);
  transition: color 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
.qe-status.error { color: var(--color-danger); }

.small-btn {
  font-size: 0.78rem;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: 6px;
  border: 1px solid #ccc;
  background: white;
  color: #555;
  cursor: pointer;
}
.small-btn:hover { border-color: var(--color-primary); color: var(--color-primary); }
.small-btn.danger:hover { border-color: var(--color-danger); color: var(--color-danger); }

.add-btn {
  background: var(--color-primary);
  color: white;
  border: none;
  border-radius: 8px;
  padding: 9px 18px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
}
.add-btn:hover { background: var(--color-primary-active); }

/* Live preview inside the Add/Edit Contract modal -- the actual
   .wallet-card face (same markup as the real deck, via
   buildWalletCardFaceHTML()), just scaled down to fit the modal, so what
   the user sees while building a contract is exactly what lands in their
   vault, not a simplified stand-in. */
.wallet-card.modal-preview-card {
  max-width: 100%;
  height: 150px;
  padding: 16px 18px;
  margin-bottom: 14px;
  transition: background 0.3s ease;
}
.modal-preview-card .wallet-card-name { font-size: 1rem; }
.modal-preview-card .wallet-card-points-num { font-size: 1.5rem; }

/* ---- Card Studio (3-step Add/Edit Contract modal) ---- */
.studio-stepper {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
}
.studio-stepper-pill {
  flex: 1;
  border: none;
  border-radius: var(--radius-pill);
  background: #eee;
  color: #999;
  font-size: 0.7rem;
  font-weight: 700;
  padding: 7px 6px;
  text-align: center;
  cursor: default;
}
.studio-stepper-pill.active { background: var(--color-primary); color: white; }
/* Only clickable while editing an existing contract -- a brand-new
   contract walks the steps in order (see the resort-chip and Next/Back
   handlers), so free jumping is reserved for revisiting an already-saved
   one. */
.studio-stepper.jumpable .studio-stepper-pill { cursor: pointer; }
.studio-stepper.jumpable .studio-stepper-pill:hover:not(.active) { background: #ddd; color: #666; }

.studio-panel { display: flex; flex-direction: column; gap: 14px; margin-bottom: 16px; }

.studio-step-label {
  display: block;
  font-size: 0.7rem;
  text-transform: uppercase;
  font-weight: 600;
  color: #888;
  letter-spacing: 0.4px;
  margin-bottom: 6px;
}

.resort-chip-search {
  width: 100%;
  box-sizing: border-box;
  margin-bottom: 8px;
  padding: 9px 12px;
  border: 1px solid var(--color-border-light);
  border-radius: 10px;
  font: inherit;
  font-size: 0.85rem;
}
.resort-chip-empty { font-size: 0.8rem; color: var(--color-text-muted); }
.resort-chip[hidden] { display: none; }
.resort-chip-grid {
  display: grid;
  /* minmax(0, 1fr), not a bare 1fr -- grid tracks default to a content-based
     minimum size, so a long resort name ("The Villas at Disney's Grand
     Floridian Resort & Spa") would otherwise refuse to shrink and force
     the whole grid (and modal) wider than the viewport on a narrow phone. */
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  max-height: 280px;
  overflow-y: auto;
  padding-right: 4px;
}
.resort-chip {
  border: 2px solid transparent;
  border-radius: 10px;
  padding: 10px 12px;
  color: white;
  font-size: 0.78rem;
  font-weight: 700;
  text-align: left;
  cursor: pointer;
  opacity: 0.55;
  overflow-wrap: break-word;
  transition: opacity 0.15s ease, box-shadow 0.15s ease, transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.2s ease;
}
.resort-chip:hover { opacity: 0.8; transform: scale(1.02); }
/* A single crisp white ring + soft primary-color glow, not the old
   inset-white-plus-outset-purple double ring (looked like two stacked
   boxes in live mobile testing). The purple ring is INSET, not an outward
   box-shadow spread -- .resort-chip-grid's overflow-y:auto forces
   overflow-x to also compute as non-visible (a CSS Overflow Module
   interop rule, same one noted on index.html's .calendar-grid-scroll),
   so an outward-spreading ring on a chip flush against the grid's left/
   right edge got clipped there, looking cut off on both sides on mobile's
   single-column layout. Inset never needs room outside the chip's own
   box, so it can't be clipped regardless of container padding. */
.resort-chip.selected {
  opacity: 1;
  border-color: #ffffff;
  box-shadow: inset 0 0 0 3px var(--color-primary), 0 4px 12px rgba(0,0,0,0.15);
  transform: translateY(-2px);
}

/* Round Use Year buttons, studio-only -- the base .use-year-chip pill
   styling (also unused anywhere else) stays the fallback shape. */
.use-year-chips.round { display: flex; flex-wrap: wrap; gap: 8px; }
.use-year-chips.round .use-year-chip {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.studio-perks-note {
  font-size: 0.76rem;
  color: #888;
  font-style: italic;
  line-height: 1.4;
}

.field-hint {
  font-size: 0.74rem;
  color: #888;
  margin-top: 4px;
  min-height: 1em;
}

.studio-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.studio-nav-right { display: flex; gap: 10px; }
.ghost-btn {
  background: none;
  border: none;
  color: #666;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  padding: 9px 12px;
}
.ghost-btn:hover { color: var(--color-primary); }

/* Quick-preset point chips: same pill language as .use-year-chip, just a
   shortcut into the (still fully editable) Points per Year input below. */
.points-preset-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }

.points-preset-chip {
  padding: 4px 10px;
  border: 1px solid #ccc;
  border-radius: var(--radius-pill);
  background: white;
  font-size: 0.76rem;
  cursor: pointer;
  color: #555;
}
.points-preset-chip.selected { background: var(--color-primary); border-color: var(--color-primary); color: white; }
.points-preset-chip:hover { border-color: var(--color-primary); color: var(--color-primary); }

/* Points per Year's own input, styled as the step's centerpiece rather
   than a regular form field -- large and centered, since it's the one
   number every downstream calculation actually depends on. */
.points-input-large {
  font-size: 1.6rem;
  font-weight: 700;
  text-align: center;
  color: var(--color-secondary);
  padding: 12px 10px;
}

/* min-width: 0 stays a defensive default even outside the old grid layout
   -- flex items have the same "content forces a wider box than intended"
   failure mode a number input or the custom-select's min-width can trigger. */
.form-field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

.form-field label {
  font-size: 0.7rem;
  text-transform: uppercase;
  font-weight: 600;
  color: #888;
  letter-spacing: 0.4px;
}

.form-field input, .form-field select {
  padding: 8px 10px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 0.88rem;
  font-family: inherit;
}

.form-field input:focus, .form-field select:focus {
  outline: none;
  border-color: var(--color-primary);
  box-shadow: 0 0 0 2px rgba(74,20,140,0.15);
}

.purchase-type-toggle { display: flex; gap: 8px; }

.purchase-type-toggle button {
  flex: 1;
  padding: 8px;
  border: 1px solid #ccc;
  border-radius: 6px;
  background: white;
  font-size: 0.85rem;
  cursor: pointer;
  color: #555;
}
.purchase-type-toggle button.selected {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: white;
}

/* Use Year chips: same segmented-toggle visual language as
   .purchase-type-toggle above, generalized from 2 buttons to 8 -- wraps on
   narrow screens instead of squeezing into one row. */
.use-year-chips { display: flex; flex-wrap: wrap; gap: 6px; }

.use-year-chip {
  padding: 6px 12px;
  border: 1px solid #ccc;
  border-radius: var(--radius-pill);
  background: white;
  font-size: 0.82rem;
  cursor: pointer;
  color: #555;
}
.use-year-chip:hover { border-color: var(--color-primary); color: var(--color-primary); }
.use-year-chip.selected { background: var(--color-primary); border-color: var(--color-primary); color: white; }

.use-year-deadline { font-size: 0.76rem; color: var(--color-text-muted); margin-top: 6px; }

.form-actions { display: flex; gap: 10px; }

.save-btn {
  background: var(--color-primary);
  color: white;
  border: none;
  border-radius: 6px;
  padding: 9px 20px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
}
.save-btn:hover { background: var(--color-primary-active); }

.cancel-btn {
  background: white;
  color: #666;
  border: 1px solid #ccc;
  border-radius: 6px;
  padding: 9px 20px;
  font-size: 0.85rem;
  cursor: pointer;
}

.form-error {
  color: var(--color-danger);
  font-size: 0.82rem;
  margin-bottom: 10px;
}

/* The single most urgent fact on the page, across every active contract --
   sits above everything else, since it's the answer to "do I need to act on
   something right now," not a setting. */
.deadline-countdown {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
}
.deadline-countdown-icon { font-size: 1.4rem; flex-shrink: 0; }
.deadline-countdown-label {
  font-size: 0.66rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 700;
  opacity: 0.75;
}
.deadline-countdown-detail { font-size: 0.86rem; margin-top: 2px; }

.deadline-countdown.calm { background: var(--color-primary-tint-bg); color: var(--color-primary); }
.deadline-countdown.warning { background: #fff3e0; color: #a3401f; }
.deadline-countdown.danger { background: var(--color-danger-bg); color: var(--color-danger); }
.deadline-countdown.danger .deadline-countdown-detail strong { color: inherit; }

/* ---- "Your Contracts" title row: the bell/gear icon that opens
   Notification Settings sits in its corner rather than its own row above
   the page -- a standalone row left dead space between the deadline
   banner and the contracts card since it had nothing else to share the
   row with. Replaces the old always-visible checkbox row, which read as a
   leftover web form rather than something native-app-like. */
.section-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 14px;
}
.section-title-row h2 { margin-bottom: 0; }
.notif-settings-btn {
  flex-shrink: 0;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid var(--color-border-light);
  background: white;
  font-size: 0.95rem;
  cursor: pointer;
}
.notif-settings-btn:hover { border-color: var(--color-primary); }

/* ---- Membership card: lives above "Your Contracts" as its own small
   section, same grouping idea as the notif-settings gear -- an
   account-level setting, not a contract. See docs/subscriptions_plan.md
   Phase 4. */
.membership-card {
  background: white;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  padding: 16px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
.membership-card-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.5px; color: #999; font-weight: 700; margin-bottom: 2px; }
.membership-card-status { font-size: 0.95rem; font-weight: 700; color: #333; }
.membership-card-status.is-active { color: var(--color-primary); }
.membership-card-status.is-warning { color: #a3401f; }
.membership-card-detail { font-size: 0.8rem; color: #777; margin-top: 2px; }
/* Task 10 pricing-anchor line -- a touch bolder/colored than the plain
   detail line above it, since this one's carrying the actual persuasion
   (price framing), not just a feature description. */
.membership-card-anchor { font-size: 0.78rem; color: var(--color-primary); font-weight: 600; margin-top: 4px; }
.membership-card-btn {
  flex-shrink: 0;
  background: var(--color-primary);
  color: white;
  border: none;
  border-radius: 20px;
  padding: 9px 18px;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
.membership-card-btn:hover { background: var(--color-primary-active); }
.membership-card-btn:disabled { opacity: 0.6; cursor: default; }
.membership-card-btn.secondary { background: #f7f5fa; color: var(--color-primary); border: 1px solid #ddd; }
.membership-card-btn.secondary:hover { background: var(--color-primary-tint-bg); }
.membership-card-msg { flex-basis: 100%; font-size: 0.78rem; color: var(--color-danger); }
.membership-checkout-banner {
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 0.85rem;
  margin-bottom: 14px;
}
.membership-checkout-banner.success { background: var(--color-primary-tint-bg); color: var(--color-primary); }
.membership-checkout-banner.cancelled { background: #f0f0f0; color: #666; }

/* ---- Notification Center: a short dismissible list of other active
   contracts' notable statuses, below whichever one is already the lead
   .deadline-countdown banner above. ---- */
.reminder-offer {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 12px;
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--color-primary-tint-bg);
  border: 1px solid var(--color-border-light);
}
.reminder-offer-icon { font-size: 1.3rem; }
.reminder-offer-text { flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 2px; font-size: 0.8rem; color: var(--color-text-muted); }
.reminder-offer-text strong { font-size: 0.88rem; color: var(--color-text); }
.reminder-offer-actions { display: flex; gap: 8px; align-items: center; }
.reminder-offer-actions .save-btn { width: auto; margin: 0; padding: 8px 16px; }
.reminder-offer-dismiss { border: 0; background: none; color: var(--color-text-muted); font: inherit; font-size: 0.8rem; cursor: pointer; }
.notification-center {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 10px;
}
.notification-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 0.8rem;
}
.notification-item.calm { background: var(--color-primary-tint-bg); color: var(--color-primary); }
.notification-item.warning { background: #fff3e0; color: #a3401f; }
.notification-item.danger { background: var(--color-danger-bg); color: var(--color-danger); }
.notification-item-icon { flex-shrink: 0; }
.notification-item-text { flex: 1; min-width: 0; }
.notification-item-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.notification-item-cal {
  font-size: 0.72rem;
  font-weight: 700;
  color: inherit;
  text-decoration: underline;
  white-space: nowrap;
}
.notification-item-dismiss {
  background: none;
  border: none;
  color: inherit;
  opacity: 0.6;
  font-size: 1.1rem;
  line-height: 1;
  cursor: pointer;
  padding: 0 2px;
}
.notification-item-dismiss:hover { opacity: 1; }

/* ---- Notification Settings modal ---- */
.notif-settings-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 12px 0;
  border-bottom: 1px solid var(--color-border-light);
}
.notif-settings-label { font-size: 0.88rem; font-weight: 600; color: #222; }
.notif-settings-desc { font-size: 0.76rem; color: var(--color-text-muted); margin-top: 2px; }
/* The lead-time row is the last one in the modal -- no divider below it. */
.notif-lead-row { border-bottom: none; }

/* Simple toggle switch, distinct from the checkbox convention used
   elsewhere -- reads as an app "settings" control rather than a form field. */
.notif-toggle {
  position: relative;
  display: inline-block;
  width: 40px;
  height: 22px;
  flex-shrink: 0;
}
.notif-toggle input { opacity: 0; width: 0; height: 0; }
.notif-toggle-slider {
  position: absolute;
  inset: 0;
  background: #ccc;
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.15s ease;
}
.notif-toggle-slider::before {
  content: "";
  position: absolute;
  width: 16px;
  height: 16px;
  left: 3px;
  top: 3px;
  background: white;
  border-radius: 50%;
  transition: transform 0.15s ease;
}
.notif-toggle input:checked + .notif-toggle-slider { background: var(--color-primary); }
.notif-toggle input:checked + .notif-toggle-slider::before { transform: translateX(18px); }

.notif-lead-row { flex-direction: column; align-items: flex-start; gap: 6px; }
.notif-lead-row label { font-size: 0.8rem; font-weight: 600; color: #666; }
.notif-lead-input { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; color: #666; }
.notif-lead-input input {
  width: 52px;
  padding: 4px 6px;
  border: 1px solid #ccc;
  border-radius: 5px;
  font-size: 0.85rem;
}

.notif-settings-status {
  min-height: 1.2em;
  font-size: 0.8rem;
  color: var(--color-good);
  margin-top: 10px;
}
.notif-settings-status.error { color: var(--color-danger); }
.notif-push-unavailable { align-items: flex-start; }
.notif-unavailable-badge { flex-shrink: 0; border-radius: 999px; background: #f0eef4; color: #62586f; padding: 5px 8px; font-size: .68rem; font-weight: 600; }
.notif-push-heading { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }

.danger-zone {
  border: 1px solid #f5c6c6;
  /* .section only carries margin-bottom (for spacing between stacked
     sections above it), so with nothing below #active-contract-details to
     push away from, Danger Zone sat flush against the ledger card. */
  margin-top: 20px;
}
.danger-zone h2 { color: #a3401f; display: inline; font-size: 0.9rem; }
.danger-zone summary { cursor: pointer; }
.danger-zone[open] summary { margin-bottom: 10px; }
.delete-account-btn {
  background: white;
  color: var(--color-danger);
  border: 1px solid var(--color-danger);
  border-radius: 6px;
  padding: 9px 20px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  margin-top: 10px;
}
.delete-account-btn:hover { background: var(--color-danger-bg); }
.delete-account-btn:disabled { opacity: 0.6; cursor: default; }

@media (max-width: 560px) {
  .resort-chip-grid { grid-template-columns: 1fr; }
}

/* Fluid Card Studio layout on phones -- the modal's own steps are already
   single-column (flex-direction:column) at any width, so the one row that
   actually needs to stack is the nav bar: up to 4 buttons (Cancel, Back,
   Skip Financial Details, Review & Save Deed) side by side would either
   wrap awkwardly or get clipped on a ~360px-wide phone. column-reverse
   puts the primary action above Cancel when stacked, matching the usual
   mobile pattern of the main CTA sitting higher/first. */
@media (max-width: 600px) {
  .studio-nav { flex-direction: column-reverse; align-items: stretch; gap: 8px; }
  .studio-nav-right { flex-direction: column; width: 100%; }
  .studio-nav-right button, .studio-nav > .cancel-btn { width: 100%; }
}

/* ---- Wallet deck + ledger on mobile (2026-09-18) ---------------------
   Reported directly against real screenshots: the card stack wasn't
   behaving like a wallet at all on a phone (each card showing almost
   fully instead of a tight peek), and the Banked/Current/Borrowed ledger
   read as three oversized gray form fields instead of a status readout. */
@media (max-width: 600px) {
  /* Root cause of the "cards show almost fully" bug: the peek band's
     height is fixed (via margin-top below) assuming a ONE-LINE resort
     name, but at the desktop font size a long name (e.g. "Copper Creek
     Villas & Cabins at Disney's Wilderness Lodge") wraps to 2-3 lines in
     a narrower mobile card, pushing real content past the intended peek
     zone. Shrinking the card and forcing the name/nickname to a single
     truncated line (the full name is already repeated in
     #active-contract-details once a card is active) makes the peek
     height reliable regardless of name length -- the actual fix, not
     just a smaller font. */
  .wallet-card {
    height: 168px;
    padding: 16px 18px;
  }

  <script>
const { currentUYYear, todayInEastern, nextDeadlineForUseYear, isBankingWindowOpen, formatDeadlineDate, useYearExpiration, dateOnlyUTC, USE_YEAR_START_MONTH, urgencyTier, expirationTier, formatDeadlineWithCountdown } = window.DVCDates;
const { initCustomSelect } = window.DVCUI;
const USE_YEARS = ["Feb", "Mar", "Apr", "Jun", "Aug", "Sep", "Oct", "Dec"];

// Wallet card face colors. No per-resort brand palette exists in the data
// layer (only per-season colors, used for calendar tinting -- see Phase 1
// notes), so this is a small curated set of jewel-tone gradients, picked
// by a stable hash of home_resort_id rather than list position, so the
// same resort always gets the same card color across renders/sessions
// instead of shifting if contracts are reordered or one is deleted.
const WALLET_CARD_GRADIENTS = [
  ["#4a148c", "#1a237e"], // brand indigo/purple (also the fallback for hash 0)
  ["#1b5e3a", "#0d3b26"], // emerald
  ["#0d47a1", "#082a63"], // sapphire
  ["#7a1734", "#4a0e20"], // garnet
  ["#8d5524", "#5c3612"], // bronze
  ["#37474f", "#1c262b"], // slate
];
function hexToRgba(hex, alpha) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
}

// Layers a translucent version of the card's own hash-based jewel-tone
// gradient over the resort's real art (data/resort_images.js), when that
// resort has any -- same wash-over-photo technique as index.html's picker
// redesign (2026-09-20), just using each card's OWN two colors instead of
// one shared tint, so a card a member already recognizes by color doesn't
// suddenly change identity, it just reveals the actual resort underneath.
// Falls back to the plain two-tone gradient for a resort with no art yet.
function walletCardGradient(resortId) {
  let hash = 0;
  for (let i = 0; i < resortId.length; i++) hash = (hash * 31 + resortId.charCodeAt(i)) >>> 0;
  const [a, b] = WALLET_CARD_GRADIENTS[hash % WALLET_CARD_GRADIENTS.length];
  const image = typeof getResortImage === "function" ? getResortImage(resortId) : null;
  if (image) {
    return `linear-gradient(135deg, ${hexToRgba(a, 0.82)}, ${hexToRgba(b, 0.82)}), url('${image}')`;
  }
  return `linear-gradient(135deg, ${a}, ${b})`;
}

// Same hash as walletCardGradient(), just the first stop -- used for
// #active-contract-details' accent top border so it visually reads as a
// continuation of whichever card is active.
function walletCardPrimaryColor(resortId) {
  let hash = 0;
  for (let i = 0; i < resortId.length; i++) hash = (hash * 31 + resortId.charCodeAt(i)) >>> 0;
  return WALLET_CARD_GRADIENTS[hash % WALLET_CARD_GRADIENTS.length][0];
}
const pageContent = document.getElementById("page-content");

// Unique resorts (data.js has one entry per resort per year -- dedupe by id).
// Owners call resorts by their short names and abbreviations, so the Add
// Contract picker sorts and searches on those rather than on the official
// "Disney's ..." / "The Villas at ..." names.
const RESORT_ABBREVIATIONS = {
  animalKingdomVillas: "akv akl jambo kidani", bayLakeTower: "blt", beachClubVillas: "bcv", boardwalkVillas: "bwv",
  boulderRidge: "brv blv wilderness lodge", copperCreek: "ccv wilderness lodge", fortWildernessCabins: "cabins fw",
  grandFloridian: "vgf", oldKeyWest: "okw", polynesianVillas: "pvb poly", rivieraResort: "rr riv", saratogaSprings: "ssr",
  aulani: "aul hawaii ko olina", hiltonHead: "hhi", veroBeach: "vb", disneylandHotel: "vdh dlh", grandCalifornian: "vgc",
};
function resortChipsInPickerOrder(resorts) {
  return [...resorts].sort((a, b) => shorthandResortName(a.id, a.name).localeCompare(shorthandResortName(b.id, b.name)));
}
function resortChipSearchText(r) {
  return `${r.name} ${shorthandResortName(r.id, r.name)} ${RESORT_ABBREVIATIONS[r.id] || ""}`.toLowerCase().replace(/"/g, "");
}

function uniqueResorts() {
  const seen = new Set();
  const list = [];
  for (const r of RESORTS) {
    if (seen.has(r.id)) continue;
    seen.add(r.id);
    list.push({ id: r.id, name: r.name });
  }
  return list.sort((a, b) => a.name.localeCompare(b.name));
}

function resortName(id) {
  const r = RESORTS.find(r => r.id === id);
  return r ? r.name : id;
}

// One year's balance for a contract, from its saved ledger row if one
// exists, or a sensible default if the owner hasn't touched that year yet
// (full annual allotment, nothing banked/borrowed -- same defaults the old
// single-snapshot version used).
function getYearPointsRow(yearPointsByContract, contractId, year, pointsPerYear) {
  const found = (yearPointsByContract[contractId] || []).find(r => r.use_year_label === year);
  return found
    ? { balance_confirmed_at: found.balance_confirmed_at || null, points_remaining: found.points_remaining, points_banked: found.points_banked, points_borrowed: found.points_borrowed, points_holding: found.points_holding || 0, points_holding_entered_at: found.points_holding_entered_at || null }
    : { balance_confirmed_at: null, points_remaining: 0, points_banked: 0, points_borrowed: 0, points_holding: 0, points_holding_entered_at: null };
}

// Which year-rows to show for a contract's ledger: always the current and
// next labeled use year, plus any further-future years the owner has
// already saved a row for (from a previous "+ Add a year"). Capped at 3
// rows total in the UI (see MAX_LEDGER_ROWS) -- Disney's own rules never
// give you more than 3 labeled years in play at once (prior/current/next),
// so beyond that a 4th "planning ahead" row is speculation, not tracking.
const MAX_LEDGER_ROWS = 3;

function buildLedgerRows(contract, yearPointsByContract, today) {
  const uyYear = currentUYYear(contract.use_year, today);
  const savedYears = (yearPointsByContract[contract.id] || []).map(r => r.use_year_label);
  const years = [...new Set([uyYear, uyYear + 1, ...savedYears])].sort((a, b) => a - b);
  return years.map(year => ({
    year,
    ...getYearPointsRow(yearPointsByContract, contract.id, year, contract.points_per_year),
    expiresMs: useYearExpiration(contract.use_year, year),
    // Only the current and immediate-next year are permanent fixtures --
    // anything else is either a "+ Plan a year" extra or a stray leftover
    // row from an earlier cycle, and either way the owner can clear it.
    removable: year !== uyYear && year !== uyYear + 1,
  }));
}

let editingId = null; // contract id currently being edited, or null for "adding new"
let isEditingMode = false; // drives the stepper's jump-to-any-step vs. linear-onboarding behavior
let activeWalletCardId = new URLSearchParams(window.location.search).get("contract"); // which card is expanded to the front of the deck (2+ contracts only)
let activeLedgerYearTab = Number(new URLSearchParams(window.location.search).get("year")) || null; // which use-year row #active-contract-details currently shows
let justIssuedContractId = null; // brand-new contract's id, so its first render gets the shimmer
let currentProfile = null; // last-fetched profile row, kept for the Notification Settings modal to read/patch without a re-fetch
let currentSubscription = null; // last-fetched subscriptions row, kept for the membership card's click handler to read without a re-fetch

function renderGate() {

}

// One active contract's real status for its CURRENT use-year cycle, judged
// against its ledger row rather than blindly trusting nextDeadlineForUseYear()
// -- that function always returns a future date, which silently misleads once
// there's nothing left to act on, or once this cycle's own window has already
// closed and it's actually reporting a LATER cycle's deadline instead. Kinds:
//   "bankable" -- remaining points exist and the banking window is still open
//   "use-by"   -- remaining points exist but the window already closed this
//                 cycle; the only thing left to track is the use-year expiration
//   "accounted" -- nothing left in the remaining bucket (used, fully banked
//                 out, or fully borrowed away) -- no ledger action needed
// Only the CURRENT-cycle "remaining" bucket is ever eligible for banking --
// points already borrowed IN came from next year's allotment and can't
// themselves be re-banked, and points already banked OUT are already
// accounted for. Using row.points_remaining alone (not remaining+borrowed)
// keeps both of those out of the "bankable" total automatically.
function evaluateContractDeadlineStatus(contract, yearPointsByContract, today) {
  return window.DVCPointAttention.evaluate(contract, yearPointsByContract, today);
}

// Earliest actual action date across all active contracts and point buckets.
function computeEarliestDeadline(contracts, yearPointsByContract, today) {
  return window.DVCPointAttention.earliest(contracts, yearPointsByContract, today);
}

// Membership card states, mapped from the raw Stripe status strings
// stored in subscriptions.status (see docs/subscriptions_plan.md Phase 2 --
// this function has to handle every status the webhook writes). No row at
// all reads the same as "free" -- the user just hasn't started a checkout
// yet, which is a normal state, not an error.
// Task 10: dynamic pricing-anchor micro-copy for the Free/upsell state --
// the actual "paywall" moment in this app (pre-signin renderGate() doesn't
// mention price at all, so anchoring there would be premature; this card's
// Free branch, with its existing hardcoded "$49.99/yr" button, is where a
// visitor actually sees and weighs the price). MEMBERSHIP_PRICE is the
// single source of truth for that number now, shared with the button text
// below, instead of two independently-hardcoded copies that could drift.
const MEMBERSHIP_PRICE = 49.99;
// Used only when the visitor has no contract yet to personalize against --
// a well-known, moderate-cost WDW resort, not cherry-picked for the most
// flattering number (every resort in DUES_PER_POINT is a real 2026 rate).
const DEFAULT_ANCHOR_RESORT_ID = "saratogaSprings";

function pricingAnchorMicroCopy(contracts) {
  const anchorContract = (contracts || []).find(c => c.is_active) || (contracts || [])[0];
  const resortId = anchorContract ? anchorContract.home_resort_id : DEFAULT_ANCHOR_RESORT_ID;
  const duesPerPoint = DUES_PER_POINT[resortId];
  if (!duesPerPoint) return ""; // no real dues data for this resort -- skip rather than show a wrong number
  const equivalentPoints = MEMBERSHIP_PRICE / duesPerPoint;
  return `Less than the annual dues on ${equivalentPoints.toFixed(1)} points at ${resortName(resortId)} &mdash; cheaper than what one missed banking deadline can cost you.`;
}

function membershipCardState(sub, contracts) {
  const status = sub?.status;
  const renewDate = sub?.current_period_end ? new Date(sub.current_period_end).toISOString().slice(0, 10) : null;

  if (!sub || status === "incomplete" || status === "canceled") {
    return {
      statusClass: "",
      statusText: "Free",
      detail: "Upgrade to Active Member to connect your own contracts, points ledger, and deadline reminders.",
      anchorText: pricingAnchorMicroCopy(contracts),
      buttonText: `Upgrade -- $${MEMBERSHIP_PRICE}/yr`,
      buttonClass: "",
      action: "upgrade",
    };
  }
  if (status === "past_due" || status === "unpaid") {
    return {
      statusClass: "is-warning",
      statusText: "Payment issue",
      detail: "Your last charge didn't go through. Update your card to keep your membership active.",
      buttonText: "Manage Membership",
      buttonClass: "secondary",
      action: "manage",
    };
  }
  if (sub.cancel_at_period_end && renewDate) {
    return {
      statusClass: "",
      statusText: "Canceled",
      detail: `Access continues through ${renewDate}, then reverts to Free.`,
      buttonText: "Manage Membership",
      buttonClass: "secondary",
      action: "manage",
    };
  }
  if (status === "trialing") {
    // No "(trial)" suffix here -- the detail line right below already says
    // it, and every status/detail pair in this function otherwise avoids
    // stating the same fact twice.
    return {
      statusClass: "is-active",
      statusText: "Active Member",
      detail: renewDate ? `Free trial -- first charge on ${renewDate} unless you cancel before then.` : "Free trial in progress.",
      buttonText: "Manage Membership",
      buttonClass: "secondary",
      action: "manage",
    };
  }
  // active, or any other not-yet-seen Stripe status -- default to the
  // "you have access" framing rather than silently showing Free.
  return {
    statusClass: "is-active",
    statusText: "Active Member",
    detail: renewDate ? `Renews ${renewDate}.` : "",
    buttonText: "Manage Membership",
    buttonClass: "secondary",
    action: "manage",
  };
}

function buildMembershipCardHTML(sub, contracts) {
  const s = membershipCardState(sub, contracts);
  return `
    <div class="membership-card">
      <div>
        <div class="membership-card-label">Membership</div>
        <div class="membership-card-status ${s.statusClass}">${s.statusText}</div>
        ${s.detail ? `<div class="membership-card-detail">${s.detail}</div>` : ""}

// The Checkout redirect (create-checkout-session's success_url/cancel_url)
// lands back here as ?checkout=success|cancelled -- this banner is just
// the confirmation; the actual subscriptions row is written by the
// stripe-webhook Edge Function, which may land a second or two after the
// redirect (see startCheckoutSuccessPoll()), so "success" here means
// "Stripe took the payment," not "we've confirmed the row updated yet."
function buildCheckoutReturnBannerHTML() {
  const status = new URLSearchParams(window.location.search).get("checkout");
  if (status === "success") {
    return `<div class="membership-checkout-banner success" id="checkout-return-banner">Payment received -- activating your membership&hellip;</div>`;
  }
  if (status === "cancelled") {
    return `<div class="membership-checkout-banner cancelled" id="checkout-return-banner">Checkout canceled -- no charge was made.</div>`;
  }
  return "";
}

function buildDeadlineCountdownHTML(earliest) {
  if (!earliest) return "";
  if (earliest.kind === 'unconfirmed') return `<div class="deadline-countdown calm"><div class="deadline-countdown-text"><div class="deadline-countdown-label">Add your points balance</div><div class="deadline-countdown-detail">${window.DVCPointAttention.label(earliest.contract, resortName(earliest.contract.home_resort_id))}: annual points describe what you own. Add what is left to see available points and reminders.</div></div></div>`;

  if (earliest.kind === "accounted") {
    return `
    <div class="deadline-countdown calm">
      <span class="deadline-countdown-icon">✅</span>
      <div class="deadline-countdown-text">
        <div class="deadline-countdown-label">Ledger Status</div>
        <div class="deadline-countdown-detail">All points are accounted for -- nothing currently needs banking or borrowing.</div>
      </div>
    </div>
  `;
  }

  if (earliest.kind === "use-by") {
    // Color follows the unified urgency scale (proximity to actual
    // forfeiture) -- the 🔒 icon is the separate "banking specifically
    // is closed" signal, independent of how urgent that color reads.
    const { contract, expiresMs, daysUntil } = earliest;
    return `
    <div class="deadline-countdown ${expirationTier(daysUntil)}">
      <span class="deadline-countdown-icon">🔒</span>
      <div class="deadline-countdown-text">
        <div class="deadline-countdown-label">Use-Year Expiration</div>
        <div class="deadline-countdown-detail">
          <strong>${window.DVCPointAttention.label(contract, resortName(contract.home_resort_id))}</strong> &mdash; ${earliest.points} pts (${earliest.buckets}) must be used by
          <strong>${formatDeadlineWithCountdown(expiresMs, daysUntil)}</strong>
        </div>
      </div>
    </div>
  `;
  }

  // kind === "bankable"
  const { contract, deadline } = earliest;
  return `
    <div class="deadline-countdown ${urgencyTier(deadline.daysUntil)}">
      <span class="deadline-countdown-icon">⏳</span>
      <div class="deadline-countdown-text">
        <div class="deadline-countdown-label">Your Earliest Deadline</div>
        <div class="deadline-countdown-detail">
          <strong>${window.DVCPointAttention.label(contract, resortName(contract.home_resort_id))}</strong> &mdash; ${earliest.points} current pts; bank by
          <strong>${formatDeadlineWithCountdown(deadline.ms, deadline.daysUntil)}</strong>
        </div>
      </div>
    </div>
  `;
}

// ---- Notification Center ----
// A short list of OTHER active contracts' notable statuses -- whichever one
// is already the lead banner above (buildDeadlineCountdownHTML) is excluded
// so the same fact isn't shown twice. Fully "accounted" contracts never
// appear here; there's nothing to act on. Each item can be dismissed for
// its current use-year cycle (localStorage, this browser only -- a fresh
// cycle naturally gets a new id, so dismissing one deadline can't
// accidentally suppress a future one for the same contract).
const DISMISSED_NOTIFS_KEY = "dvc_dismissed_notifications";

function getDismissedNotificationIds() {
  try {
    return new Set(JSON.parse(localStorage.getItem(DISMISSED_NOTIFS_KEY) || "[]"));
  } catch {
    return new Set();
  }
}

function dismissNotification(id) {
  const ids = getDismissedNotificationIds();
  ids.add(id);
  try {
    localStorage.setItem(DISMISSED_NOTIFS_KEY, JSON.stringify([...ids]));
  } catch {
    // Private browsing / storage disabled -- dismissal just won't persist
    // across a reload, not worth surfacing an error for.
  }
}

// Google Calendar's "render" web-intent URL -- opens a pre-filled event
// creation screen in a new tab. No .ics download to double-tap on mobile,
// no backend involved.
function googleCalendarLink(contract, dateMs, isBankable) {
  const ymd = new Date(dateMs).toISOString().slice(0, 10).replace(/-/g, "");
  const nextDay = new Date(dateMs + 86400000).toISOString().slice(0, 10).replace(/-/g, "");
  const title = isBankable
    ? `Banking deadline -- ${resortName(contract.home_resort_id)} DVC points`
    : `Use-year expiration -- ${resortName(contract.home_resort_id)} DVC points`;
  const details = isBankable
    ? "Current points must be banked by this date to move to the following use year. Added via DVC Companion."
    : "Remaining points for this use year must be used by this date. Added via DVC Companion.";
  const params = new URLSearchParams({ action: "TEMPLATE", text: title, dates: `${ymd}/${nextDay}`, details });
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}

function buildNotificationCenterHTML(contracts, yearPointsByContract, today, leadContractId) {
  const dismissed = getDismissedNotificationIds();
  const items = contracts
    .filter(c => c.is_active)
    .flatMap(c => window.DVCPointAttention.eventsForContract(c, yearPointsByContract, today).map(status => ({ contract: c, status })))
    .filter(({contract, status}) => contract.id !== leadContractId || status.kind !== evaluateContractDeadlineStatus(contract, yearPointsByContract, today).kind)
    .sort((a,b) => (a.status.deadline?.ms ?? a.status.expiresMs ?? Infinity) - (b.status.deadline?.ms ?? b.status.expiresMs ?? Infinity))
    .filter(({ status }) => status.kind !== "accounted")
    .map(({ contract, status }) => ({ contract, status, id: `${contract.id}:${status.kind}:${currentUYYear(contract.use_year, today)}:${status.buckets}` }))
    .filter(({ id }) => !dismissed.has(id));

  if (items.length === 0) return "";

  return `
    <div class="notification-center" id="notification-center-list">
      ${items.map(({ contract, status, id }) => {
        if (status.kind === "unconfirmed") return `<div class="notification-item calm"><div class="notification-item-text"><strong>${window.DVCPointAttention.label(contract, resortName(contract.home_resort_id))}</strong> &mdash; balance not added. <a href="account.html?contract=${encodeURIComponent(contract.id)}">Add points left</a></div></div>`;
        const isBankable = status.kind === "bankable";
        const dateMs = isBankable ? status.deadline.ms : status.expiresMs;
        const daysUntil = isBankable ? status.deadline.daysUntil : status.daysUntil;
        const text = isBankable
          ? `${status.points} current pts; bank by ${formatDeadlineWithCountdown(dateMs, daysUntil)}`
          : `${status.points} pts (${status.buckets}) expire ${formatDeadlineWithCountdown(dateMs, daysUntil)}`;
        return `
        <div class="notification-item ${isBankable ? urgencyTier(daysUntil) : expirationTier(daysUntil)}" data-notif-id="${id}">
          <span class="notification-item-icon">${isBankable ? "⏳" : "🔒"}</span>
          <div class="notification-item-text"><strong>${window.DVCPointAttention.label(contract, resortName(contract.home_resort_id))}</strong> &mdash; ${text}</div>
          <div class="notification-item-actions">
            <a class="notification-item-cal" href="${googleCalendarLink(contract, dateMs, isBankable)}" target="_blank" rel="noopener">+ Calendar</a>
            <button type="button" class="notification-item-dismiss" data-dismiss="${id}" aria-label="Dismiss">&times;</button>
          </div>
        </div>`;
      }).join("")}
    </div>
  `;
}

// "Dec 2025 – Nov 2026". DVC labels a use year by its deposit year, which
// reads as last year's for most of the cycle, so tabs show the real dates.
function useYearRangeLabel(useYear, label) {
  const fmt = ms => new Date(ms).toLocaleDateString(undefined, { month: "short", year: "numeric", timeZone: "UTC" });
  return `${fmt(dateOnlyUTC(label, USE_YEAR_START_MONTH[useYear], 1))} – ${fmt(useYearExpiration(useYear, label))}`;
}

// Email reminders are off by default and otherwise live behind the small
// bell icon, so once there's a contract to remind about, offer them once.
const REMINDER_OFFER_DISMISSED_KEY = "dvc_reminder_offer_dismissed";
function buildReminderOfferHTML(profile, contracts) {
  if (profile?.reminder_opt_in || !contracts.some(c => c.is_active)) return "";
  try { if (localStorage.getItem(REMINDER_OFFER_DISMISSED_KEY)) return ""; } catch (_) {}
  return `
    <div class="reminder-offer" id="reminder-offer">
      <span class="reminder-offer-icon" aria-hidden="true">🔔</span>
      <div class="reminder-offer-text"><strong>Get an email before a deadline</strong><span>We'll email you ${profile?.reminder_lead_days || 14} days before a banking deadline so points don't expire unnoticed.</span></div>
      <div class="reminder-offer-actions"><button type="button" class="save-btn" id="reminder-offer-on">Turn on</button><button type="button" class="reminder-offer-dismiss" id="reminder-offer-dismiss">Not now</button></div>
    </div>`;
}
function wireReminderOffer() {
  const offer = document.getElementById("reminder-offer");
  if (!offer) return;
  document.getElementById("reminder-offer-on").addEventListener("click", async (e) => {
    e.target.disabled = true;
    e.target.textContent = "Turning on...";
    const { error } = await window.DVCAuth.updateProfile({ reminder_opt_in: true });
    if (error) {
      e.target.disabled = false;
      e.target.textContent = "Try again";
      return;
    }
    await renderSignedIn();
  });
  document.getElementById("reminder-offer-dismiss").addEventListener("click", () => {
    try { localStorage.setItem(REMINDER_OFFER_DISMISSED_KEY, "1"); } catch (_) {}
    offer.remove();
  });
}

    const btn = e.target.closest(".points-preset-chip");
    if (!btn) return;
    document.querySelectorAll(".points-preset-chip").forEach(c => c.classList.remove("selected"));
    btn.classList.add("selected");
    document.getElementById("f-points").value = btn.dataset.points;
    updateModalCardPreview();
    updateStudioNextLabel();
  });
  document.getElementById("f-points").addEventListener("input", () => { updateModalCardPreview(); updateStudioNextLabel(); });
  document.getElementById("f-nickname").addEventListener("input", updateModalCardPreview);
  // Blue Card eligibility and resale-restriction status both depend on
  // acquisition year -- refresh the live preview as soon as it's picked,
  // same as every other Step 3 field that feeds the card face.
  document.getElementById("f-acquisition-year").addEventListener("input", updateModalCardPreview);
  document.getElementById("delete-account").addEventListener("click", handleDeleteAccount);

  // Notification Settings modal -- same open/close/backdrop-click
  // conventions as the Card Studio modal above.
  document.getElementById("notif-settings-btn").addEventListener("click", openNotifSettings);
  document.getElementById("notif-settings-close").addEventListener("click", closeNotifSettings);
  document.getElementById("notif-settings-cancel").addEventListener("click", closeNotifSettings);
  document.getElementById("notif-settings-modal").addEventListener("click", (e) => {
    if (e.target.id === "notif-settings-modal") closeNotifSettings();
  });
  document.getElementById("notif-settings-save").addEventListener("click", saveNotificationSettings);

  document.getElementById("membership-action-btn").addEventListener("click", handleMembershipAction);
  wireReminderOffer();
  handleCheckoutReturn();

  // Notification Center dismiss buttons -- delegated since the list
  // re-renders on every page load and each item's own lifetime is short.
  document.getElementById("point-attention")?.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-dismiss]");
    if (!btn) return;
    dismissNotification(btn.dataset.dismiss);
    btn.closest(".notification-item").remove();
  });

  // Wallet deck: clicking a card's face brings it to the front. The ledger
  // panel and action row live in #active-contract-details now, not inside
  // the card, so there's no "outside panel/actions" exclusion needed here
  // any more -- any click on a card face is a click to activate it. The
  // perk dot is the one exception: tapping it should open its tooltip (see
  // the document-level click handler below), not re-render the whole deck
  // out from under it.
  document.getElementById("contract-list").addEventListener("click", (e) => {
    if (e.target.closest(".wallet-card-perk-dot")) return;
    const card = e.target.closest(".wallet-card[data-contract-id]");
    if (card && document.getElementById("contract-list").classList.contains("wallet-deck")) {
      activeWalletCardId = card.dataset.contractId;
      activeLedgerYearTab = null; // let the new card default to its own current year
      renderContractList(contracts, resorts, yearPointsByContract);
    }
  });

  // Row-level edit/delete/reactivate buttons and ledger controls for the
  // active contract (delegated, since the panel re-renders on every tab
  // switch and on every card switch).
  document.getElementById("active-contract-details").addEventListener("click", async (e) => {
    const editBtn = e.target.closest("[data-edit]");
    const deleteBtn = e.target.closest("[data-delete]");
    const toggleBtn = e.target.closest("[data-toggle-active]");
    const yearTab = e.target.closest(".ledger-year-tab[data-select-year]");

    if (editBtn) {
      const c = contracts.find(c => c.id === editBtn.dataset.edit);
      if (c) openForm(c);
    }
    if (deleteBtn) {
      if (!confirm("Delete this contract? This can't be undone.")) return;
      await window.DVCAuth.deleteContract(deleteBtn.dataset.delete);
      // Only clear the active selection if the deleted contract WAS the
      // active one -- renderContractList()'s own fallback then picks a new
      // default from the post-delete list. Deleting some other (background)
      // card shouldn't switch the user away from what they're looking at.
      if (deleteBtn.dataset.delete === activeWalletCardId) {
        activeWalletCardId = null;
        activeLedgerYearTab = null;
      }
      renderSignedIn();
    }
    if (toggleBtn) {
      const c = contracts.find(c => c.id === toggleBtn.dataset.toggleActive);
      if (c) {
        await window.DVCAuth.updateContract(c.id, { is_active: !c.is_active });
        renderSignedIn();
      }
    }

    if (yearTab) {
      activeLedgerYearTab = Number(yearTab.dataset.selectYear);
      renderActiveContractDetails(contracts, yearPointsByContract);
    }

    const addYearBtn = e.target.closest("[data-add-year]");
    if (addYearBtn) {
      const c = contracts.find(c => c.id === addYearBtn.dataset.contractId);
      if (c) await addLedgerYear(c, Number(addYearBtn.dataset.addYear), yearPointsByContract);
    }

    const removeYearBtn = e.target.closest("[data-remove-year]");
    if (removeYearBtn) {
      if (!confirm(`Remove the ${removeYearBtn.dataset.removeYear} row? Its saved points for that year will be deleted.`)) return;
      await removeLedgerYear(removeYearBtn.dataset.contractId, Number(removeYearBtn.dataset.removeYear), yearPointsByContract);
    }
  });

  document.getElementById('active-contract-details').addEventListener('click', e => {
    const button = e.target.closest('[data-setup-balance]');
    if (button) openBalanceSetup(activeWalletCardId, Number(button.dataset.setupBalance));
    const action = e.target.closest('[data-point-action]');
    if (action?.dataset.pointAction === 'adjust') openBalanceSetup(activeWalletCardId, activeLedgerYearTab, true);
    else if (action) openPointMove(action.dataset.pointAction, activeLedgerYearTab);
  });
}

// Short "Jan 31" form for the card face's compact deadline pill -- the
// shared formatDeadlineDate() (dvc-dates.js) always includes the year,
// which is the right call for the ledger's "Use by" column but too long
// for a pill that has to fit next to the UY/purchase-type pills.
function formatShortDate(ms) {
  return new Date(ms).toLocaleDateString(undefined, { month: "short", day: "numeric", timeZone: "UTC" });
}

// Card face inner markup only (no outer .wallet-card wrapper/background) --
// shared by the real deck below AND the Card Studio's live preview
// (updateModalCardPreview()), so what a user sees while building a
// contract is pixel-identical to what lands in their vault.
// Card face only flags something when it's notable (Blue Card eligible, or
// resale-restricted) -- a plain non-eligible direct or grandfathered-resale
// contract gets no pill, keeping the face uncluttered for the common case.
function perkPillTooltip(perks) {
  if (perks.resaleRestrictionType === "restricted_home_resort_only") {
    return "Bought resale at this resort -- these points can only ever book stays here, not any other DVC resort. Direct-purchased points at this same resort don't have this limit.";
  }
  if (perks.resaleRestrictionType === "general_resale") {
    return "Bought resale on or after March 21, 2011 -- these points can't be redeemed through the Disney Collection (cash Disney hotel rooms, cruises, Adventures by Disney). Booking DVC resorts at 7 months is unaffected.";
  }
  if (perks.isBlueCardOverridden) {
    return "Manually marked Blue Card eligible -- annual pass, merchandise, and dining discounts reserved for qualifying direct owners. Set on this contract's Details step, overriding the automatic year-based detection.";
  }
  return "This contract's points were purchased direct and meet Disney's minimum for Blue Card Membership Extras -- annual pass, merchandise, and dining discounts reserved for qualifying direct owners.";
}

// A small icon dot rather than the full spelled-out label (e.g. "NO DISNEY
// COLLECTION") -- that read as a big, shouty callout on an otherwise sleek
// card, especially for a resale limitation nobody needs announced at that
// size. The full label still appears in the tooltip and in the Active
// Contract Details header below (buildActivePerkBadgeHTML()), where a
// labeled fact fits the context instead of looking like a warning stamp.
function buildPerkPillHTML(perks) {
  if (!perks || perks.badgeVariant === "neutral") return "";
  const cls = perks.badgeVariant === "info" ? "blue-card" : "restricted";
  const icon = perks.badgeVariant === "info" ? "★" : "!";
  return `<span class="wallet-card-perk-dot ${cls} tooltip-anchor tooltip-align-left" role="img" aria-label="${perks.badgeText}">${icon}<div class="tooltip-card"><strong>${perks.badgeText}</strong><br>${perkPillTooltip(perks)}</div></span>`;
}
