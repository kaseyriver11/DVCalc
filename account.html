  <script>
const USE_YEARS = ["Feb", "Mar", "Apr", "Jun", "Aug", "Sep", "Oct", "Dec"];
const pageContent = document.getElementById("page-content");

// Banking/borrowing deadline: always 8 months after the use year's start
// month, same calendar date every year regardless of which specific
// 12-month cycle you're in. {month, day} below is 1-indexed and is the
// deadline itself -- not the use-year start -- so "next deadline" is just
// "the next time this month/day occurs on or after today," which handles
// both same-year deadlines (Feb, Mar, Apr) and next-year ones (Jun, Aug,
// Sep, Oct, Dec) with one rule instead of hardcoding which roll over.
// Mirrors the Edge Function's copy of this table exactly -- see
// supabase/functions/send-banking-reminders/index.ts.
const DEADLINE_BY_USE_YEAR = {
  Feb: { month: 9, day: 30 },  // Sep 30
  Mar: { month: 10, day: 31 }, // Oct 31
  Apr: { month: 11, day: 30 }, // Nov 30
  Jun: { month: 1, day: 31 },  // Jan 31
  Aug: { month: 3, day: 31 },  // Mar 31
  Sep: { month: 4, day: 30 },  // Apr 30
  Oct: { month: 5, day: 31 },  // May 31
  Dec: { month: 7, day: 31 },  // Jul 31
};

// 1-indexed deposit month for each use year (Jan=1). DVC labels a use
// year's points by the calendar year they DEPOSIT in, not the year they
// expire in -- confirmed against an official planDisney Q&A and multiple
// DVC community sources (2026-09-11 research): a Dec-UY member's "2026
// points" deposit Dec 1, 2026 and run through Nov 30, 2027, NOT the cycle
// already underway in Sept 2026 (which is "2025 points", deposited Dec 1,
// 2025). Points can only be banked one hop forward and borrowed from
// exactly the next use year, so at most 3 labeled years are ever in play
// at once: prior (banked in), current (remaining), next (borrowed in).
const USE_YEAR_START_MONTH = { Feb: 2, Mar: 3, Apr: 4, Jun: 6, Aug: 8, Sep: 9, Oct: 10, Dec: 12 };

// The calendar year label of the use-year cycle active right now -- the
// most recent deposit that's already happened. If this year's deposit
// month hasn't arrived yet, the active cycle is still last year's.
function currentUYYear(useYear, today) {
  const startMonth = USE_YEAR_START_MONTH[useYear];
  return today.month >= startMonth ? today.year : today.year - 1;
}

// "Today" as a calendar date in Eastern time, independent of the
// visitor's own timezone -- otherwise someone browsing from a timezone
// hours ahead/behind ET could see a deadline flip a day early or late
// right around midnight ET.
function todayInEastern() {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/New_York",
    year: "numeric", month: "2-digit", day: "2-digit",
  }).formatToParts(new Date());
  const map = Object.fromEntries(parts.map(p => [p.type, p.value]));
  return { year: Number(map.year), month: Number(map.month), day: Number(map.day) };
}

function dateOnlyUTC(year, month, day) {
  return Date.UTC(year, month - 1, day);
}

function nextDeadlineForUseYear(useYear, today) {
  const { month, day } = DEADLINE_BY_USE_YEAR[useYear];
  const todayMs = dateOnlyUTC(today.year, today.month, today.day);
  let candidateMs = dateOnlyUTC(today.year, month, day);
  if (candidateMs < todayMs) candidateMs = dateOnlyUTC(today.year + 1, month, day);
  return { ms: candidateMs, daysUntil: Math.round((candidateMs - todayMs) / 86400000) };
}

function formatDeadlineDate(ms) {
  return new Date(ms).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}

// Unique resorts (data.js has one entry per resort per year -- dedupe by id).
function uniqueResorts() {
  const seen = new Set();
  const list = [];
  for (const r of RESORTS) {
    if (seen.has(r.id)) continue;
    seen.add(r.id);
    list.push({ id: r.id, name: r.name });
  }
  return list.sort((a, b) => a.name.localeCompare(b.name));
}

function resortName(id) {
  const r = RESORTS.find(r => r.id === id);
  return r ? r.name : id;
}

// Points a contract can actually spend this use year: the user-maintained
// "remaining" balance (defaults to the full annual allotment until they've
// customized it here) plus whatever they've banked in from last year or
// borrowed in from next year. Mirrors app.js's copy of this same logic,
// used there to show a stay's effect on the balance.
function getAvailablePoints(c) {
  const remaining = c.points_remaining ?? c.points_per_year;
  return remaining + (c.points_banked || 0) + (c.points_borrowed || 0);
}

let editingId = null; // contract id currently being edited, or null for "adding new"
// A non-blocking warning from the most recent save (e.g. the database is
// missing a migration for one of the newer optional columns) -- shown once
// above the contract list, same pattern as trips.html's pendingWarning.
let pendingWarning = null;

function renderGate() {
  pageContent.innerHTML = `
    <div class="gate">
      <p>Sign in to save your DVC contracts and unlock personalized booking windows on the calendar.</p>
      <button type="button" class="big-signin-btn" id="gate-signin">Sign in with Google</button>
    </div>
  `;
  document.getElementById("gate-signin").addEventListener("click", () => window.DVCAuth.signInWithGoogle());
}

function renderUnconfigured() {
  pageContent.innerHTML = `
    <div class="gate">
      <p>Accounts aren't set up on this deployment yet.</p>
    </div>
  `;
}

async function renderSignedIn() {
  const [contracts, profile] = await Promise.all([
    window.DVCAuth.getContracts(),
    window.DVCAuth.getProfile(),
  ]);

  const resorts = uniqueResorts();

  pageContent.innerHTML = `
    <div class="section">
      <h2>Your Contracts</h2>
      <div class="section-sub">Own more than one? Add each separately -- DVCalc will combine what they unlock together.</div>
      ${pendingWarning ? `<div class="save-warning">${pendingWarning}</div>` : ""}
      <div class="contract-list" id="contract-list"></div>
      <button type="button" class="add-btn" id="show-add-form">+ Add Contract</button>
      <div class="contract-form" id="contract-form">
        <div class="form-error" id="form-error" style="display:none;"></div>
        <div class="form-grid">
          <div class="form-field full">
            <label for="f-nickname">Nickname (optional)</label>
            <input type="text" id="f-nickname" placeholder="e.g. Mom's contract">
          </div>
          <div class="form-field">
            <label for="f-resort">Home Resort</label>
            <select id="f-resort">
              ${resorts.map(r => `<option value="${r.id}">${r.name}</option>`).join("")}
            </select>
          </div>
          <div class="form-field">
            <label for="f-useyear">Use Year</label>
            <select id="f-useyear">
              ${USE_YEARS.map(y => `<option value="${y}">${y}</option>`).join("")}
            </select>
          </div>
          <div class="form-field">
            <label for="f-points">Points per Year</label>
            <input type="number" id="f-points" min="1" step="1" placeholder="e.g. 150">
          </div>
          <div class="form-field">
            <label>Purchase Type</label>
            <div class="purchase-type-toggle">
              <button type="button" id="f-type-direct" class="selected">Direct</button>
              <button type="button" id="f-type-resale">Resale</button>
            </div>
          </div>
          <div class="form-field">
            <label for="f-price">Purchase Price (optional)</label>
            <input type="number" id="f-price" min="0" step="1" placeholder="Total $ paid">
          </div>
          <div class="form-field">
            <label for="f-date">Purchase Date (optional)</label>
            <input type="date" id="f-date">
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="save-btn" id="save-contract">Save Contract</button>
          <button type="button" class="cancel-btn" id="cancel-contract">Cancel</button>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>Deadline Reminders</h2>
      <div class="reminder-row">
        <label><input type="checkbox" id="r-opt-in" ${profile?.reminder_opt_in ? "checked" : ""}> Email me before banking/borrowing deadlines</label>
        <label>Lead time: <input type="number" id="r-lead-days" min="1" max="240" value="${profile?.reminder_lead_days ?? 14}"> days</label>
        <button type="button" class="small-btn" id="save-reminders">Save</button>
      </div>
      <div class="reminder-note">Emails send automatically once you're within your lead time of a deadline.</div>
    </div>

    <div class="section danger-zone">
      <h2>Danger Zone</h2>
      <div class="section-sub">Permanently deletes your account, every contract, all trip history, and every saved itinerary. There's no undo.</div>
      <button type="button" class="delete-account-btn" id="delete-account">Delete My Account</button>
    </div>
  `;

  renderContractList(contracts, resorts);
  pendingWarning = null;

  document.getElementById("show-add-form").addEventListener("click", () => openForm(null));
  document.getElementById("cancel-contract").addEventListener("click", closeForm);
  document.getElementById("save-contract").addEventListener("click", () => saveForm(contracts));
  document.getElementById("f-type-direct").addEventListener("click", () => setPurchaseType("direct"));
  document.getElementById("f-type-resale").addEventListener("click", () => setPurchaseType("resale"));
  document.getElementById("save-reminders").addEventListener("click", saveReminderPrefs);
  document.getElementById("delete-account").addEventListener("click", handleDeleteAccount);

  // Row-level edit/delete/reactivate buttons (delegated, since the list re-renders).
  document.getElementById("contract-list").addEventListener("click", async (e) => {
    const editBtn = e.target.closest("[data-edit]");
    const deleteBtn = e.target.closest("[data-delete]");
    const toggleBtn = e.target.closest("[data-toggle-active]");

    if (editBtn) {
      const c = contracts.find(c => c.id === editBtn.dataset.edit);
      if (c) openForm(c);
    }
    if (deleteBtn) {
      if (!confirm("Delete this contract? This can't be undone.")) return;
      await window.DVCAuth.deleteContract(deleteBtn.dataset.delete);
      renderSignedIn();
    }
    if (toggleBtn) {
      const c = contracts.find(c => c.id === toggleBtn.dataset.toggleActive);
      if (c) {
        await window.DVCAuth.updateContract(c.id, { is_active: !c.is_active });
        renderSignedIn();
      }
    }
  });

  // Quick-edit points boxes: live total on every keystroke, real save once
  // the user leaves a field. Separate listeners (not the click delegate
  // above) since number inputs fire "input"/"change", not "click".
  document.getElementById("contract-list").addEventListener("input", (e) => {
    const card = e.target.closest(".points-quick-edit");
    if (!card || !e.target.matches(".qe-remaining, .qe-banked, .qe-borrowed")) return;
    const contract = contracts.find(c => c.id === card.dataset.contractId);
    if (contract) updateQuickEditTotal(card, contract.points_per_year);
  });

  document.getElementById("contract-list").addEventListener("change", (e) => {
    const card = e.target.closest(".points-quick-edit");
    if (!card || !e.target.matches(".qe-remaining, .qe-banked, .qe-borrowed")) return;
    const contract = contracts.find(c => c.id === card.dataset.contractId);
    if (contract) saveQuickEdit(card, contract);
  });
}

function renderContractList(contracts, resorts) {
  const list = document.getElementById("contract-list");
  if (contracts.length === 0) {
    list.innerHTML = `<div class="empty-note">No contracts yet -- add your first one below.</div>`;
    return;
  }
  const today = todayInEastern();
  list.innerHTML = contracts.map(c => {
    const deadline = c.is_active ? nextDeadlineForUseYear(c.use_year, today) : null;
    const uyYear = currentUYYear(c.use_year, today);
    return `
    <div class="contract-card ${c.is_active ? "" : "inactive"}">
      <div class="contract-main">
        <div class="contract-name">${c.nickname || resortName(c.home_resort_id)}</div>
        <div class="contract-meta">
          <span>${resortName(c.home_resort_id)}</span>
          <span>&middot;</span>
          <span>${c.use_year} UY</span>
          <span>&middot;</span>
          <span>${c.points_per_year.toLocaleString()} pts/yr</span>
          <span class="badge ${c.purchase_type === "direct" ? "badge-direct" : "badge-resale"}">${c.purchase_type}</span>
          ${c.is_active ? "" : `<span class="badge badge-inactive">inactive</span>`}
        </div>
        ${deadline ? `<div class="contract-deadline">Next banking/borrowing deadline: <strong>${formatDeadlineDate(deadline.ms)}</strong> (${deadline.daysUntil} day${deadline.daysUntil === 1 ? "" : "s"})</div>` : ""}
        <div class="points-quick-edit" data-contract-id="${c.id}" data-points-per-year="${c.points_per_year}">
          <div class="qe-field">
            <label for="qe-banked-${c.id}" class="qe-uy-label"><span class="qe-uy-year">${uyYear - 1}</span><span class="qe-uy-word">Banked</span></label>
            <input type="number" id="qe-banked-${c.id}" class="qe-banked" min="0" step="1" value="${c.points_banked || 0}">
          </div>
          <div class="qe-field qe-current">
            <label for="qe-remaining-${c.id}" class="qe-uy-label"><span class="qe-uy-year">${uyYear}</span><span class="qe-uy-word">Remaining</span></label>
            <input type="number" id="qe-remaining-${c.id}" class="qe-remaining" min="0" step="1" value="${c.points_remaining ?? c.points_per_year}">
          </div>
          <div class="qe-field">
            <label for="qe-borrowed-${c.id}" class="qe-uy-label"><span class="qe-uy-year">${uyYear + 1}</span><span class="qe-uy-word">Borrowed</span></label>
            <input type="number" id="qe-borrowed-${c.id}" class="qe-borrowed" min="0" step="1" value="${c.points_borrowed || 0}">
          </div>
          <div class="qe-total">
            <label>Total</label>
            <div class="qe-total-value">${getAvailablePoints(c).toLocaleString()}</div>
          </div>
          <span class="qe-status"></span>
        </div>
      </div>
      <div class="contract-actions">
        <button type="button" class="small-btn" data-edit="${c.id}">Edit</button>
        <button type="button" class="small-btn" data-toggle-active="${c.id}">${c.is_active ? "Deactivate" : "Reactivate"}</button>
        <button type="button" class="small-btn danger" data-delete="${c.id}">Delete</button>
      </div>
    </div>
  `;
  }).join("");
}

// Recomputes the total shown in a quick-edit widget from its three inputs'
// current (possibly unsaved) values -- fires on every keystroke, purely
// client-side, no network call.
function updateQuickEditTotal(card, pointsPerYear) {
  const remainingRaw = card.querySelector(".qe-remaining").value;
  const remaining = remainingRaw === "" ? pointsPerYear : (parseInt(remainingRaw, 10) || 0);
  const banked = parseInt(card.querySelector(".qe-banked").value, 10) || 0;
  const borrowed = parseInt(card.querySelector(".qe-borrowed").value, 10) || 0;
  card.querySelector(".qe-total-value").textContent = (remaining + banked + borrowed).toLocaleString();
}

// Saves a quick-edit widget's three fields as soon as the user leaves a
// field (blur, Enter, or the number input's up/down arrows -- all fire
// "change"), rather than requiring them to open the full Edit form. Updates
// the in-memory `contract` object on success so it stays in sync with what
// Edit would show if opened afterward, without re-rendering the whole list
// (which would steal focus out from under a still-mid-edit user).
async function saveQuickEdit(card, contract) {
  const remainingRaw = card.querySelector(".qe-remaining").value;
  const patch = {
    points_remaining: remainingRaw === "" ? null : Math.max(0, parseInt(remainingRaw, 10) || 0),
    points_banked: Math.max(0, parseInt(card.querySelector(".qe-banked").value, 10) || 0),
    points_borrowed: Math.max(0, parseInt(card.querySelector(".qe-borrowed").value, 10) || 0),
  };

  const statusEl = card.querySelector(".qe-status");
  statusEl.textContent = "Saving…";
  statusEl.classList.remove("error");

  const result = await window.DVCAuth.updateContract(contract.id, patch);
  if (result.error) {
    statusEl.textContent = "Not saved";
    statusEl.classList.add("error");
    return;
  }

  Object.assign(contract, patch);
  updateQuickEditTotal(card, contract.points_per_year);
  statusEl.textContent = result.warning ? "Saved (partial)" : "Saved";
  setTimeout(() => { if (statusEl.textContent !== "Saving…") statusEl.textContent = ""; }, 1500);
}

function setPurchaseType(type) {
  document.getElementById("f-type-direct").classList.toggle("selected", type === "direct");
  document.getElementById("f-type-resale").classList.toggle("selected", type === "resale");
}

function getSelectedPurchaseType() {
  return document.getElementById("f-type-direct").classList.contains("selected") ? "direct" : "resale";
}

function openForm(contract) {
  editingId = contract ? contract.id : null;
  document.getElementById("form-error").style.display = "none";
  document.getElementById("f-nickname").value = contract?.nickname || "";
  document.getElementById("f-resort").value = contract?.home_resort_id || uniqueResorts()[0].id;
  document.getElementById("f-useyear").value = contract?.use_year || USE_YEARS[0];
  document.getElementById("f-points").value = contract?.points_per_year || "";
  document.getElementById("f-price").value = contract?.purchase_price || "";
  document.getElementById("f-date").value = contract?.purchase_date || "";
  setPurchaseType(contract?.purchase_type || "direct");
  document.getElementById("contract-form").classList.add("open");
  document.getElementById("save-contract").textContent = contract ? "Save Changes" : "Save Contract";
  document.getElementById("contract-form").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function closeForm() {
  editingId = null;
  document.getElementById("contract-form").classList.remove("open");
}

async function saveForm() {
  const errorEl = document.getElementById("form-error");
  errorEl.style.display = "none";

  const points = parseInt(document.getElementById("f-points").value, 10);
  if (!points || points <= 0) {
    errorEl.textContent = "Points per year is required and must be a positive number.";
    errorEl.style.display = "block";
    return;
  }

  const payload = {
    nickname: document.getElementById("f-nickname").value.trim() || null,
    home_resort_id: document.getElementById("f-resort").value,
    use_year: document.getElementById("f-useyear").value,
    points_per_year: points,
    purchase_type: getSelectedPurchaseType(),
    purchase_price: document.getElementById("f-price").value ? parseFloat(document.getElementById("f-price").value) : null,
    purchase_date: document.getElementById("f-date").value || null,
  };

  const result = editingId
    ? await window.DVCAuth.updateContract(editingId, payload)
    : await window.DVCAuth.addContract(payload);

  if (result.error) {
    errorEl.textContent = "Couldn't save: " + result.error;
    errorEl.style.display = "block";
    return;
  }

  pendingWarning = result.warning || null;
  closeForm();
  renderSignedIn();
}

async function saveReminderPrefs() {
  const btn = document.getElementById("save-reminders");
  btn.textContent = "Saving...";
  await window.DVCAuth.updateProfile({
    reminder_opt_in: document.getElementById("r-opt-in").checked,
    reminder_lead_days: parseInt(document.getElementById("r-lead-days").value, 10) || 14,
  });
  btn.textContent = "Saved";
  setTimeout(() => { btn.textContent = "Save"; }, 1500);
}

async function handleDeleteAccount() {
  if (!confirm("Permanently delete your account? This removes every contract, all trip history, and every saved itinerary. This can't be undone.")) return;
  if (prompt('Type DELETE to confirm:') !== "DELETE") return;

  const btn = document.getElementById("delete-account");
  btn.textContent = "Deleting...";
  btn.disabled = true;
  const { error } = await window.DVCAuth.deleteAccount();
  if (error) {
    alert(`Couldn't delete account: ${error}`);
    btn.textContent = "Delete My Account";
    btn.disabled = false;
    return;
  }
  window.location.href = "index.html";
}

function render(session) {
  if (!window.DVCAuth.isConfigured()) {
    renderUnconfigured();
  } else if (session) {
    renderSignedIn();
  } else {
    renderGate();
  }
}

// auth.js's module script executes asynchronously; poll briefly for
// window.DVCAuth to exist rather than assuming it's ready by the time this
// inline script runs (same reasoning as auth.js's own header-control code).
function waitForAuth(attempts) {
  if (window.DVCAuth) {
    window.DVCAuth.onAuthChange(render);
  } else if (attempts > 0) {
    setTimeout(() => waitForAuth(attempts - 1), 50);
  } else {
    renderUnconfigured();
  }
}
waitForAuth(40);
  </script>
